      - generic [ref=e59]:
        - heading "Answer" [level=2] [ref=e60]
        - generic [ref=e61]:
          - heading "Secrets Management for Microservices on Kubernetes" [level=2] [ref=e62]
          - 'heading "Architecture: External Secrets Operator + AWS Secrets Manager" [level=3] [ref=e63]'
          - paragraph [ref=e64]:
            - text: The most production-reliable pattern combines External Secrets Operator (ESO) with AWS Secrets Manager. ESO runs as a controller in the cluster and syncs secrets from AWS into Kubernetes
            - code [ref=e65]: Secret
            - text: objects on a configurable schedule (typically 1-5 minutes).
          - paragraph [ref=e66]: "Install ESO via Helm:"
          - code [ref=e69]: helm repo add external-secrets https://charts.external-secrets.io helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
          - paragraph [ref=e70]:
            - text: Each microservice gets its own
            - code [ref=e71]: SecretStore
            - text: or you use a shared
            - code [ref=e72]: ClusterSecretStore
            - text: "pointed at AWS Secrets Manager:"
          - code [ref=e75]: "apiVersion: external-secrets.io/v1beta1 kind: ClusterSecretStore metadata: name: aws-secrets-manager spec: provider: aws: service: SecretsManager region: ap-south-1 auth: jwt: serviceAccountRef: name: external-secrets-sa namespace: external-secrets"
          - paragraph [ref=e76]:
            - text: Then each service defines an
            - code [ref=e77]: ExternalSecret
            - text: "that pulls only its own secrets:"
          - code [ref=e80]: "apiVersion: external-secrets.io/v1beta1 kind: ExternalSecret metadata: name: payments-db-credentials namespace: payments spec: refreshInterval: 2m secretStoreRef: name: aws-secrets-manager kind: ClusterSecretStore target: name: payments-db-credentials creationPolicy: Owner data: - secretKey: db_password remoteRef: key: /prd/payments/db property: password"
          - heading "Per-Service Isolation with IRSA" [level=3] [ref=e81]
          - paragraph [ref=e82]:
            - text: Each microservice gets a dedicated Kubernetes
            - code [ref=e83]: ServiceAccount
            - text: mapped to its own IAM role via IRSA (IAM Roles for Service Accounts). The IAM policy on each role is scoped to exactly the secrets that service needs - nothing broader.
          - code [ref=e86]: eksctl create iamserviceaccount --name payments-sa --namespace payments --cluster prod-cluster --attach-policy-arn arn:aws:iam::123456789012:policy/PaymentsSecretsPolicy --approve
          - paragraph [ref=e87]: "The IAM policy uses a resource-level condition to restrict access:"
          - code [ref=e90]: "{ \"Effect\": \"Allow\", \"Action\": [\"secretsmanager:GetSecretValue\", \"secretsmanager:DescribeSecret\"], \"Resource\": \"arn:aws:secretsmanager:ap-south-1:123456789012:secret:/prd/payments/*\" }"
          - paragraph [ref=e91]:
            - text: The pod spec references this service account - and only this service account - so even if a payments pod is compromised, the blast radius is limited to
            - code [ref=e92]: /prd/payments/*
            - text: secrets.
          - heading "Rotation Without Downtime" [level=3] [ref=e93]
          - paragraph [ref=e94]:
            - text: "Secret rotation is where most teams introduce unnecessary downtime. The correct model is: rotate in AWS Secrets Manager, let ESO sync the updated value into the Kubernetes"
            - code [ref=e95]: Secret
            - text: ", and have the application pick up the change without restarting."
          - paragraph [ref=e96]: "Two practical approaches:"
          - paragraph [ref=e97]:
            - strong [ref=e98]: 1. Secret volume mount with inotify or periodic reload
          - paragraph [ref=e99]:
            - text: Mount the secret as a file (not an env var - env vars are baked at container start). Applications like Nginx or Envoy can reload config on
            - code [ref=e100]: SIGHUP
            - text: . For custom services, implement a reload endpoint or a goroutine/thread that re-reads the file every 60 seconds.
          - code [ref=e103]: "volumeMounts: - name: db-credentials mountPath: /etc/secrets readOnly: true volumes: - name: db-credentials secret: secretName: payments-db-credentials"
          - paragraph [ref=e104]:
            - strong [ref=e105]: 2. Secrets Store CSI Driver (for direct AWS integration)
          - paragraph [ref=e106]:
            - text: The CSI driver mounts secrets directly from Secrets Manager into the pod filesystem and supports auto-rotation via the
            - code [ref=e107]: rotation
            - text: flag. When Secrets Manager rotates a secret, the mounted file updates without pod restart within the
            - code [ref=e108]: rotationPollInterval
            - text: .
          - code [ref=e111]: "parameters: objects: | - objectName: /prd/payments/db objectType: secretsmanager objectAlias: db_password rotationPollIntervalInSeconds: \"120\""
          - paragraph [ref=e112]: Avoid injecting secrets as environment variables for anything that rotates - you will always need a pod restart to pick them up.
          - heading "Audit and Alerting" [level=3] [ref=e113]
          - paragraph [ref=e114]: All Secrets Manager API calls appear in CloudTrail automatically - no configuration needed. Enable CloudTrail in your account if it is not already running.
          - paragraph [ref=e115]: "For rotation, enable AWS-managed rotation on each secret:"
          - code [ref=e118]: aws secretsmanager rotate-secret --secret-id /prd/payments/db --rotation-lambda-arn arn:aws:lambda:ap-south-1:123456789012:function:RotateDbPassword --rotation-rules AutomaticallyAfterDays=30
          - paragraph [ref=e119]:
            - text: Set up CloudWatch Metric Filters to alert on anomalous access patterns - for example,
            - code [ref=e120]: GetSecretValue
            - text: "calls from unexpected IAM principals or unusually high call volumes:"
          - code [ref=e123]: aws cloudwatch put-metric-alarm --alarm-name secrets-unusual-access --metric-name CallCount --namespace AWS/SecretsManager --statistic Sum --period 300 --threshold 50 --comparison-operator GreaterThanThreshold --alarm-actions arn:aws:sns:...:security-alerts
          - paragraph [ref=e124]: AWS Security Hub and GuardDuty also surface anomalous Secrets Manager access (e.g., access from a Tor exit node or from an unexpected region) with no custom logic required.
          - heading "Summary" [level=3] [ref=e125]
          - paragraph [ref=e126]: "The complete flow is: Secrets Manager holds the source of truth, IRSA scopes each service's read access to its own path, ESO syncs on a 2-minute interval into namespaced Kubernetes Secrets, pods mount secrets as files so rotation is picked up without restarts, and CloudTrail provides a full audit log with CloudWatch alerts watching for spikes or unexpected principals."
