          - heading "How do you handle observability for ephemeral infrastructure - containers, spot instances, and Lambda functions?" [level=1] [ref=e54]
          - button "1" [ref=e56]:
            - img [ref=e57]
            - generic [ref=e59]: "1"
        - generic [ref=e60]:
          - generic [ref=e61]:
            - generic [ref=e62]: 📡
            - text: Observability
          - generic [ref=e63]: Medium
      - generic [ref=e64]:
        - heading "Answer" [level=2] [ref=e65]
        - generic [ref=e66]:
          - heading "Observability for Ephemeral Infrastructure" [level=2] [ref=e67]
          - paragraph [ref=e68]: Ephemeral infrastructure breaks the traditional "log in and look around" debugging model. When a container lives for 30 seconds or a Lambda function executes and vanishes, you need observability baked in from the start, not bolted on afterward.
          - heading "Push-Based Log Shipping" [level=3] [ref=e69]
          - paragraph [ref=e70]: "The cardinal rule: logs must leave the host before the host disappears."
          - paragraph [ref=e71]:
            - text: For containers, run FluentBit as a sidecar (ECS) or DaemonSet (EKS) that tails log files and forwards them to CloudWatch Logs or an aggregation layer. In ECS, use the
            - code [ref=e72]: awsfirelens
            - text: "log driver with a FluentBit sidecar container:"
          - code [ref=e75]: "{ \"logConfiguration\": { \"logDriver\": \"awsfirelens\", \"options\": { \"Name\": \"cloudwatch_logs\", \"region\": \"ap-south-1\", \"log_group_name\": \"/ecs/my-service\", \"log_stream_prefix\": \"from-fluent-bit/\" } } }"
          - paragraph [ref=e76]: For Lambda, use a Lambda Extension (runs as a separate process in the same execution environment) to forward logs to your destination before the sandbox freezes. AWS's own CloudWatch Logs extension handles this, but for third-party tools like Datadog or New Relic, their extensions intercept the Lambda Logs API and flush before the invocation ends.
          - paragraph [ref=e77]:
            - text: For Spot instances, the termination notice gives you 2 minutes. Add a CloudWatch Events rule on
            - code [ref=e78]: EC2 Spot Instance Interruption Warning
            - text: to trigger a Lambda that can mark the instance in your monitoring system, drain it from the load balancer, and tag its final logs.
          - heading "Metrics Without Host Agents" [level=3] [ref=e79]
          - paragraph [ref=e80]: Traditional host-based agents (Prometheus node_exporter, CloudWatch agent with full config) assume long-lived hosts. For ephemeral workloads, use in-process instrumentation instead.
          - paragraph [ref=e81]:
            - strong [ref=e82]: "Lambda - CloudWatch Embedded Metrics Format (EMF):"
            - text: "EMF lets you embed structured metric data inside log lines. The CloudWatch Logs agent extracts them asynchronously - no API call overhead in the hot path:"
          - code [ref=e85]: "import json def lambda_handler(event, context): # Business logic here duration_ms = 142 # EMF payload - goes to stdout, extracted automatically print(json.dumps({ \"_aws\": { \"Timestamp\": 1717200000000, \"CloudWatchMetrics\": [{ \"Namespace\": \"MyApp\", \"Dimensions\": [[\"service\", \"environment\"]], \"Metrics\": [{\"Name\": \"ProcessingDuration\", \"Unit\": \"Milliseconds\"}] }] }, \"service\": \"order-processor\", \"environment\": \"prd\", \"ProcessingDuration\": duration_ms }))"
          - paragraph [ref=e86]:
            - strong [ref=e87]: "Containers:"
            - text: "Use cAdvisor (bundled in EKS nodes via kubelet) or CloudWatch Container Insights, which automatically collects CPU, memory, network, and disk per container without any agent configuration inside the container image itself. Enable it with:"
          - code [ref=e90]: aws eks update-addon --cluster-name my-cluster --addon-name amazon-cloudwatch-observability --region ap-south-1
          - heading "Distributed Tracing Across Ephemeral Boundaries" [level=3] [ref=e91]
          - paragraph [ref=e92]: Without tracing, a request that touches an API Gateway, two Lambda functions, an SQS queue, and an ECS task produces five disconnected log streams. Distributed tracing stitches them into a single timeline.
          - paragraph [ref=e93]:
            - text: Use AWS X-Ray or OpenTelemetry (OTel). The key is propagating trace context across every async boundary - including SQS messages, where the trace header goes into
            - code [ref=e94]: MessageAttributes
            - text: ":"
          - code [ref=e97]: "from opentelemetry.propagate import inject message_attributes = {} inject(message_attributes) # Injects traceparent, tracestate sqs.send_message( QueueUrl=queue_url, MessageBody=json.dumps(payload), MessageAttributes=message_attributes )"
          - paragraph [ref=e98]: The consumer then extracts this context and creates a child span, maintaining the trace across the async gap.
          - paragraph [ref=e99]: For Lambda cold starts specifically, traces reveal where time is actually spent - initialization vs. handler execution - which is critical for latency debugging when you cannot attach a profiler.
          - heading "Design for Ephemerality" [level=3] [ref=e100]
          - paragraph [ref=e101]: "The most important shift is making host identity irrelevant. Every log line must carry enough context to be useful in isolation:"
          - code [ref=e104]: "{ \"timestamp\": \"2026-05-31T10:22:00Z\", \"trace_id\": \"1-abc123-def456\", \"service\": \"payment-processor\", \"version\": \"1.4.2\", \"environment\": \"prd\", \"request_id\": \"req-789xyz\", \"user_id\": \"usr-001\", \"event\": \"charge_attempted\", \"amount_cents\": 4999, \"duration_ms\": 87, \"outcome\": \"success\" }"
          - paragraph [ref=e105]:
            - text: Notice there is no
            - code [ref=e106]: hostname
            - text: or
            - code [ref=e107]: container_id
            - text: field - those are irrelevant because the container is gone. The
            - code [ref=e108]: trace_id
            - text: and
            - code [ref=e109]: request_id
            - text: let you correlate across services. The
            - code [ref=e110]: version
            - text: field tells you exactly which code ran.
          - paragraph [ref=e111]: Set this structured context once using a logging middleware layer, and every log line in the service inherits it. For Lambda, set request-scoped fields at the start of the handler and use a thread-local or context-var logger throughout.
          - heading "Retention and Cost" [level=3] [ref=e112]
          - paragraph [ref=e113]: Ephemeral infrastructure can generate log volume proportional to invocation count rather than host count - Lambda at scale produces enormous log data. Set CloudWatch Logs retention policies aggressively (7 days for debug, 30 days for info, 1 year for audit trails), and filter at the FluentBit/extension layer to drop health check noise before it hits your log aggregator.
