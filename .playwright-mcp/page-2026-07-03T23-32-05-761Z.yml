        - paragraph [ref=e469]: Three system design rounds in my Google loop. I drilled with Camora every night for two weeks — Sona's pub/sub and distributed cache diagrams were almost exactly what I drew on the whiteboard. L5 offer landed two weeks after the final round.
        - generic [ref=e472]:
          - paragraph [ref=e473]: Shreya Patel
          - paragraph [ref=e474]: SWE L4 → L5, Search Infrastructure · Google
      - generic [ref=e476]:
        - img [ref=e477]
        - paragraph [ref=e479]: Meta's bar for backend is brutally specific. Camora had me drilling connection pools, cache eviction policies, and rate-limiting until I could derive them from first principles. Six weeks of prep. E5 offer on the first attempt.
        - generic [ref=e482]:
          - paragraph [ref=e483]: Jordan Kim
          - paragraph [ref=e484]: E4 → E5 Backend SWE, Instagram Feed · Meta
      - generic [ref=e486]:
        - img [ref=e487]
        - paragraph [ref=e489]: Did 180 LP questions using Camora's behavioral module. STAR answers anchored to my actual project history, not generic templates. The behavioral round was the easiest part of the loop. SDE III on the DynamoDB team.
        - generic [ref=e492]:
          - paragraph [ref=e493]: Ravi Krishnamurthy
          - paragraph [ref=e494]: SDE II → SDE III, AWS DynamoDB · Amazon
      - generic [ref=e496]:
        - img [ref=e497]
        - paragraph [ref=e499]: Apple's onsite is six hours back to back. Camora's mock sessions scored my system design explanations and flagged where I was hand-waving. Fixed those gaps before the real thing. CoreML team offer, 10 days after the loop.
        - generic [ref=e502]:
          - paragraph [ref=e503]: Caitlin O'Brien
          - paragraph [ref=e504]: Senior SWE, CoreML Platform · Apple
      - generic [ref=e506]:
        - img [ref=e507]
        - paragraph [ref=e509]: Netflix moves fast. During my virtual onsite, Sona transcribed the interviewer's question and surfaced the relevant design tradeoffs while I was still organizing my thoughts. That 8-second window saved me on the CDN design round.
        - generic [ref=e512]:
