        - generic [ref=e53]:
          - heading "Your security scan tool is blocking every CI/CD pipeline deployment because it flags vulnerabilities in base images. How do you build a practical policy?" [level=1] [ref=e54]
          - generic [ref=e55]:
            - button "0" [ref=e56] [cursor=pointer]:
              - img [ref=e57]
              - generic [ref=e59]: "0"
