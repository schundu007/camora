            - text: Security
          - generic [ref=e66]: Medium
      - generic [ref=e67]:
        - heading "Answer" [level=2] [ref=e68]
        - generic [ref=e69]:
          - heading "Building a Practical Vulnerability Policy for CI/CD Pipelines" [level=2] [ref=e70]
          - paragraph [ref=e71]: A scanner that blocks everything is just as broken as one that blocks nothing. The goal is a policy that stops genuinely dangerous vulnerabilities from reaching production while keeping deployments moving.
          - heading "Risk-Based Severity Tiers" [level=3] [ref=e72]
          - paragraph [ref=e73]: Define explicit block/track rules by severity, and commit them to a config file in the repo so every team uses the same thresholds.
          - code [ref=e76]: "# .trivyignore-policy.yaml (or in your scanner config) severity_policy: CRITICAL: block # always block, no exceptions without approval HIGH: conditional # block if a fix exists; allow with justification if no fix MEDIUM: track # create ticket, fix within 30 days LOW: suppress # log only, no ticket required UNKNOWN: track # treat like MEDIUM until classified"
          - paragraph [ref=e77]: "In practice, a Trivy step in GitHub Actions looks like:"
          - code [ref=e80]: "- name: Scan image run: | trivy image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed --format sarif --output trivy-results.sarif $IMAGE_TAG"
          - paragraph [ref=e81]:
            - text: The
            - code [ref=e82]: "--ignore-unfixed"
            - text: "flag is the first practical concession: if there is no upstream fix yet, blocking the build punishes the team without any remediation path. For those cases, use the exception workflow below instead."
          - heading "Reachability Analysis" [level=3] [ref=e83]
          - paragraph [ref=e84]:
            - text: Not every CVE in an installed package is exploitable. A crypto library vulnerability flagged in a Python base image may exist in a package installed only by
            - code [ref=e85]: pip
            - text: tooling at build time, never loaded at runtime.
          - paragraph [ref=e86]:
            - text: Tools like
            - link "Grype" [ref=e87] [cursor=pointer]:
              - /url: https://github.com/anchore/grype
            - text: and Trivy's
            - code [ref=e88]: "--vex"
            - text: "support let you attach a VEX (Vulnerability Exploitability eXchange) document that records a reachability decision:"
          - code [ref=e91]: "{ \"vulnerability\": \"CVE-2023-4863\", \"product\": \"libwebp\", \"status\": \"not_affected\", \"justification\": \"component_not_present\", \"impact_statement\": \"libwebp is installed by the base image but not linked or called by any application code. Confirmed via ldd and strace in staging.\" }"
          - paragraph [ref=e92]: This decision gets peer-reviewed and merged like any other code change, not made verbally or in a Slack thread.
          - paragraph [ref=e93]: For AWS workloads, Amazon Inspector's Lambda and ECR scanning can show you per-function reachability context. On Kubernetes, tools like Kubescape cross-reference running containers against the CVE list so you can see whether a vulnerable image is actually deployed in a reachable path.
          - heading "Exception Workflow" [level=3] [ref=e94]
          - paragraph [ref=e95]: When a CVE must be accepted temporarily (no fix available, reachability confirmed low, vendor acknowledgment pending), enforce a structured process rather than a scanner bypass.
          - list [ref=e96]:
            - listitem [ref=e97]: "Engineer opens a JIRA ticket with: CVE ID, affected image, severity, justification, reachability evidence, and an expiry date (maximum 90 days for HIGH, 30 days for CRITICAL in rare cases)."
            - listitem [ref=e98]: A security team member or designated reviewer approves.
            - listitem [ref=e99]:
              - text: The CVE is added to the
              - code [ref=e100]: .trivyignore
              - text: "file with a comment linking the ticket and expiry:"
          - code [ref=e102]: "# JIRA: SEC-412 | Expires: 2026-08-01 | Reason: no fix upstream, libssl not reachable in prod CVE-2024-12345"
          - list [ref=e103]:
            - listitem [ref=e104]: "A CI job checks expiry dates on every run and fails the build if an exception has expired without renewal:"
          - code [ref=e107]: "#!/bin/bash TODAY=$(date +%Y-%m-%d) while IFS= read -r line; do if [[ $line =~ Expires:\\ ([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then EXPIRY=\"${BASH_REMATCH[1]}\" if [[ \"$TODAY\" > \"$EXPIRY\" ]]; then echo \"ERROR: Expired CVE exception found - $line\" exit 1 fi fi done < .trivyignore"
          - paragraph [ref=e108]:
            - text: This prevents
            - code [ref=e109]: .trivyignore
            - text: from becoming a permanent graveyard of forgotten suppressions.
          - 'heading "Operational Hygiene: Reducing the Baseline" [level=3] [ref=e110]'
          - paragraph [ref=e111]: "The cheapest CVE is one that never enters your image. Three habits keep the baseline low:"
          - paragraph [ref=e112]:
            - strong [ref=e113]: Use minimal base images.
            - text: Switch from
            - code [ref=e114]: python:3.11
            - text: (500+ packages) to
            - code [ref=e115]: python:3.11-slim
            - text: or
            - code [ref=e116]: gcr.io/distroless/python3
            - text: . Fewer packages means fewer CVEs to manage. Alpine is effective but introduces musl libc, which can cause subtle runtime differences in C extension code - test before adopting site-wide.
          - paragraph [ref=e117]:
            - strong [ref=e118]: Rebuild base images weekly.
            - text: "Most CVE fixes ship in upstream OS packages. A GitHub Actions scheduled job that rebuilds and pushes internal base images every Sunday picks up those fixes automatically without any developer action:"
          - code [ref=e121]: "on: schedule: - cron: '0 2 * * 0' # 2am UTC every Sunday"
          - paragraph [ref=e122]:
            - strong [ref=e123]: Automate dependency updates.
            - text: Dependabot or Renovate PRs for both
            - code [ref=e124]: requirements.txt
            - text: and
            - code [ref=e125]: Dockerfile
            - text: base image digests keep you ahead of known vulnerabilities rather than reacting to scanner noise. Pin images by digest (
            - code [ref=e126]: FROM python:3.11-slim@sha256:abc123
            - text: ) so Renovate can track and propose upgrades with a concrete diff.
          - heading "Putting It Together" [level=3] [ref=e127]
          - paragraph [ref=e128]: "The policy works as a funnel: reachability analysis removes false positives at the top, severity tiers determine the default action, exceptions handle the remainder with time-limited approvals, and hygiene practices shrink the problem space week over week. Each layer is auditable and reviewable, which matters both for security posture and for keeping the team's trust in the pipeline."
