                  - button "Q01 How does the Datadog Bits AI SRE hypothesis loop work end to end?" [ref=e988]:
                    - generic [ref=e989]: Q01
                    - heading "How does the Datadog Bits AI SRE hypothesis loop work end to end?" [level=4] [ref=e990]
                    - img [ref=e991]
                  - generic [ref=e996]:
                    - paragraph [ref=e997]:
                      - strong [ref=e998]: Bits AI
                      - strong [ref=e999]: SRE
                      - text: operates as an autonomous investigation agent that runs continuously alongside an active incident, iterating until it reaches a high-confidence conclusion or determines that human escalation is necessary.
                    - paragraph [ref=e1000]:
                      - text: The loop begins at incident trigger. When
                      - strong [ref=e1001]: PagerDuty
                      - text: or
                      - strong [ref=e1002]: Datadog
                      - text: creates an incident,
                      - strong [ref=e1003]: Bits AI
                      - text: "receives the full alert payload: affected services, firing alert types, current"
                      - strong [ref=e1004]: SLO
                      - text: burn rate, and recent change events already pre-correlated by
                      - strong [ref=e1005]: Watchdog
                      - text: Insights. This initial context is the starting state for the hypothesis generation step.
                    - paragraph [ref=e1006]:
                      - text: Hypothesis generation is the first
                      - strong [ref=e1007]: LLM
                      - text: "call in the loop. The model reads the incident context and generates three to five candidate hypotheses ranked by prior probability given the available evidence. For an auth service incident with an adjacent deploy event, the hypotheses might be:"
                      - emphasis [ref=e1008]: Deploy 4.8.1 introduced a configuration change that exhausted the DB connection pool,
                      - emphasis [ref=e1009]: Upstream traffic spike is overwhelming the auth service's current capacity,
                      - emphasis [ref=e1010]: The auth-db-primary is experiencing hardware degradation independent of any deploy.
                      - text: Each hypothesis maps to specific evidence that would confirm or refute it.
                    - paragraph [ref=e1011]:
                      - text: Tool calling is the second step. For each hypothesis,
                      - strong [ref=e1012]: Bits AI
                      - text: selects the MCP tools that would provide confirming or refuting evidence.
                      - emphasis [ref=e1013]: Deploy 4.8.1 caused DB pool exhaustion
                      - text: "requires: get_recent_deploys(service='auth', hours=2), query_metric(metric='db.pool.active_connections', service='auth', window='30m'), and fetch_traces(service='auth', status='error', last_n=100)."
                      - strong [ref=e1014]: Bits AI
                      - text: calls these tools concurrently via MCP and receives structured results.
                    - paragraph [ref=e1015]: Evidence evaluation is the third step. The model reads the tool results and updates hypothesis confidence. If the DB pool metric shows saturation beginning 4 minutes after the deploy timestamp, the first hypothesis gains high confidence. If the traffic metric shows no unusual spike, the second hypothesis is deprioritized. If the DB hardware metrics show no degradation, the third hypothesis is eliminated.
                    - paragraph [ref=e1016]:
                      - text: "The loop condition: if the top hypothesis has confidence above a configured threshold (typically 0.8), the agent writes a conclusion and summary. If the evidence is ambiguous, the agent generates refined hypotheses --"
                      - emphasis [ref=e1017]: which specific config change in deploy 4.8.1 is relevant to DB pool configuration?
                      - text: "-- and loops. After two to three loops the agent either concludes or presents its top hypotheses to the on-call engineer with the evidence chain for each, explicitly marking confidence levels and gaps in the evidence."
                - generic [ref=e1018]:
                  - button "Q02 Compare Dynatrace Davis hypermodal AI with pure LLM-based agents like Bits AI for incident investigation." [ref=e1019]:
                    - generic [ref=e1020]: Q02
                    - heading "Compare Dynatrace Davis hypermodal AI with pure LLM-based agents like Bits AI for incident investigation." [level=4] [ref=e1021]
                    - img [ref=e1022]
                  - generic [ref=e1027]:
                    - paragraph [ref=e1028]:
                      - text: Davis and
                      - strong [ref=e1029]: Bits AI
                      - text: represent two different philosophical approaches to AI-assisted incident investigation, and their respective strengths map to different organizational and technical contexts.
                    - paragraph [ref=e1030]:
                      - text: Davis hypermodal AI is built on determinism at the causal reasoning layer. The predictive AI component (anomaly detection) uses statistical methods to fire when a metric exits its learned baseline. The causal AI component then traverses the
                      - strong [ref=e1031]: Smartscape
                      - text: topology graph -- which is maintained deterministically from OneAgent observations of every network connection and service call -- using fault-tree analysis. The traversal is graph algorithms, not ML inference.
                      - emphasis [ref=e1032]: "Auth-db-primary is the root entity because: anomaly exists on auth-db-primary, all downstream anomalies on auth-service and payment-service have a topology path to auth-db-primary, and auth-db-primary has no healthy upstream that could explain its anomaly via a different root cause."
                      - text: The confidence score on this finding is high because it is based on structural graph properties, not probabilistic inference.
                    - paragraph [ref=e1033]:
                      - text: The generative AI layer (Davis Copilot) adds natural-language explanation and query answering, but the key architectural decision is that Copilot operates on top of the deterministic causal finding rather than trying to infer causation from raw telemetry. This design prevents the
                      - strong [ref=e1034]: LLM
                      - text: "hallucination problem: the"
                      - strong [ref=e1035]: LLM
                      - text: is explaining a finding that the deterministic engine has already grounded in real data.
                    - paragraph [ref=e1036]:
                      - strong [ref=e1037]: Bits AI
                      - text: "takes a different approach: the"
                      - strong [ref=e1038]: LLM
                      - text: is the primary reasoning engine. It calls tools, evaluates evidence, and generates hypotheses through
                      - strong [ref=e1039]: LLM
                      - text: inference. This gives
                      - strong [ref=e1040]: Bits AI
                      - text: much greater flexibility -- it can reason about any tool-callable data source, not just
                      - strong [ref=e1041]: Smartscape
                      - text: topology -- but it introduces the risks inherent in
                      - strong [ref=e1042]: LLM
                      - text: "-as-reasoner: confident-wrong outputs on novel scenarios, inability to signal uncertainty, and reasoning quality bounded by training data quality."
                    - paragraph [ref=e1043]:
                      - strong [ref=e1044]: Dynatrace
                      - text: Davis is stronger in environments with full OneAgent coverage and complex service topologies where deterministic graph traversal can identify the exact root entity with high confidence.
                      - strong [ref=e1045]: Bits AI
                      - text: is stronger in environments that need flexible, extensible investigation against heterogeneous data sources and where the MCP extensibility model lets engineering teams add new tool types. In 2026, neither consistently dominates -- the choice depends on topology completeness (Davis) versus extensibility needs (
                      - strong [ref=e1046]: Bits AI
                      - text: ).
