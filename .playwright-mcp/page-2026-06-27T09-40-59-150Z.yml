              - figure [ref=e779]:
                - generic [ref=e780]:
                  - heading "Dynatrace Davis hypermodal AI — predictive + causal + generative" [level=4] [ref=e781]
                  - generic [ref=e784]:
                    - paragraph [ref=e785]:
                      - strong [ref=e786]: Dynatrace
                      - text: coined
                      - emphasis [ref=e787]: hypermodal AI
                      - text: in 2024-2025 to describe Davis combining three AI modes in one reasoning pipeline.
                    - generic [ref=e789]:
                      - term [ref=e790]: Predictive AI
                      - definition [ref=e791]:
                        - strong [ref=e792]: Watchdog
                        - text: "-style anomaly detection on metrics and traces."
                        - strong [ref=e793]: STL
                        - text: seasonal decomposition, baseline forecasting, deviation scoring. Fires when something is statistically unexpected. Davis has access to
                        - strong [ref=e794]: Smartscape
                        - text: — the real-time topology graph of every entity (host, process, service, request path) and their dependency relationships, auto-discovered and continuously updated.
                    - generic [ref=e796]: "Causal AI. When predictive AI fires an anomaly, causal AI traverses **Smartscape** to identify the root entity. Uses fault-tree analysis (borrowed from NASA/FAA avionics reliability methodology). Traces the dependency graph: frontend anomaly → backend service → database. Davis identifies the database as the root entity and marks the frontend anomaly as a downstream symptom. This is deterministic graph traversal, not ML inference — which is why **Dynatrace** calls it \"deterministic causal AI.\""
                    - generic [ref=e798]:
                      - term [ref=e799]: Generative AI (Davis Copilot)
                      - definition [ref=e800]:
                        - strong [ref=e801]: LLM
                        - text: layer that reads the causal analysis output and writes natural-language explanations, draft runbook steps, and answers natural-language observability queries (
                        - emphasis [ref=e802]: show me all services with error rate > 1% in the last hour
                        - text: ). Grail — the MPP OLAP query engine — powers sub-second queries over terabytes of telemetry that the
                        - strong [ref=e803]: LLM
                        - text: tool-calls.
                    - generic [ref=e805]: "How the three modes combine: Predictive detects → Causal traces to root entity → Generative explains and surfaces actions. The architecture means **Dynatrace** can say \"Auth DB pool exhaustion (96% confidence, root entity: auth-db-prod-01, 3 affected services downstream)\" rather than \"something is wrong with auth.\""
                    - generic [ref=e807]:
