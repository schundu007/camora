                    - generic [ref=e830]: "**New Relic** AI. Natural-language query interface over NRQL (**New Relic** Query Language). \"Show me services with p99 latency above 500ms over the last 4 hours\" → auto-generated NRQL → rendered chart. Anomaly explanation in plain English attached to Applied Intelligence findings. Particularly strong at multi-signal correlation (**APM** + infrastructure + browser + synthetics in one interface)."
                    - generic [ref=e832]: ServiceNow Now Assist for ITOM. **LLM** layer over the CMDB and ITSM workflow. Reads alert → looks up affected CI in CMDB → finds change records for that CI from the last 48 hours → surfaces probable change-caused incident. Generates draft incident ticket with affected CIs, related changes, and suggested assignment group. Strong in enterprises where ITSM is the source of truth; weaker in cloud-native environments where CMDB coverage is incomplete.
