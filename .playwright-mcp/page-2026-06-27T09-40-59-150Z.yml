                      - text: "layer focuses on incident lifecycle, not detection. Incident Summarization: GPT-4 family reads the incident event stream (alerts, ack notes, responder messages) and writes a rolling plain-English summary visible to all stakeholders. Auto-Pause Incidents: when"
                      - strong [ref=e827]: PagerDuty
                      - text: "detects that an alert has a high probability of auto-resolving (based on historical patterns for that alert type), it pauses incident creation for 2-15 minutes. If the alert clears, no page was sent. Reduces false-positive pages by up to 30% without changing alert thresholds. Runbook Automation: Rundeck (acquired 2020) integration allows"
                      - strong [ref=e828]: PagerDuty
