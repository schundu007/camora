              - generic [ref=e680]:
                - paragraph [ref=e682]:
                  - strong [ref=e683]: LLM
                  - strong [ref=e684]: SRE
                  - text: agents represent the 2024 to 2026 evolution of
                  - strong [ref=e685]: AIOps
                  - text: from single-inference tools to reasoning loops. Earlier
                  - strong [ref=e686]: AIOps
                  - text: systems made one pass over telemetry and produced an output (alert group, anomaly score, correlation candidate).
                  - strong [ref=e687]: LLM
                  - text: "agents iterate: they generate hypotheses, call tools to gather evidence, evaluate that evidence, update their hypotheses, and iterate until confidence is high or escalation is warranted."
                - generic [ref=e688]:
                  - heading "The Hypothesis-Testing Loop" [level=4] [ref=e689]
                  - paragraph [ref=e691]:
                    - text: The core architecture of a production
                    - strong [ref=e692]: LLM
                    - strong [ref=e693]: SRE
                    - text: agent is an investigate-evaluate-iterate loop. When an incident fires, the agent receives the alert payload, affected service list, current
                    - strong [ref=e694]: SLO
                    - text: status, and recent change events. It generates three to five candidate hypotheses --
                    - emphasis [ref=e695]: auth DB pool exhaustion,
                    - emphasis [ref=e696]: recent deploy changed connection timeout,
                    - emphasis [ref=e697]: upstream latency propagating.
                    - text: "For each hypothesis it selects a tool call: query the DB pool utilization metric, fetch recent deploys for the auth service, pull error traces from the last 30 minutes. It evaluates the tool results, updates confidence scores, eliminates low-confidence hypotheses, and either writes a conclusion if confidence is high enough or generates refined hypotheses for another loop."
                    - strong [ref=e698]: Datadog
                    - text: reports two to three loops before conclusion in their
                    - strong [ref=e699]: Bits AI
                    - strong [ref=e700]: SRE
                    - text: case studies.
                - generic [ref=e701]:
                  - heading "MCP and Tool Extensibility" [level=4] [ref=e702]
                  - paragraph [ref=e704]:
                    - text: Model Context Protocol (MCP) is the architectural standard that makes
                    - strong [ref=e705]: LLM
                    - strong [ref=e706]: SRE
                    - text: agents extensible. MCP defines how an
                    - strong [ref=e707]: LLM
                    - text: calls tools -- query metrics, fetch logs, look up runbooks, list recent changes -- without requiring bespoke function signatures per vendor.
                    - strong [ref=e708]: Bits AI
                    - strong [ref=e709]: SRE
                    - text: uses MCP for tool calling, which means the agent can be extended with new data sources by defining an MCP tool, without rewriting the agent core.
                - generic [ref=e710]:
                  - heading "**Dynatrace** Hypermodal AI" [level=4] [ref=e711]
                  - paragraph [ref=e713]:
                    - strong [ref=e714]: Dynatrace
                    - text: coined
                    - emphasis [ref=e715]: hypermodal AI
                    - text: "in 2025 to describe Davis combining three AI modes: predictive AI (anomaly detection via seasonal decomposition), causal AI (deterministic graph traversal of the"
                    - strong [ref=e716]: Smartscape
                    - text: topology to find root entity), and generative AI (
                    - strong [ref=e717]: LLM
                    - text: layer that writes natural-language explanations and answers queries over Grail,
                    - strong [ref=e718]: Dynatrace
                    - text: "'s OLAP query engine). The three modes are sequential in the pipeline -- predictive fires the anomaly, causal finds the root entity, generative explains it."
                - generic [ref=e719]:
                  - heading "The Critical Prerequisite" [level=4] [ref=e720]
                  - generic [ref=e721]:
                    - paragraph [ref=e722]:
                      - strong [ref=e723]: LLM
                      - strong [ref=e724]: SRE
                      - text: agents amplify the quality of existing observability. An agent calling query_metrics() on a service with no metrics coverage returns empty results and must generate inferences -- which look like evidence if the engineer is not careful. Poor observability coverage does not prevent the agent from producing output; it prevents the output from being grounded in fact. Full metrics, traces, and logs coverage for affected services is the prerequisite, not the nice-to-have.
                    - paragraph [ref=e725]: "Autonomous remediation -- agents that not only investigate but also execute actions (restart pod, roll back deploy) -- requires additional guardrails beyond good observability: validated runbooks for each automated action, tested rollback paths, blast-radius estimation, and human approval workflows for any state-changing action until the action type has been validated through at least 20 approved executions."
