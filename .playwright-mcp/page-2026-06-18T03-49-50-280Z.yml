          - heading "Design an auto-scaling strategy for a batch processing workload that has unpredictable bursts and strict cost controls." [level=1] [ref=e54]
          - button "0" [ref=e56]:
            - img [ref=e57]
            - generic [ref=e59]: "0"
        - generic [ref=e60]:
          - generic [ref=e61]:
            - generic [ref=e62]: 🏛️
            - text: System Design
          - generic [ref=e63]: Medium
      - generic [ref=e64]:
        - heading "Answer" [level=2] [ref=e65]
        - generic [ref=e66]:
          - heading "Auto-Scaling Strategy for Unpredictable Batch Workloads" [level=2] [ref=e67]
          - paragraph [ref=e68]: Batch processing has fundamentally different scaling characteristics from web traffic. CPU is a lagging indicator - workers are often fully saturated only after the queue has already built up. The right signal is queue depth, and the right compute is Spot.
          - separator [ref=e69]
          - heading "Queue-Depth-Based Scaling" [level=2] [ref=e70]
          - paragraph [ref=e71]:
            - text: Use SQS
            - code [ref=e72]: ApproximateNumberOfMessagesVisible
            - text: as your primary scaling metric. A CloudWatch alarm watching this value drives your ASG step scaling policy.
          - code [ref=e75]: aws cloudwatch put-metric-alarm --alarm-name "sqs-queue-depth-high" --metric-name ApproximateNumberOfMessagesVisible --namespace AWS/SQS --statistic Average --period 60 --evaluation-periods 1 --threshold 100 --comparison-operator GreaterThanOrEqualToThreshold --dimensions Name=QueueName,Value=batch-jobs --alarm-actions arn:aws:autoscaling:us-east-1:123456789:scalingPolicy:...
          - paragraph [ref=e76]: "With a 1-minute evaluation period and threshold of 100 messages, the ASG reacts quickly when a burst arrives. Tie this to a step scaling policy - not target tracking - so you can configure aggressive asymmetric behavior:"
          - code [ref=e79]: "{ \"StepAdjustments\": [ { \"MetricIntervalLowerBound\": 0, \"MetricIntervalUpperBound\": 500, \"ScalingAdjustment\": 5 }, { \"MetricIntervalLowerBound\": 500, \"MetricIntervalUpperBound\": 2000, \"ScalingAdjustment\": 15 }, { \"MetricIntervalLowerBound\": 2000, \"ScalingAdjustment\": 30 } ] }"
          - paragraph [ref=e80]:
            - text: "Scale out hard and fast. Scale in conservatively: set"
            - code [ref=e81]: DefaultCooldown
            - text: to 600 seconds on scale-in, and use a separate scale-in policy triggered only when
            - code [ref=e82]: ApproximateNumberOfMessagesVisible
            - text: drops to 0 for 5 consecutive minutes. This prevents premature termination while messages are still in-flight.
          - separator [ref=e83]
          - heading "Spot Instances for Batch Cost Reduction" [level=2] [ref=e84]
          - paragraph [ref=e85]:
            - text: "Batch is the ideal Spot workload: jobs are retryable, latency is flexible, and interruptions are survivable. A Spot Fleet with"
            - code [ref=e86]: lowestPrice
            - text: allocation strategy and multiple instance families is the right setup.
          - paragraph [ref=e87]: "In your Launch Template, do not pin a single instance type. Instead, configure a mixed instances policy on the ASG:"
          - code [ref=e90]: "{ \"MixedInstancesPolicy\": { \"LaunchTemplate\": { \"LaunchTemplateSpecification\": { ... } }, \"InstancesDistribution\": { \"OnDemandBaseCapacity\": 2, \"OnDemandPercentageAboveBaseCapacity\": 0, \"SpotAllocationStrategy\": \"capacity-optimized\" }, \"Overrides\": [ { \"InstanceType\": \"m5.xlarge\" }, { \"InstanceType\": \"m5a.xlarge\" }, { \"InstanceType\": \"m4.xlarge\" }, { \"InstanceType\": \"r5.large\" }, { \"InstanceType\": \"c5.2xlarge\" } ] } }"
          - paragraph [ref=e91]:
            - text: Prefer
            - code [ref=e92]: capacity-optimized
            - text: over
            - code [ref=e93]: lowest-price
            - text: for batch - it picks from the deepest capacity pools, which reduces interruption frequency at a slight cost premium. The 2-instance On-Demand base handles any steady-state work without Spot risk.
          - paragraph [ref=e94]:
            - text: When a Spot interruption notice fires (2-minute warning via EC2 metadata), your worker must catch
            - code [ref=e95]: SIGTERM
            - text: ", stop pulling new messages, and let the current job finish or release the SQS message back to the queue (by deleting the in-flight message lock). Use a visibility timeout on your SQS messages that matches your max job duration, so interrupted jobs automatically become visible again."
          - separator [ref=e96]
          - heading "Handling Burst Spikes" [level=2] [ref=e97]
          - paragraph [ref=e98]:
            - text: The combination of
            - code [ref=e99]: "evaluation-periods: 1"
            - text: and aggressive step scaling means your ASG reacts within 2-3 minutes of a queue spike. For even faster reaction, combine this with a Lambda-based custom metric publisher that polls SQS every 30 seconds and pushes a
            - code [ref=e100]: MessagesPerWorker
            - text: ratio metric to CloudWatch. This lets you scale on queue depth normalized by current capacity rather than raw depth.
          - paragraph [ref=e101]: "For jobs that take 5-30 minutes each, pre-warming matters. If your queue regularly fills at predictable times (end-of-day ETL, nightly reports), use a scheduled scaling action to pre-scale 10 minutes before the expected burst:"
          - code [ref=e104]: aws autoscaling put-scheduled-update-group-action --auto-scaling-group-name batch-asg --scheduled-action-name pre-warm-nightly --recurrence "50 23 * * *" --min-size 5 --desired-capacity 10
          - separator [ref=e105]
          - heading "Cost Controls" [level=2] [ref=e106]
          - paragraph [ref=e107]:
            - text: Set
            - code [ref=e108]: MaxSize
            - text: on the ASG to a hard ceiling that maps to your monthly budget. For example, 20x
            - code [ref=e109]: m5.xlarge
            - text: Spot instances at roughly $0.07/hr gives a ceiling of ~$100/day. This is your primary cost guardrail - the ASG physically cannot exceed it.
          - paragraph [ref=e110]: "Layer AWS Budgets on top for early warning:"
          - code [ref=e113]: "aws budgets create-budget --account-id 123456789 --budget '{ \"BudgetName\": \"batch-monthly\", \"BudgetLimit\": { \"Amount\": \"500\", \"Unit\": \"USD\" }, \"TimeUnit\": \"MONTHLY\", \"BudgetType\": \"COST\" }' --notifications-with-subscribers '[{ \"Notification\": { \"NotificationType\": \"ACTUAL\", \"ComparisonOperator\": \"GREATER_THAN\", \"Threshold\": 80 }, \"Subscribers\": [{ \"SubscriptionType\": \"SNS\", \"Address\": \"arn:aws:sns:...\" }] }]'"
          - paragraph [ref=e114]:
            - text: The SNS notification at 80% can trigger a Lambda that reduces
            - code [ref=e115]: MaxSize
            - text: on the ASG or posts to Slack. At 100%, a second alarm forces
            - code [ref=e116]: MaxSize
            - text: to the On-Demand base capacity, effectively halting Spot scale-out until the next billing cycle.
          - paragraph [ref=e117]: This layered approach - queue-depth triggers, Spot with capacity-optimized strategy, asymmetric scale-in cooldowns, and hard ASG ceilings - gives you responsive, cost-bounded batch scaling without relying on CPU metrics that react too slowly to burst patterns.
