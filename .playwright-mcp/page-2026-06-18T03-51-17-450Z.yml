          - heading "Design a rate limiting system that works across multiple instances of a distributed API gateway." [level=1] [ref=e49]
          - button "0" [ref=e51] [cursor=pointer]:
            - img [ref=e52]
            - generic [ref=e54]: "0"
        - generic [ref=e55]:
          - generic [ref=e56]:
            - generic [ref=e57]: 🏛️
            - text: System Design
          - generic [ref=e58]: Medium
      - generic [ref=e59]:
        - heading "Answer" [level=2] [ref=e60]
        - generic [ref=e61]:
          - heading "Designing a Rate Limiting System for a Distributed API Gateway" [level=2] [ref=e248]
          - paragraph [ref=e249]: When rate limiting spans multiple gateway instances, the core challenge is shared state. A single instance can track counters in memory, but with horizontal scaling you need a centralized store that all instances can read and write atomically.
          - heading "Algorithm Choice" [level=3] [ref=e250]
          - paragraph [ref=e251]:
            - strong [ref=e252]: Token Bucket
            - text: is the most practical for API gateways. Each client gets a bucket with a fixed capacity (e.g. 100 tokens). Tokens refill at a constant rate (e.g. 10/second). Each request consumes one token. Burst traffic is absorbed up to the bucket capacity, then requests are rejected until tokens refill.
          - paragraph [ref=e253]:
            - strong [ref=e254]: Sliding Window
            - text: is stricter. Instead of a fixed replenishment schedule, it counts requests within a rolling time window (e.g. the last 60 seconds). This prevents the "double burst" problem where a client fires 100 requests at 11:59 and another 100 at 12:00 under a fixed-window scheme.
          - paragraph [ref=e255]: For most production APIs, token bucket is the right default. Use sliding window when you need hard per-minute guarantees, such as payment or SMS APIs.
          - heading "Redis as the Distributed Store" [level=3] [ref=e256]
          - paragraph [ref=e257]: Redis is the standard backend for distributed rate limiting. The key operation - check the current count and decrement it - must be atomic. A non-atomic read-then-write creates a race condition across instances.
          - paragraph [ref=e258]: "Use a Lua script to make the check-and-decrement atomic:"
          - code [ref=e260]: "-- Token bucket check in Lua (runs atomically in Redis) local key = KEYS[1] local capacity = tonumber(ARGV[1]) local refill_rate = tonumber(ARGV[2]) -- tokens per second local now = tonumber(ARGV[3]) local data = redis.call('HMGET', key, 'tokens', 'last_refill') local tokens = tonumber(data[1]) or capacity local last_refill = tonumber(data[2]) or now local elapsed = now - last_refill local refilled = math.min(capacity, tokens + (elapsed * refill_rate)) if refilled < 1 then return 0 -- rate limited end redis.call('HMSET', key, 'tokens', refilled - 1, 'last_refill', now) redis.call('EXPIRE', key, 3600) return 1 -- allowed"
          - paragraph [ref=e261]:
            - text: Call this from your gateway with
            - code [ref=e262]: EVAL
            - text: or load it using
            - code [ref=e263]: SCRIPT LOAD
            - text: and call via
            - code [ref=e264]: EVALSHA
            - text: for efficiency.
          - paragraph [ref=e265]:
            - text: "Key naming convention:"
            - code [ref=e266]: "ratelimit:{client_id}:{window}"
            - text: "- for example"
            - code [ref=e267]: ratelimit:user:42:60s
            - text: .
          - heading "Sliding Window with Redis Sorted Sets" [level=3] [ref=e268]
          - paragraph [ref=e269]: "For sliding window, store request timestamps as scores in a sorted set:"
          - code [ref=e271]: "# On each request for client \"user:42\": MULTI ZREMRANGEBYSCORE ratelimit:user:42 0 (now_ms - window_ms) # remove expired ZADD ratelimit:user:42 now_ms now_ms # add current request ZCARD ratelimit:user:42 # count in window EXPIRE ratelimit:user:42 window_seconds EXEC"
          - paragraph [ref=e272]:
            - text: The
            - code [ref=e273]: ZCARD
            - text: "result tells you whether the client has exceeded the limit. The downside is memory: each request adds an entry. For high-traffic APIs, token bucket with a compact hash is more memory-efficient."
          - heading "Redis High Availability" [level=3] [ref=e274]
          - paragraph [ref=e275]: "A single Redis node is a single point of failure. Two options:"
          - paragraph [ref=e276]:
            - strong [ref=e277]: Redis Sentinel
            - text: "- one primary, two replicas, three Sentinels monitoring them. Automatic failover in 10-30 seconds. Suitable for simpler deployments. On AWS, ElastiCache with Multi-AZ replication handles this."
          - paragraph [ref=e278]:
            - strong [ref=e279]: Redis Cluster
            - text: "- data sharded across multiple primaries, each with replicas. Scales write throughput and tolerates node failures. Use when you have millions of unique client keys or require sub-millisecond latency at scale."
          - code [ref=e281]: "# Connect to Redis Cluster from your gateway redis-cli -c -h aci-redis-cluster.xxxxx.clustercfg.apse1.cache.amazonaws.com -p 6379"
          - heading "Fallback When Redis is Unavailable" [level=3] [ref=e282]
          - paragraph [ref=e283]: "Redis unavailability should not take down your API. Two strategies:"
          - list [ref=e284]:
            - listitem [ref=e285]:
              - strong [ref=e286]: Fail open
              - text: "- allow all requests when Redis is unreachable. Risk of abuse, but keeps the API available."
            - listitem [ref=e287]:
              - strong [ref=e288]: Local fallback cache
              - text: "- each gateway instance maintains an in-memory counter as a fallback. This is less accurate (instances don't share state) but prevents a total outage. Set a lower local limit (e.g. 50% of normal) to compensate."
          - paragraph [ref=e289]: "In practice: fail open for most APIs, use local fallback for sensitive endpoints, and set aggressive circuit-breaker timeouts (100-200ms) so a slow Redis doesn't add latency to every request."
          - heading "Headers and Responses" [level=3] [ref=e290]
          - paragraph [ref=e291]: "Return rate limit state in response headers so clients can self-throttle:"
          - code [ref=e292]: "X-RateLimit-Limit: 100 X-RateLimit-Remaining: 43 X-RateLimit-Reset: 1717200060 Retry-After: 30 (only on 429 responses)"
          - paragraph [ref=e293]:
            - text: Return HTTP 429 with a
            - code [ref=e294]: Retry-After
            - text: header when the limit is exceeded.
          - heading "AWS-Specific Notes" [level=3] [ref=e295]
          - paragraph [ref=e296]: On AWS, you can offload this entirely to API Gateway with Usage Plans and API Keys - it handles token bucket rate limiting natively. For custom logic (per-endpoint limits, dynamic limits based on subscription tier), deploy your own gateway (e.g. Kong, Envoy, or a custom FastAPI middleware) backed by ElastiCache Redis in the same VPC to keep latency under 2ms.
