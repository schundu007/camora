          - heading "What is the difference between alerting on symptoms versus alerting on causes, and can you give examples of each?" [level=1] [ref=e49]
          - button "1" [ref=e51]:
            - img [ref=e52]
            - generic [ref=e54]: "1"
        - generic [ref=e55]:
          - generic [ref=e56]:
