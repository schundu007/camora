          - heading "How would you implement structured logging across a polyglot microservices architecture?" [level=1] [ref=e49]
          - button "1" [ref=e51]:
            - img [ref=e52]
            - generic [ref=e54]: "1"
        - generic [ref=e55]:
          - generic [ref=e56]:
            - generic [ref=e57]: 📡
            - text: Observability
          - generic [ref=e58]: Hard
      - generic [ref=e59]:
        - heading "Answer" [level=2] [ref=e60]
        - generic [ref=e61]:
          - heading "Structured Logging Across a Polyglot Microservices Architecture" [level=2] [ref=e62]
          - paragraph [ref=e63]: "Structured logging in a polyglot environment requires solving three distinct problems: agreeing on a canonical schema, propagating correlation context across service boundaries, and enforcing consistency at the tooling level before logs ever reach your aggregator."
          - heading "Define a Canonical Log Schema" [level=3] [ref=e64]
          - paragraph [ref=e65]: "Every service, regardless of language, must emit JSON with the same field names and value formats. A minimal canonical schema looks like this:"
          - code [ref=e68]: "{ \"timestamp\": \"2024-11-15T09:32:17.452Z\", \"level\": \"error\", \"service\": \"payment-svc\", \"version\": \"1.4.2\", \"trace_id\": \"4bf92f3577b34da6a3ce929d0e0e4736\", \"span_id\": \"00f067aa0ba902b7\", \"message\": \"charge failed: card declined\", \"error\": { \"type\": \"CardDeclinedError\", \"message\": \"insufficient funds\", \"stack\": \"...\" }, \"http\": { \"method\": \"POST\", \"path\": \"/v1/charges\", \"status\": 402, \"duration_ms\": 214 } }"
          - paragraph [ref=e69]:
            - text: Document this schema in your runbook with field-level descriptions, required vs optional fields, and enum values for
            - code [ref=e70]: level
            - text: (debug, info, warn, error, fatal). Treat it as a versioned contract. Breaking changes require a migration plan, just like an API change.
          - heading "Correlation ID Propagation" [level=3] [ref=e71]
          - paragraph [ref=e72]:
            - text: The first service in a request chain generates a
            - code [ref=e73]: trace_id
            - text: if one is not already present in the incoming
            - code [ref=e74]: X-Trace-ID
            - text: header. Every downstream call passes that same ID forward. This is the minimum viable distributed trace.
          - paragraph [ref=e75]: "In Python (FastAPI) with middleware:"
          - code [ref=e78]: "import uuid from structlog import get_logger from starlette.middleware.base import BaseHTTPMiddleware logger = get_logger() class TraceMiddleware(BaseHTTPMiddleware): async def dispatch(self, request, call_next): trace_id = request.headers.get(\"X-Trace-ID\") or uuid.uuid4().hex with structlog.contextvars.bound_contextvars(trace_id=trace_id): response = await call_next(request) response.headers[\"X-Trace-ID\"] = trace_id return response"
          - paragraph [ref=e79]:
            - text: In Node.js (Express) with
            - code [ref=e80]: pino
            - text: and
            - code [ref=e81]: AsyncLocalStorage
            - text: ":"
          - code [ref=e84]: "const { AsyncLocalStorage } = require('async_hooks'); const store = new AsyncLocalStorage(); app.use((req, res, next) => { const traceId = req.headers['x-trace-id'] || crypto.randomUUID().replace(/-/g, ''); store.run({ traceId }, () => next()); }); const logger = pino({ mixin() { return store.getStore() || {}; } });"
          - paragraph [ref=e85]:
            - text: For services on Kubernetes behind an Istio service mesh, Envoy injects and propagates
            - code [ref=e86]: x-b3-traceid
            - text: and
            - code [ref=e87]: x-b3-spanid
            - text: headers automatically. Your application only needs to forward those headers on outbound calls - not generate them. This integrates directly with Jaeger or Zipkin without application-level tracing libraries.
          - heading "Language-Specific Thin Wrappers" [level=3] [ref=e88]
          - paragraph [ref=e89]: Avoid calling logging libraries directly in application code. Instead, publish a thin internal library per language that pre-configures the formatter, enforces required fields, and binds the correlation context.
          - paragraph [ref=e90]:
            - text: For Python, wrap
            - code [ref=e91]: structlog
            - text: ":"
          - code [ref=e94]: "# aceci_logging/__init__.py import structlog def configure(): structlog.configure( processors=[ structlog.contextvars.merge_contextvars, structlog.processors.add_log_level, structlog.processors.TimeStamper(fmt=\"iso\"), structlog.processors.JSONRenderer(), ] ) get_logger = structlog.get_logger"
          - paragraph [ref=e95]:
            - text: For Node.js, wrap
            - code [ref=e96]: pino
            - text: with a preset config that enforces the schema and disables pretty-printing in production.
          - paragraph [ref=e97]:
            - text: Publish these as versioned internal packages (
            - code [ref=e98]: aceci-logging==1.2.0
            - text: ","
            - code [ref=e99]: "@aceci/logger@1.2.0"
            - text: ) and require them in your service templates. A new service should never configure logging from scratch.
          - heading "Enforcement in CI" [level=3] [ref=e100]
          - paragraph [ref=e101]:
            - text: Add a lint step that fails the build if
            - code [ref=e102]: print()
            - text: ","
            - code [ref=e103]: console.log()
            - text: ", or"
            - code [ref=e104]: logging.basicConfig()
            - text: "appear outside the wrapper library:"
          - code [ref=e107]: "# .github/workflows/ci.yml - name: Check for unstructured logging run: | grep -rn \"console\\.log\\|console\\.error\" src/ --include=\"*.ts\" | grep -v \"node_modules\" | grep -v \"// ok\" && exit 1 || exit 0"
          - paragraph [ref=e108]:
            - text: For Python, use a custom
            - code [ref=e109]: flake8
            - text: rule or a
            - code [ref=e110]: pre-commit
            - text: hook that flags
            - code [ref=e111]: print()
            - text: and direct
            - code [ref=e112]: logging.getLogger()
            - text: calls outside
            - code [ref=e113]: aceci_logging/
            - text: .
          - heading "Aggregation and Querying" [level=3] [ref=e114]
          - paragraph [ref=e115]:
            - text: Ship logs to a centralized system using a log forwarder on each node. On Kubernetes, a Fluent Bit DaemonSet tails
            - code [ref=e116]: /var/log/containers/*.log
            - text: ", parses the JSON, and forwards to your backend:"
          - list [ref=e117]:
            - listitem [ref=e118]:
              - strong [ref=e119]: Loki
              - text: "(self-hosted): use LogQL to filter by label, then query fields -"
              - code [ref=e120]: "{service=\"payment-svc\"} | json | trace_id=\"4bf92f3577b34da6a3ce929d0e0e4736\""
            - listitem [ref=e121]:
              - strong [ref=e122]: OpenSearch
              - text: ": query with"
              - code [ref=e123]: GET /logs-*/_search
              - text: filtering on
              - code [ref=e124]: trace_id.keyword
            - listitem [ref=e125]:
              - strong [ref=e126]: Datadog
              - text: ":"
              - code [ref=e127]: service:payment-svc @trace_id:4bf92f3577b34da6a3ce929d0e0e4736
          - paragraph [ref=e128]:
            - text: With a consistent
            - code [ref=e129]: trace_id
            - text: across every service, reconstructing the full request path is a single filtered query. You get ordered log lines from auth-svc, api-gateway, payment-svc, and notification-svc for the same user request - without grepping multiple CloudWatch log groups or SSH-ing into instances.
          - heading "Key Tradeoffs" [level=3] [ref=e130]
          - paragraph [ref=e131]:
            - text: JSON logging adds roughly 15-25% overhead per log line compared to plaintext. Mitigate this by setting
            - code [ref=e132]: "level: warn"
            - text: in production for high-traffic services and using sampling for debug-level traces. Do not log request bodies by default - add a field like
            - code [ref=e133]: "\"body_logged\": true"
            - text: only when explicitly enabled, to avoid PII exposure in your log pipeline.
