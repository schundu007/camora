          - heading "How do you audit and enforce encryption at rest and in transit across a heterogeneous AWS environment?" [level=1] [ref=e153]
          - generic [ref=e50]:
            - button "0" [ref=e154] [cursor=pointer]:
              - img [ref=e155]
              - generic [ref=e157]: "0"
            - button "Bookmark this" [ref=e158] [cursor=pointer]:
              - img [ref=e159]
        - generic [ref=e53]:
          - generic [ref=e161]:
            - generic [ref=e162]: 🔒
            - text: Security
          - generic [ref=e163]: Medium
      - generic [ref=e56]:
        - heading "Answer" [level=2] [ref=e164]
        - generic [ref=e58]:
          - heading "Auditing and Enforcing Encryption at Rest and in Transit in AWS" [level=2] [ref=e165]
          - paragraph [ref=e166]: "Encryption enforcement in a heterogeneous AWS environment requires a layered approach: continuous audit to detect gaps, preventive controls to block non-compliant resources at creation, and operational practices that cover the full picture (including transit encryption pitfalls that teams routinely miss)."
          - separator [ref=e167]
          - heading "Auditing Encryption State with AWS Config" [level=2] [ref=e168]
          - paragraph [ref=e169]: "AWS Config provides managed rules that evaluate encryption posture continuously. Deploy these at the organization level using a delegated Config administrator account:"
          - paragraph [ref=e170]:
            - strong [ref=e171]: "Key managed rules:"
          - list [ref=e172]:
            - listitem [ref=e173]:
              - code [ref=e174]: rds-storage-encrypted
              - text: "- flags RDS instances where"
              - code [ref=e175]: StorageEncrypted
              - text: is false
            - listitem [ref=e176]:
              - code [ref=e177]: s3-bucket-server-side-encryption-enabled
              - text: "- flags buckets missing a default encryption policy"
            - listitem [ref=e178]:
              - code [ref=e179]: ebs-encryption-by-default
              - text: "- flags accounts where EC2 EBS default encryption is not enabled"
            - listitem [ref=e180]:
              - code [ref=e181]: encrypted-volumes
              - text: "- flags attached EBS volumes not using KMS"
            - listitem [ref=e182]:
              - code [ref=e183]: elb-tls-https-listeners-only
              - text: "- flags load balancers with non-HTTPS listeners"
          - paragraph [ref=e184]: "Deploy a conformance pack across all accounts in the org:"
          - code [ref=e187]: aws organizations enable-aws-service-access --service-principal config-multiaccountsetup.amazonaws.com aws configservice put-organization-conformance-pack --organization-conformance-pack-name encryption-baseline --template-s3-uri s3://your-config-bucket/encryption-pack.yaml --delivery-s3-bucket your-config-bucket
          - paragraph [ref=e188]: "Run a point-in-time query using Config's advanced query to find all non-compliant EBS volumes across accounts:"
          - code [ref=e191]: SELECT accountId, awsRegion, resourceId, configuration.encrypted FROM aws_ec2_volume WHERE configuration.encrypted = 'false'
          - separator [ref=e192]
          - heading "Enforcing Encryption at Creation with SCPs" [level=2] [ref=e193]
          - paragraph [ref=e194]: Detective controls (Config) catch drift after the fact. Service Control Policies (SCPs) in AWS Organizations prevent non-compliant resources from being created at all.
          - paragraph [ref=e195]:
            - strong [ref=e196]: "Deny unencrypted EBS volumes at EC2 launch:"
          - code [ref=e199]: "{ \"Effect\": \"Deny\", \"Action\": \"ec2:RunInstances\", \"Resource\": \"arn:aws:ec2:*:*:volume/*\", \"Condition\": { \"Bool\": { \"ec2:Encrypted\": \"false\" } } }"
          - paragraph [ref=e200]:
            - strong [ref=e201]: "Deny unencrypted RDS instances:"
          - code [ref=e204]: "{ \"Effect\": \"Deny\", \"Action\": [ \"rds:CreateDBInstance\", \"rds:RestoreDBInstanceFromDBSnapshot\" ], \"Resource\": \"*\", \"Condition\": { \"Bool\": { \"rds:StorageEncrypted\": \"false\" } } }"
          - paragraph [ref=e205]: Attach these SCPs to the OU containing production accounts. Always test in a sandbox OU first - an overly broad SCP can break Terraform pipelines or legitimate automation.
          - paragraph [ref=e206]: "Also enforce EBS default encryption at the account level via AWS Config remediation using SSM Automation:"
          - code [ref=e209]: aws ec2 enable-ebs-encryption-by-default --region ap-south-1
          - separator [ref=e210]
          - heading "Transit Encryption - Beyond the Checkbox" [level=2] [ref=e211]
          - paragraph [ref=e212]: This is where most teams have gaps. Enabling TLS on a service does not mean your application is verifying the certificate. These are separate concerns.
          - paragraph [ref=e213]:
            - strong [ref=e214]: "RDS in transit:"
            - text: "RDS PostgreSQL and MySQL support TLS, but it is not enforced by default on the server side. You need two things:"
          - list [ref=e215]:
            - listitem [ref=e216]:
              - text: Set the
              - code [ref=e217]: rds.force_ssl
              - text: parameter to
              - code [ref=e218]: "1"
              - text: in the parameter group (PostgreSQL) or
              - code [ref=e219]: require_secure_transport=ON
              - text: for MySQL.
            - listitem [ref=e220]:
              - text: In the application connection string, use
              - code [ref=e221]: sslmode=verify-full
              - text: (not just
              - code [ref=e222]: require
              - text: ") and point to the RDS CA bundle:"
          - code [ref=e224]: postgresql://user:pass@rds-endpoint:5432/db?sslmode=verify-full&sslrootcert=/etc/ssl/certs/rds-combined-ca-bundle.pem
          - paragraph [ref=e225]:
            - code [ref=e226]: sslmode=require
            - text: encrypts traffic but skips certificate verification, leaving you exposed to MITM attacks on internal networks.
            - code [ref=e227]: verify-full
            - text: validates the hostname and the certificate chain.
          - paragraph [ref=e228]: Download the RDS CA bundle from AWS and bundle it into your application container or EC2 AMI. When AWS rotates the CA (they announced a 2024-2025 rotation), you need a process to update this bundle without a service outage.
          - paragraph [ref=e229]:
            - strong [ref=e230]: "Internal service-to-service traffic:"
            - text: Use AWS Certificate Manager Private CA to issue internal TLS certificates for service mesh or direct API calls. For EKS, use cert-manager with ACM PCA as the issuer so internal pods verify each other.
          - paragraph [ref=e231]:
            - strong [ref=e232]: "S3 in transit:"
            - text: "Enforce HTTPS-only at the bucket policy level:"
          - code [ref=e235]: "{ \"Effect\": \"Deny\", \"Principal\": \"*\", \"Action\": \"s3:*\", \"Resource\": [\"arn:aws:s3:::your-bucket/*\"], \"Condition\": { \"Bool\": { \"aws:SecureTransport\": \"false\" } } }"
          - separator [ref=e236]
          - heading "KMS Key Management" [level=2] [ref=e237]
          - paragraph [ref=e238]: "For sensitive data, customer-managed KMS keys (CMK) give you control that AWS-managed keys do not: key policy auditing, cross-account access control, and independent deletion."
          - paragraph [ref=e239]:
            - strong [ref=e240]: "Key rotation:"
            - text: "Enable automatic annual rotation on all CMKs:"
          - code [ref=e243]: aws kms enable-key-rotation --key-id alias/your-cmk
          - paragraph [ref=e244]:
            - strong [ref=e245]: "Key policy audit access:"
            - text: "Add a dedicated audit principal that can describe but not use the key:"
          - code [ref=e248]: "{ \"Sid\": \"AllowAuditAccess\", \"Effect\": \"Allow\", \"Principal\": { \"AWS\": \"arn:aws:iam::AUDIT_ACCOUNT_ID:role/AuditRole\" }, \"Action\": [ \"kms:DescribeKey\", \"kms:GetKeyPolicy\", \"kms:GetKeyRotationStatus\", \"kms:ListGrants\" ], \"Resource\": \"*\" }"
          - paragraph [ref=e249]:
            - text: Use AWS CloudTrail to log all
            - code [ref=e250]: kms:Decrypt
            - text: and
            - code [ref=e251]: kms:GenerateDataKey
            - text: calls. Set up CloudWatch alarms on anomalous decryption volume - a spike can indicate data exfiltration or a misconfigured application in a retry loop.
          - separator [ref=e252]
          - heading "Bringing It Together" [level=2] [ref=e253]
          - paragraph [ref=e254]: "The full enforcement chain is: SCP blocks non-compliant creation, account-level defaults (EBS encryption by default) reduce misconfiguration surface, Config continuously audits drift, and CloudTrail with KMS logging provides the forensic trail. Transit encryption requires verifying both the server-side enforcement parameter and the client-side connection string - auditing one without the other leaves a real gap."
