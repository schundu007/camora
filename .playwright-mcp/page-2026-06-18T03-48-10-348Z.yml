      - generic [ref=e47]:
        - generic [ref=e48]:
          - heading "You need to deploy a breaking schema change to a production database with zero downtime. How do you do it?" [level=1] [ref=e49]
          - button "0" [ref=e51]:
            - img [ref=e52]
            - generic [ref=e54]: "0"
        - generic [ref=e55]:
          - generic [ref=e56]:
            - generic [ref=e57]: 🔧
            - text: Troubleshooting
          - generic [ref=e58]: Hard
      - generic [ref=e59]:
        - heading "Answer" [level=2] [ref=e60]
        - generic [ref=e61]:
          - heading "Zero-Downtime Breaking Schema Changes" [level=2] [ref=e291]
          - paragraph [ref=e292]: A breaking schema change is one where the old version of your application cannot run correctly against the new schema, or vice versa. A non-breaking change (adding a nullable column, adding an index) can be deployed directly. Breaking changes (renaming a column, changing a type, dropping a column) require a more careful approach.
          - paragraph [ref=e293]:
            - text: "The core principle:"
            - strong [ref=e294]: your database schema must be compatible with both the old and new versions of your application simultaneously during the deployment window.
          - separator [ref=e66]
          - heading "The Expand-Contract Pattern" [level=2] [ref=e295]
          - paragraph [ref=e296]: This is the standard approach. It splits what feels like one change into three separate deployments.
          - heading "Phase 1 - Expand (add, don't remove)" [level=3] [ref=e297]
          - paragraph [ref=e298]: Add the new column as nullable alongside the old one. Deploy nothing else yet.
          - code [ref=e300]: "-- Safe: nullable, no default required, no table lock on Postgres 11+ ALTER TABLE orders ADD COLUMN customer_email VARCHAR(255);"
          - paragraph [ref=e301]:
            - text: The old app keeps writing to
            - code [ref=e302]: customer_name
            - text: (or whatever the old column is). The new column sits empty.
          - heading "Phase 2 - Dual-write and backfill" [level=3] [ref=e303]
          - paragraph [ref=e304]: Deploy the new version of your application. It reads from the old column (falling back if new is null) and writes to both columns on every insert/update.
          - code [ref=e306]: "# Application layer during transition email = row.customer_email or legacy_lookup(row.customer_name)"
          - paragraph [ref=e307]: "Backfill existing rows in batches - never a single unbounded UPDATE on a large table:"
          - code [ref=e309]: "-- Run in a loop until 0 rows updated UPDATE orders SET customer_email = legacy_email_lookup(customer_name) WHERE customer_email IS NULL LIMIT 5000;"
          - paragraph [ref=e310]:
            - text: Batching keeps locks short and avoids replication lag spikes. On RDS, watch
            - code [ref=e311]: ReplicaLag
            - text: in CloudWatch while backfilling.
          - heading "Phase 3 - Contract (remove the old)" [level=3] [ref=e312]
          - paragraph [ref=e313]: "Once the old application version is fully gone from your ASG/ECS fleet and the backfill is complete, drop the old column:"
          - code [ref=e315]: ALTER TABLE orders DROP COLUMN customer_name;
          - paragraph [ref=e316]:
            - text: This is now safe because no running code references
            - code [ref=e317]: customer_name
            - text: .
          - separator [ref=e94]
          - heading "Large Tables Without Locking" [level=2] [ref=e318]
          - paragraph [ref=e319]:
            - code [ref=e320]: ALTER TABLE
            - text: on a table with tens of millions of rows can hold an
            - code [ref=e321]: ACCESS EXCLUSIVE
            - text: lock for minutes, blocking all reads and writes. Use tooling that avoids this.
          - paragraph [ref=e322]:
            - strong [ref=e323]: "PostgreSQL - pg_repack:"
          - code [ref=e325]: "# Install and run against a live table pg_repack -h prod-db.internal -U app -d mydb -t orders --no-superuser-check"
          - paragraph [ref=e326]: pg_repack creates a shadow table, copies data in the background, applies incremental changes via triggers, then performs an atomic swap. The lock window is milliseconds.
          - paragraph [ref=e327]:
            - strong [ref=e328]: "MySQL - pt-online-schema-change (Percona Toolkit):"
          - code [ref=e330]: pt-online-schema-change --alter "ADD COLUMN customer_email VARCHAR(255)" --host=prod-db.internal --user=app --ask-pass --execute D=mydb,t=orders
          - paragraph [ref=e331]:
            - text: Both tools follow the same shadow-table-plus-trigger approach. On AWS RDS for MySQL,
            - code [ref=e332]: gh-ost
            - text: is often preferred because pt-osc requires super privileges that RDS restricts.
          - paragraph [ref=e333]:
            - strong [ref=e334]: "Postgres 12+ native option:"
            - text: For adding a nullable column with no default, Postgres 11+ no longer rewrites the table at all - it is instant. For adding a column with a non-null default, Postgres 11+ stores the default in metadata and avoids the rewrite too. Always check the Postgres version before reaching for pg_repack.
          - separator [ref=e114]
          - heading "Testing and Rollback" [level=2] [ref=e335]
          - heading "Staging with production-size data" [level=3] [ref=e336]
          - paragraph [ref=e337]:
            - text: A migration that runs in 2 seconds on staging with 10k rows may take 8 minutes on production with 50 million rows. Use
            - code [ref=e338]: pg_dump
            - text: on production (with anonymized PII) and restore to a staging instance of the same instance class before testing.
          - paragraph [ref=e339]: "Measure:"
          - list [ref=e340]:
            - listitem [ref=e341]: Lock wait time
            - listitem [ref=e342]: Migration wall-clock duration
            - listitem [ref=e343]: Replication lag on read replicas
          - heading "Rollback documentation" [level=3] [ref=e344]
          - paragraph [ref=e345]: "Write the rollback SQL before you deploy, not after something goes wrong:"
          - code [ref=e347]: "-- rollback.sql for Phase 1 ALTER TABLE orders DROP COLUMN customer_email;"
          - paragraph [ref=e348]: For Phase 2/3, rollback is harder - you cannot easily un-backfill. This is why you keep the old column around through Phase 2 rather than deleting it immediately.
          - heading "Blue-green as a safety net" [level=3] [ref=e349]
          - paragraph [ref=e350]: On RDS, a blue-green deployment creates a staging clone, applies the migration there, and promotes it with a cutover that typically takes under a minute. This gives you a validated pre-migrated database before touching production traffic. Useful for high-risk changes where the expand-contract window needs to be compressed.
          - code [ref=e352]: aws rds create-blue-green-deployment --blue-green-deployment-name orders-schema-v2 --source arn:aws:rds:ap-south-1:123456:db:prod-postgres
          - separator [ref=e135]
          - heading "Summary" [level=2] [ref=e353]
          - table [ref=e355]:
            - rowgroup [ref=e356]:
              - row "Phase Action Risk" [ref=e357]:
                - columnheader "Phase" [ref=e358]
                - columnheader "Action" [ref=e359]
                - columnheader "Risk" [ref=e360]
            - rowgroup [ref=e361]:
              - row "Expand Add nullable column None - instant on modern Postgres" [ref=e362]:
                - cell "Expand" [ref=e363]
                - cell "Add nullable column" [ref=e364]
                - cell "None - instant on modern Postgres" [ref=e365]
              - row "Dual-write + backfill Deploy new app, batch-update rows Low if batched" [ref=e366]:
                - cell "Dual-write + backfill" [ref=e367]
                - cell "Deploy new app, batch-update rows" [ref=e368]
                - cell "Low if batched" [ref=e369]
              - row "Contract Drop old column after full cutover Low if old app is gone" [ref=e370]:
                - cell "Contract" [ref=e371]
                - cell "Drop old column after full cutover" [ref=e372]
                - cell "Low if old app is gone" [ref=e373]
          - paragraph [ref=e374]: The most common mistake is treating this as a one-step database migration rather than a three-phase deployment. Each phase is a separate PR and deployment.
