      - generic [ref=e59]:
        - heading "Answer" [level=2] [ref=e60]
        - generic [ref=e61]:
          - 'heading "Kubernetes Service Account Token Compromise: Attack Paths and Blast Radius Reduction" [level=2] [ref=e311]'
          - heading "What an Attacker Can Do With a Stolen Token" [level=3] [ref=e312]
          - paragraph [ref=e313]: "A stolen service account token gives an attacker an authenticated identity inside the cluster. Their first move is enumeration:"
          - code [ref=e315]: kubectl auth can-i --list --token=<stolen-token> -n production
          - paragraph [ref=e316]:
            - text: This outputs every verb/resource combination the account is permitted. If the account has
            - code [ref=e317]: get
            - text: /
            - code [ref=e318]: list
            - text: "on"
            - code [ref=e319]: secrets
            - text: or any binding to a
            - code [ref=e320]: ClusterRole
            - text: ", the scope of the breach expands quickly."
          - paragraph [ref=e321]: "From there, typical escalation steps:"
          - list [ref=e322]:
            - listitem [ref=e323]:
              - strong [ref=e324]: Secrets exfiltration
              - text: "-"
              - code [ref=e325]: kubectl get secret -A
              - text: dumps all secrets cluster-wide if the role is
              - code [ref=e326]: ClusterRole
              - text: "-scoped. This includes database credentials, TLS certs, and other service account tokens."
            - listitem [ref=e327]:
              - strong [ref=e328]: Pod creation with host access
              - text: "- if"
              - code [ref=e329]: pods/create
              - text: "is permitted, the attacker creates a privileged pod:"
              - code [ref=e332]: "spec: hostPID: true hostNetwork: true containers: - name: attacker image: ubuntu securityContext: privileged: true volumeMounts: - name: host-root mountPath: /host volumes: - name: host-root hostPath: path: /"
              - text: This pod has full read/write access to the node filesystem, including kubelet credentials and node-level IAM instance profiles (critical in EKS where node roles often carry excessive permissions).
            - listitem [ref=e333]:
              - strong [ref=e334]: Lateral namespace movement
              - text: "- a"
              - code [ref=e335]: ClusterRoleBinding
              - text: to even
              - code [ref=e336]: view
              - text: exposes workloads, ConfigMaps, and environment variables across every namespace.
            - listitem [ref=e337]:
              - strong [ref=e338]: Credential chain abuse in AWS
              - text: "- on EKS, a node's EC2 instance profile is reachable from any pod without IRSA. If the node role has"
              - code [ref=e339]: ec2:DescribeInstances
              - text: ","
              - code [ref=e340]: s3:GetObject
              - text: ", or"
              - code [ref=e341]: iam:PassRole
              - text: ", the attacker pivots to AWS."
          - heading "Blast Radius Without Controls" [level=3] [ref=e342]
          - paragraph [ref=e343]:
            - text: "A single overly permissive service account can compromise an entire cluster. A common antipattern: a CI/CD runner service account bound to"
            - code [ref=e344]: "ClusterRole: cluster-admin"
            - text: so it can deploy to any namespace. One stolen token and the attacker has full cluster control - they can create new
            - code [ref=e345]: ClusterRoleBindings
            - text: ", access all secrets, and delete workloads."
          - paragraph [ref=e346]: "Another common failure: default service account tokens are auto-mounted into every pod. An attacker who achieves code execution inside any pod - through a dependency vulnerability or misconfigured ingress - inherits that token automatically."
          - heading "Defensive Design" [level=3] [ref=e347]
          - paragraph [ref=e348]:
            - strong [ref=e349]: Namespace-scoped Roles, not ClusterRoles
          - paragraph [ref=e350]:
            - text: Bind service accounts to
            - code [ref=e351]: Role
            - text: +
            - code [ref=e352]: RoleBinding
            - text: scoped to one namespace. Reserve
            - code [ref=e353]: ClusterRole
            - text: for cluster-level resources (nodes, PVs) only.
          - code [ref=e355]: "apiVersion: rbac.authorization.k8s.io/v1 kind: Role metadata: namespace: production name: app-reader rules: - apiGroups: [\"\"] resources: [\"configmaps\"] verbs: [\"get\", \"list\"]"
          - paragraph [ref=e356]:
            - strong [ref=e357]: Disable automounting by default
          - paragraph [ref=e358]: "Set at both the ServiceAccount and Pod level:"
          - code [ref=e360]: "apiVersion: v1 kind: ServiceAccount metadata: name: my-app automountServiceAccountToken: false"
          - paragraph [ref=e361]: Only pods that genuinely need to call the Kubernetes API should have tokens mounted. Most application pods do not.
          - paragraph [ref=e362]:
            - strong [ref=e363]: Use IRSA instead of node-level AWS permissions (EKS)
          - paragraph [ref=e364]: "Annotate service accounts for IRSA to scope AWS permissions per workload, not per node:"
          - code [ref=e366]: "metadata: annotations: eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/my-app-role"
          - paragraph [ref=e367]: This removes the EC2 instance profile pivot path entirely.
          - paragraph [ref=e368]:
            - strong [ref=e369]: Network policies to restrict pod-to-pod communication
          - paragraph [ref=e370]: "Even if a pod is compromised, a deny-all default NetworkPolicy limits lateral movement:"
          - code [ref=e372]: "spec: podSelector: {} policyTypes: [\"Ingress\", \"Egress\"]"
          - heading "Detection and Response" [level=3] [ref=e373]
          - paragraph [ref=e374]:
            - strong [ref=e375]: Enable Kubernetes audit logging
          - paragraph [ref=e376]:
            - text: On EKS, enable control plane logs (audit, authenticator) to CloudWatch. On self-managed clusters, configure
            - code [ref=e377]: "--audit-log-path"
            - text: and ship to a SIEM.
          - paragraph [ref=e378]: "Alert on these specific audit events:"
          - table [ref=e380]:
            - rowgroup [ref=e381]:
              - row "API Call Risk" [ref=e382]:
                - columnheader "API Call" [ref=e383]
                - columnheader "Risk" [ref=e384]
            - rowgroup [ref=e385]:
              - row "secrets/get across namespaces Credential theft" [ref=e386]:
                - cell "secrets/get across namespaces" [ref=e387]:
                  - code [ref=e388]: secrets/get
                  - text: across namespaces
                - cell "Credential theft" [ref=e389]
              - row "pods/exec Interactive shell access" [ref=e390]:
                - cell "pods/exec" [ref=e391]:
                  - code [ref=e392]: pods/exec
                - cell "Interactive shell access" [ref=e393]
              - row "clusterrolebindings/create Privilege escalation" [ref=e394]:
                - cell "clusterrolebindings/create" [ref=e395]:
                  - code [ref=e396]: clusterrolebindings/create
                - cell "Privilege escalation" [ref=e397]
              - 'row "pods/create with hostPID: true Node escape" [ref=e398]':
                - 'cell "pods/create with hostPID: true" [ref=e399]':
                  - code [ref=e400]: pods/create
                  - text: with
                  - code [ref=e401]: "hostPID: true"
                - cell "Node escape" [ref=e402]
          - paragraph [ref=e403]: "A Falco rule for exec detection:"
          - code [ref=e405]: "- rule: Terminal shell in container desc: Detect shell executed inside a container condition: spawned_process and container and shell_procs output: \"Shell spawned in container (user=%user.name container=%container.name)\" priority: WARNING"
          - paragraph [ref=e406]:
            - strong [ref=e407]: Response playbook
          - list [ref=e408]:
            - listitem [ref=e409]:
              - text: "Revoke the service account token immediately:"
              - code [ref=e410]: kubectl delete secret <sa-token-secret> -n <namespace>
            - listitem [ref=e411]: "Rotate the service account: delete and recreate it"
            - listitem [ref=e412]:
              - text: Audit
              - code [ref=e413]: ClusterRoleBindings
              - text: "for unexpected entries:"
              - code [ref=e414]: kubectl get clusterrolebindings -o yaml | grep -A5 <compromised-sa>
            - listitem [ref=e415]: Review audit logs for the 72-hour window before detection to determine full scope
            - listitem [ref=e416]: If node credentials were exposed, rotate the node group and re-issue all pod identities
          - paragraph [ref=e417]: The most effective long-term control is enforcing least-privilege RBAC from day one, combined with audit log alerting. Most real-world breaches exploit ClusterRole bindings that were added "temporarily" and never removed.
