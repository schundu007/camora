          - heading "Design a rate limiting system that works across multiple instances of a distributed API gateway." [level=1] [ref=e54]
          - button "0" [ref=e56]:
            - img [ref=e57]
            - generic [ref=e59]: "0"
        - generic [ref=e60]:
          - generic [ref=e61]:
            - generic [ref=e62]: 🏛️
            - text: System Design
          - generic [ref=e63]: Medium
      - generic [ref=e64]:
        - heading "Answer" [level=2] [ref=e65]
        - generic [ref=e66]:
          - heading "Designing a Rate Limiting System for a Distributed API Gateway" [level=2] [ref=e67]
          - paragraph [ref=e68]: When rate limiting spans multiple gateway instances, the core challenge is shared state. A single instance can track counters in memory, but with horizontal scaling you need a centralized store that all instances can read and write atomically.
          - heading "Algorithm Choice" [level=3] [ref=e69]
          - paragraph [ref=e70]:
            - strong [ref=e71]: Token Bucket
            - text: is the most practical for API gateways. Each client gets a bucket with a fixed capacity (e.g. 100 tokens). Tokens refill at a constant rate (e.g. 10/second). Each request consumes one token. Burst traffic is absorbed up to the bucket capacity, then requests are rejected until tokens refill.
          - paragraph [ref=e72]:
            - strong [ref=e73]: Sliding Window
            - text: is stricter. Instead of a fixed replenishment schedule, it counts requests within a rolling time window (e.g. the last 60 seconds). This prevents the "double burst" problem where a client fires 100 requests at 11:59 and another 100 at 12:00 under a fixed-window scheme.
          - paragraph [ref=e74]: For most production APIs, token bucket is the right default. Use sliding window when you need hard per-minute guarantees, such as payment or SMS APIs.
          - heading "Redis as the Distributed Store" [level=3] [ref=e75]
          - paragraph [ref=e76]: Redis is the standard backend for distributed rate limiting. The key operation - check the current count and decrement it - must be atomic. A non-atomic read-then-write creates a race condition across instances.
          - paragraph [ref=e77]: "Use a Lua script to make the check-and-decrement atomic:"
          - code [ref=e80]: "-- Token bucket check in Lua (runs atomically in Redis) local key = KEYS[1] local capacity = tonumber(ARGV[1]) local refill_rate = tonumber(ARGV[2]) -- tokens per second local now = tonumber(ARGV[3]) local data = redis.call('HMGET', key, 'tokens', 'last_refill') local tokens = tonumber(data[1]) or capacity local last_refill = tonumber(data[2]) or now local elapsed = now - last_refill local refilled = math.min(capacity, tokens + (elapsed * refill_rate)) if refilled < 1 then return 0 -- rate limited end redis.call('HMSET', key, 'tokens', refilled - 1, 'last_refill', now) redis.call('EXPIRE', key, 3600) return 1 -- allowed"
          - paragraph [ref=e81]:
            - text: Call this from your gateway with
            - code [ref=e82]: EVAL
            - text: or load it using
            - code [ref=e83]: SCRIPT LOAD
            - text: and call via
            - code [ref=e84]: EVALSHA
            - text: for efficiency.
          - paragraph [ref=e85]:
            - text: "Key naming convention:"
            - code [ref=e86]: "ratelimit:{client_id}:{window}"
            - text: "- for example"
            - code [ref=e87]: ratelimit:user:42:60s
            - text: .
          - heading "Sliding Window with Redis Sorted Sets" [level=3] [ref=e88]
          - paragraph [ref=e89]: "For sliding window, store request timestamps as scores in a sorted set:"
          - code [ref=e92]: "# On each request for client \"user:42\": MULTI ZREMRANGEBYSCORE ratelimit:user:42 0 (now_ms - window_ms) # remove expired ZADD ratelimit:user:42 now_ms now_ms # add current request ZCARD ratelimit:user:42 # count in window EXPIRE ratelimit:user:42 window_seconds EXEC"
          - paragraph [ref=e93]:
            - text: The
            - code [ref=e94]: ZCARD
            - text: "result tells you whether the client has exceeded the limit. The downside is memory: each request adds an entry. For high-traffic APIs, token bucket with a compact hash is more memory-efficient."
          - heading "Redis High Availability" [level=3] [ref=e95]
          - paragraph [ref=e96]: "A single Redis node is a single point of failure. Two options:"
          - paragraph [ref=e97]:
            - strong [ref=e98]: Redis Sentinel
            - text: "- one primary, two replicas, three Sentinels monitoring them. Automatic failover in 10-30 seconds. Suitable for simpler deployments. On AWS, ElastiCache with Multi-AZ replication handles this."
          - paragraph [ref=e99]:
            - strong [ref=e100]: Redis Cluster
            - text: "- data sharded across multiple primaries, each with replicas. Scales write throughput and tolerates node failures. Use when you have millions of unique client keys or require sub-millisecond latency at scale."
          - code [ref=e103]: "# Connect to Redis Cluster from your gateway redis-cli -c -h aci-redis-cluster.xxxxx.clustercfg.apse1.cache.amazonaws.com -p 6379"
          - heading "Fallback When Redis is Unavailable" [level=3] [ref=e104]
          - paragraph [ref=e105]: "Redis unavailability should not take down your API. Two strategies:"
          - list [ref=e106]:
            - listitem [ref=e107]:
              - strong [ref=e108]: Fail open
              - text: "- allow all requests when Redis is unreachable. Risk of abuse, but keeps the API available."
            - listitem [ref=e109]:
              - strong [ref=e110]: Local fallback cache
              - text: "- each gateway instance maintains an in-memory counter as a fallback. This is less accurate (instances don't share state) but prevents a total outage. Set a lower local limit (e.g. 50% of normal) to compensate."
          - paragraph [ref=e111]: "In practice: fail open for most APIs, use local fallback for sensitive endpoints, and set aggressive circuit-breaker timeouts (100-200ms) so a slow Redis doesn't add latency to every request."
          - heading "Headers and Responses" [level=3] [ref=e112]
          - paragraph [ref=e113]: "Return rate limit state in response headers so clients can self-throttle:"
          - code [ref=e115]: "X-RateLimit-Limit: 100 X-RateLimit-Remaining: 43 X-RateLimit-Reset: 1717200060 Retry-After: 30 (only on 429 responses)"
          - paragraph [ref=e116]:
            - text: Return HTTP 429 with a
            - code [ref=e117]: Retry-After
            - text: header when the limit is exceeded.
          - heading "AWS-Specific Notes" [level=3] [ref=e118]
          - paragraph [ref=e119]: On AWS, you can offload this entirely to API Gateway with Usage Plans and API Keys - it handles token bucket rate limiting natively. For custom logic (per-endpoint limits, dynamic limits based on subscription tier), deploy your own gateway (e.g. Kong, Envoy, or a custom FastAPI middleware) backed by ElastiCache Redis in the same VPC to keep latency under 2ms.
