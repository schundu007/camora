        - generic [ref=e48]:
          - heading "Your team wants to migrate a monolith to microservices. The monolith shares a single database. How do you decompose the database?" [level=1] [ref=e49]
          - generic [ref=e50]:
            - button "0" [ref=e51] [cursor=pointer]:
              - img [ref=e52]
              - generic [ref=e54]: "0"
            - button "Bookmark this" [ref=e320] [cursor=pointer]:
              - img [ref=e321]
        - generic [ref=e55]:
          - generic [ref=e56]:
            - generic [ref=e57]: 🏛️
            - text: System Design
          - generic [ref=e58]: Hard
      - generic [ref=e59]:
        - heading "Answer" [level=2] [ref=e60]
        - generic [ref=e61]:
          - heading "Decomposing a Shared Database During a Monolith-to-Microservices Migration" [level=2] [ref=e323]
          - paragraph [ref=e324]: Breaking apart a shared database is the hardest part of a microservices migration. The application decomposition follows the strangler fig pattern, but database decomposition moves through three distinct phases and requires careful sequencing to avoid downtime or data loss.
          - separator [ref=e64]
          - 'heading "Phase 1: Strangle the Application First, Keep the Shared Database" [level=2] [ref=e325]'
          - paragraph [ref=e326]:
            - text: Before touching the database, extract one bounded domain at a time using a routing proxy (e.g., AWS ALB weighted target groups, or an nginx upstream with
            - code [ref=e327]: proxy_pass
            - text: ). The extracted service initially reads and writes directly to the monolith's database - just its own tables.
          - code [ref=e329]: "upstream orders_service { server orders-svc:8080 weight=1; server monolith:8080 weight=9; }"
          - paragraph [ref=e330]: This gives you a runnable, deployable service without solving database decomposition yet. The goal here is behavioral isolation, not physical isolation.
          - separator [ref=e72]
          - 'heading "Phase 2: Database Decomposition - Three Stages" [level=2] [ref=e331]'
          - 'heading "Stage 1: Shared Database, Explicit Ownership" [level=3] [ref=e332]'
          - paragraph [ref=e333]:
            - text: Mark table ownership clearly. The Orders service is the only writer to
            - code [ref=e334]: orders
            - text: and
            - code [ref=e335]: order_items
            - text: . All other services that need this data call the Orders API instead of querying the table directly. Enforce this at the application layer first - remove cross-service direct queries from the codebase.
          - paragraph [ref=e336]: This stage is purely organizational. The schema is still one database, but you've established the contract.
          - 'heading "Stage 2: Separate Schema (Logical Isolation)" [level=3] [ref=e337]'
          - paragraph [ref=e338]: "Move owned tables into a dedicated PostgreSQL schema:"
          - code [ref=e340]: CREATE SCHEMA orders_svc; ALTER TABLE orders SET SCHEMA orders_svc; ALTER TABLE order_items SET SCHEMA orders_svc; CREATE USER orders_svc_user WITH PASSWORD '...'; GRANT USAGE ON SCHEMA orders_svc TO orders_svc_user; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA orders_svc TO orders_svc_user;
          - paragraph [ref=e341]:
            - text: Other services lose their DB credentials for
            - code [ref=e342]: orders_svc
            - text: schema. They are forced to go through the API. Foreign keys across schemas get dropped here - replace them with application-level consistency checks.
          - 'heading "Stage 3: Separate Physical Database" [level=3] [ref=e343]'
          - paragraph [ref=e344]: Provision a new RDS instance for the Orders service, migrate the data, and cut over. This is where you need zero-downtime migration tooling.
          - separator [ref=e88]
          - 'heading "Zero-Downtime Data Migration: Expand-Contract with Dual-Write" [level=2] [ref=e345]'
          - paragraph [ref=e346]: "The safest pattern for live systems is expand-contract:"
          - paragraph [ref=e347]:
            - strong [ref=e348]: 1. Expand
            - text: "- add the new Orders database alongside the old one. Update the Orders service to dual-write to both:"
          - code [ref=e350]: "def create_order(order_data): old_db.execute(\"INSERT INTO orders ...\", order_data) new_db.execute(\"INSERT INTO orders_svc.orders ...\", order_data)"
          - paragraph [ref=e351]: Write to old first, then new. If the new write fails, log and alert but don't fail the request yet - you're in shadow mode.
          - paragraph [ref=e352]:
            - strong [ref=e353]: 2. Backfill
            - text: "- run a background job to migrate historical data. Use a cursor-based approach to avoid locking:"
          - code [ref=e355]: "last_id = 0 while True: rows = old_db.query(\"SELECT * FROM orders WHERE id > %s ORDER BY id LIMIT 1000\", last_id) if not rows: break new_db.bulk_insert(rows) last_id = rows[-1]['id']"
          - paragraph [ref=e356]:
            - text: Run this during low-traffic windows. Track lag with a
            - code [ref=e357]: SELECT COUNT(*)
            - text: comparison between databases.
          - paragraph [ref=e358]:
            - strong [ref=e359]: 3. Verify
            - text: "- once the backfill is complete, run a checksum comparison:"
          - code [ref=e361]: "-- On old DB SELECT COUNT(*), MAX(updated_at), MD5(string_agg(id::text, ',' ORDER BY id)) FROM orders; -- Same query on new DB - values must match"
          - paragraph [ref=e362]:
            - strong [ref=e363]: 4. Contract (Cut Over)
            - text: "- flip the Orders service to read from the new database, keep dual-writing briefly, then drop the write to the old database. Finally, revoke the old DB credentials from the Orders service."
          - separator [ref=e111]
          - heading "Cross-Domain Joins and Eventual Consistency" [level=2] [ref=e364]
          - paragraph [ref=e365]: "Cross-service joins (e.g., \"orders joined with customer name\") cannot happen at the database layer anymore. Two options:"
          - paragraph [ref=e366]:
            - strong [ref=e367]: API composition
            - text: "- the API gateway or a BFF fetches from both services and joins in memory. Acceptable for low-cardinality queries (single order detail page)."
          - paragraph [ref=e368]:
            - strong [ref=e369]: Event-driven replication
            - text: "- for aggregate queries (reporting, dashboards), publish change events via Kafka or AWS EventBridge and maintain a read-optimized projection in the consumer's own database:"
          - code [ref=e371]: "# Orders service publishes event = {\"type\": \"ORDER_CREATED\", \"order_id\": 123, \"customer_id\": 456, \"total\": 99.00} kafka_producer.send(\"orders.events\", event) # Reporting service consumes and stores a denormalized copy def handle_order_created(event): reporting_db.execute( \"INSERT INTO order_summary (order_id, customer_id, total) VALUES (%s, %s, %s)\", (event['order_id'], event['customer_id'], event['total']) )"
          - paragraph [ref=e372]: Accept that the reporting database is eventually consistent - typically seconds to minutes behind. Document this SLA explicitly. Do not try to make it synchronous; that reintroduces tight coupling.
          - separator [ref=e122]
          - heading "Sequencing Summary" [level=2] [ref=e373]
          - list [ref=e374]:
            - listitem [ref=e375]: Extract service, shared DB, API boundary enforced in code
            - listitem [ref=e376]: Separate schema, drop cross-schema foreign keys, revoke cross-service credentials
            - listitem [ref=e377]: Dual-write to new physical DB, backfill, verify checksums, cut over
            - listitem [ref=e378]: Replace cross-domain joins with API calls or event-driven projections
          - paragraph [ref=e379]: Migrate one domain at a time. Domains with the fewest cross-service foreign keys and the lowest query fan-out are the right starting point - user preferences and audit logs before orders, orders before inventory.
