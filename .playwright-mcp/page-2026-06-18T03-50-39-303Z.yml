                - cell "~100" [ref=e135]
                - cell "Metric label" [ref=e136]
              - row "Request endpoint (normalized) ~200 Metric label" [ref=e137]:
                - cell "Request endpoint (normalized)" [ref=e138]
                - cell "~200" [ref=e139]
                - cell "Metric label" [ref=e140]
              - row "User ID Millions Log field + exemplar" [ref=e141]:
                - cell "User ID" [ref=e142]
                - cell "Millions" [ref=e143]
                - cell "Log field + exemplar" [ref=e144]
              - row "Request/trace ID Billions Trace + exemplar" [ref=e145]:
                - cell "Request/trace ID" [ref=e146]
                - cell "Billions" [ref=e147]
                - cell "Trace + exemplar" [ref=e148]
          - paragraph [ref=e149]: Keep metrics queryable and aggregatable. Keep logs rich and searchable. Use exemplars as the join key between them.
