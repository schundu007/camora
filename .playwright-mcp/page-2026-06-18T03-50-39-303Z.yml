          - heading "How do you manage high cardinality in your metrics pipeline, and where do you draw the line between labels on metrics versus logs?" [level=1] [ref=e49]
          - button "0" [ref=e51]:
            - img [ref=e52]
            - generic [ref=e54]: "0"
        - generic [ref=e55]:
          - generic [ref=e56]:
            - generic [ref=e57]: 📡
            - text: Observability
          - generic [ref=e58]: Hard
      - generic [ref=e59]:
        - heading "Answer" [level=2] [ref=e60]
        - generic [ref=e61]:
          - heading "Managing High Cardinality in Metrics Pipelines" [level=2] [ref=e62]
          - heading "The Cardinality Problem" [level=3] [ref=e63]
          - paragraph [ref=e64]:
            - text: Every unique label combination in Prometheus (or any similar TSDB) creates a separate time series. A
            - code [ref=e65]: http_requests_total
            - text: metric with labels
            - code [ref=e66]: "{status_code, endpoint, region}"
            - text: across 50 endpoints, 5 status codes, and 3 regions produces 750 series - manageable. Add
            - code [ref=e67]: user_id
            - text: and that jumps to 750 * 1,000,000 users = 750 million series. Prometheus head block memory scales with active series, typically 1-2 KB per series. At that scale you are looking at 750 GB of RAM just for the head block.
          - paragraph [ref=e68]: "This is the cardinality explosion. It causes:"
          - list [ref=e69]:
            - listitem [ref=e70]: OOM kills on Prometheus
            - listitem [ref=e71]: Slow query performance (label matchers scan more series)
            - listitem [ref=e72]: Compaction falling behind in Thanos or Cortex ingesters
          - 'heading "Where to Put What: Metrics vs Logs" [level=3] [ref=e73]'
          - paragraph [ref=e74]:
            - strong [ref=e75]: Metrics
            - text: "are for bounded, aggregatable dimensions:"
          - code [ref=e77]: "# Good - finite cardinality, meaningful aggregation http_requests_total{method=\"POST\", status=\"500\", endpoint=\"/api/v1/questions\", region=\"ap-south-1\"} # Bad - unbounded user space http_requests_total{user_id=\"usr_a3f7b9\", endpoint=\"/api/v1/questions\"}"
          - paragraph [ref=e78]:
            - strong [ref=e79]: Logs
            - text: "are for high-cardinality values that are not aggregatable in isolation:"
          - code [ref=e82]: "{ \"level\": \"error\", \"user_id\": \"usr_a3f7b9\", \"request_id\": \"req_c1d2e3f4\", \"endpoint\": \"/api/v1/questions\", \"latency_ms\": 342, \"message\": \"upstream timeout\" }"
          - paragraph [ref=e83]: "The rule of thumb: if the number of unique values is unknown or grows linearly with your user base, it belongs in logs (or traces), not metric labels. Status codes: ~10 values - metric label. User IDs: unbounded - log field."
          - heading "Managing Cardinality Before It Reaches Storage" [level=3] [ref=e84]
          - paragraph [ref=e85]:
            - strong [ref=e86]: Relabeling in Prometheus
            - text: "drops or rewrites labels at scrape time, before the series hits storage:"
          - code [ref=e89]: "scrape_configs: - job_name: api-server relabel_configs: # Drop user_id if a careless developer exposed it - source_labels: [user_id] action: labeldrop regex: user_id metric_relabel_configs: # Normalize long endpoint paths to prevent path parameter explosion - source_labels: [endpoint] regex: \"/api/v1/questions/[0-9]+\" target_label: endpoint replacement: \"/api/v1/questions/:id\""
          - paragraph [ref=e90]:
            - strong [ref=e91]: Recording rules
            - text: "pre-aggregate before queries run across cardinality:"
          - code [ref=e94]: "groups: - name: api_aggregates interval: 30s rules: - record: job:http_requests_total:rate5m expr: sum by (job, status, endpoint) (rate(http_requests_total[5m]))"
          - paragraph [ref=e95]: This collapses the time series to just the dimensions you query on. Dashboards hit the recording rule, not the raw counter.
          - paragraph [ref=e96]:
            - strong [ref=e97]: Cardinality explorers
            - text: "- use these before problems occur. In Prometheus:"
          - code [ref=e100]: "# Find series count by metric name curl -s http://localhost:9090/api/v1/label/__name__/values | jq '.data | length' # Identify top cardinality contributors curl -s \"http://localhost:9090/api/v1/query?query=count by (__name__)({__name__=~\".+\"})\" | jq '.data.result | sort_by(.value[1] | tonumber) | reverse | .[0:10]'"
          - paragraph [ref=e101]:
            - text: Grafana Mimir and Thanos both have cardinality analysis endpoints. Set a cardinality limit per tenant in Cortex/Mimir (
            - code [ref=e102]: ingestion_rate_limit
            - text: ","
            - code [ref=e103]: max_series_per_user
            - text: ) so a single misconfigured service cannot take down the cluster.
          - 'heading "Exemplars: The Bridge Between Metrics and Traces" [level=3] [ref=e104]'
          - paragraph [ref=e105]: Exemplars solve the "I see a spike in p99 latency, now how do I find the actual slow request?" problem without storing every trace.
          - paragraph [ref=e106]: "A Prometheus histogram observation can carry an exemplar - a trace ID attached to a specific bucket observation:"
          - code [ref=e108]: "http_request_duration_seconds_bucket{le=\"0.5\",method=\"POST\",endpoint=\"/api/v1/questions\",status=\"200\"} 24054 # {trace_id=\"abc123def456\",user_id=\"usr_a3f7b9\"} 0.482 1717123456.789"
          - paragraph [ref=e109]: The trace ID is not a label - it does not create a new series. It is metadata on a single sample. In Grafana, when you view a histogram panel, you can click a data point and jump directly to that trace in Tempo or Jaeger.
          - paragraph [ref=e110]: "To enable exemplars in a Python FastAPI service:"
          - code [ref=e113]: "from prometheus_client import Histogram from opentelemetry import trace REQUEST_LATENCY = Histogram( \"http_request_duration_seconds\", \"Request latency\", [\"method\", \"endpoint\", \"status\"], ) def record_request(method, endpoint, status, duration): span = trace.get_current_span() trace_id = format(span.get_span_context().trace_id, \"032x\") REQUEST_LATENCY.labels(method, endpoint, status).observe( duration, exemplar={\"trace_id\": trace_id} )"
          - paragraph [ref=e114]:
            - text: Enable exemplar storage in Prometheus with
            - code [ref=e115]: "--enable-feature=exemplar-storage"
            - text: .
          - heading "The Decision Framework" [level=3] [ref=e116]
          - table [ref=e118]:
            - rowgroup [ref=e119]:
              - row "Dimension Cardinality Where" [ref=e120]:
                - columnheader "Dimension" [ref=e121]
