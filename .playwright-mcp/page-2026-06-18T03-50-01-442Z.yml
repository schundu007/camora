      - generic [ref=e59]:
        - heading "Answer" [level=2] [ref=e60]
        - generic [ref=e61]:
          - 'heading "Multi-Region Active-Active API: Architecture and Conflict Resolution" [level=2] [ref=e62]'
          - paragraph [ref=e63]: Active-active deployments run live traffic across multiple regions simultaneously, with each region accepting both reads and writes. The core challenge is not routing - it is reconciling concurrent writes to shared state.
          - heading "Traffic Routing" [level=3] [ref=e64]
          - paragraph [ref=e65]: Use Route 53 latency-based routing to send users to their closest region. Pair this with geolocation routing rules for data residency requirements (e.g., EU users must stay in eu-west-1).
          - code [ref=e68]: "resource \"aws_route53_record\" \"api\" { zone_id = var.zone_id name = \"api.acecloudinterviews.com\" type = \"A\" set_identifier = \"us-east-1\" latency_routing_policy { region = \"us-east-1\" } alias { name = aws_lb.api_us_east.dns_name zone_id = aws_lb.api_us_east.zone_id evaluate_target_health = true } }"
          - paragraph [ref=e69]: For sub-10ms routing decisions, consider AWS Global Accelerator, which uses Anycast IPs and routes traffic at the AWS network edge rather than waiting for DNS TTL propagation.
          - heading "Database Selection" [level=3] [ref=e70]
          - paragraph [ref=e71]: The database layer determines most of your conflict resolution options.
          - paragraph [ref=e72]:
            - strong [ref=e73]: DynamoDB Global Tables
            - text: is the lowest-ops choice. It replicates across up to 5 regions with sub-second latency and uses last-write-wins based on wall clock timestamps. This is acceptable for user preferences or session data, but dangerous for anything requiring precise ordering (e.g., inventory counts).
          - paragraph [ref=e74]:
            - strong [ref=e75]: Aurora Global Database
            - text: supports up to 5 secondary regions with ~1 second replication lag. Aurora Global now supports write forwarding - secondary regions can accept writes that are transparently forwarded to the primary. This simplifies the client but re-introduces a single write bottleneck for forwarded requests. Use this when you want active-active reads with occasional cross-region writes.
          - paragraph [ref=e76]:
            - strong [ref=e77]: CockroachDB
            - text: "runs Raft consensus across regions. Every write reaches quorum before acknowledging, which means write latency is determined by the two fastest regions in your quorum set. Set locality preferences to pin a table's Raft leader close to its heaviest writers:"
          - code [ref=e80]: "ALTER TABLE orders CONFIGURE ZONE USING lease_preferences = '[[+region=us-east1]]', constraints = '{\"+region=us-east1\": 1, \"+region=eu-west1\": 1, \"+region=ap-southeast1\": 1}';"
          - heading "Conflict Resolution Strategies" [level=3] [ref=e81]
          - paragraph [ref=e82]:
            - strong [ref=e83]: Last-Write-Wins (LWW) with vector clocks
            - text: "- LWW alone is insufficient because NTP drift across regions can be 10-100ms. Vector clocks attach a per-node logical counter to each write, so you can detect concurrent writes rather than silently discarding one:"
          - code [ref=e86]: "# On write record[\"version\"] = { \"region\": \"us-east-1\", \"counter\": current_counter + 1, \"parent\": incoming_version } # On conflict detection def is_concurrent(v1, v2): # Neither version dominates the other return not (dominates(v1, v2) or dominates(v2, v1))"
          - paragraph [ref=e87]: When concurrent writes are detected, surface the conflict to application logic rather than auto-resolving.
          - paragraph [ref=e88]:
            - strong [ref=e89]: CRDTs for counters and sets
            - text: "- Use Conflict-free Replicated Data Types when the operation is commutative. A G-Counter (grow-only counter) stores a per-region count and merges by taking the max per region:"
          - code [ref=e92]: "# Each region increments its own slot counter[\"us-east-1\"] += 1 # Merge: take max per region across replicas def merge(local, remote): return {r: max(local.get(r, 0), remote.get(r, 0)) for r in set(local) | set(remote)} # Read: sum all slots total = sum(counter.values())"
          - paragraph [ref=e93]: This is appropriate for pageview counters, like/dislike counts, and rate limit buckets.
          - paragraph [ref=e94]:
            - strong [ref=e95]: Regional ownership (partition by key)
            - text: "- The most reliable conflict avoidance strategy is assigning write ownership to one region per entity. Route"
            - code [ref=e96]: user_id % 3
            - text: "to a specific region. Other regions can read via replication but forward writes to the owner:"
          - code [ref=e98]: user_id hash -> owner_region lookup -> write forwarded if not owner
          - paragraph [ref=e99]: This works well for user profiles, account balances, and anything where strong consistency per entity outweighs cross-region write latency.
          - heading "Handling Replication Lag" [level=3] [ref=e100]
          - paragraph [ref=e101]: Replication lag of 100-500ms means a user who just wrote data may read stale data from a secondary.
          - paragraph [ref=e102]:
            - strong [ref=e103]: Read-your-own-writes
            - text: ": After a write, stick the client to the write region for 1-2 seconds using a"
            - code [ref=e104]: X-Write-Region
            - text: response header. The client sends this header on subsequent reads, and your load balancer routes accordingly.
          - paragraph [ref=e105]:
            - strong [ref=e106]: Version vectors for conditional reads
            - text: ": Include the write's version token in the response. On the next read, pass it as"
            - code [ref=e107]: "If-Version: <token>"
            - text: . If the reading replica has not yet applied that version, it either waits (up to a timeout) or returns a 202 with a retry hint.
          - paragraph [ref=e108]:
            - strong [ref=e109]: Accept eventual consistency in the UI
            - text: ": For non-critical data, optimistic UI updates hide replication lag entirely. Write locally, display the result immediately, and let the backend converge in the background. Only use consistency tokens for operations where stale reads cause real harm (financial transactions, inventory reservations)."
          - heading "Practical Numbers" [level=3] [ref=e110]
          - list [ref=e111]:
            - listitem [ref=e112]: "DynamoDB Global Tables replication: typically 200-500ms, SLA is sub-second"
            - listitem [ref=e113]:
              - text: "Aurora Global replication lag: under 1 second in practice, measured via"
              - code [ref=e114]: aurora_global_db_replication_lag
              - text: CloudWatch metric
            - listitem [ref=e115]: "CockroachDB cross-region quorum write (us-east + eu-west): ~120ms round trip"
            - listitem [ref=e116]: "Route 53 latency routing decision: ~1ms, DNS TTL 60s means failover takes up to 60s without Global Accelerator"
