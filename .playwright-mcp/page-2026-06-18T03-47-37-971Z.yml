        - generic [ref=e48]:
          - heading "Monitoring alerts stopped firing during a production incident. How do you debug a broken alerting pipeline?" [level=1] [ref=e49]
          - button "0" [ref=e51]:
            - img [ref=e52]
            - generic [ref=e54]: "0"
        - generic [ref=e55]:
          - generic [ref=e56]:
            - generic [ref=e57]: 🔧
            - text: Troubleshooting
          - generic [ref=e58]: Medium
      - generic [ref=e59]:
        - heading "Answer" [level=2] [ref=e60]
        - generic [ref=e61]:
          - heading "Debugging a Broken Alerting Pipeline" [level=2] [ref=e62]
          - paragraph [ref=e63]: "When alerts go silent during an incident, the troubleshooting mindset shifts: you are no longer debugging the underlying system, you are debugging the system that watches the system. Treat the alerting pipeline as a series of discrete stages, each of which can fail independently."
          - separator [ref=e64]
          - heading "Segment the Pipeline" [level=2] [ref=e65]
          - paragraph [ref=e66]: "A typical Prometheus-based alerting pipeline has four stages:"
          - code [ref=e68]: Metric scrape -> TSDB storage -> Rule evaluation -> Alertmanager routing -> Notification delivery
          - paragraph [ref=e69]: Any one of these can break silently. Start by identifying which stage failed before assuming the alert rule itself is wrong.
          - separator [ref=e70]
          - heading "Check Silences and Inhibitions First" [level=2] [ref=e71]
          - paragraph [ref=e72]: "This is the most common cause of missing alerts in production: a silence or inhibition rule left active after a maintenance window."
          - paragraph [ref=e73]:
            - strong [ref=e74]: "In Alertmanager:"
          - code [ref=e77]: "# List active silences via the API curl -s http://alertmanager:9093/api/v2/silences | jq '.[] | select(.status.state == \"active\")' # Or via amtool amtool --alertmanager.url=http://alertmanager:9093 silence query"
          - paragraph [ref=e78]:
            - strong [ref=e79]: "In PagerDuty:"
            - text: Check the service's "Maintenance Windows" tab. It is easy for an on-call engineer to create a 4-hour window and forget to close it.
          - paragraph [ref=e80]:
            - text: Also check inhibition rules in
            - code [ref=e81]: alertmanager.yml
            - text: ". A broad inhibition like \"suppress all warnings when any critical is firing\" can mask alerts if a stale critical alert is stuck in the system:"
          - code [ref=e84]: "inhibit_rules: - source_match: severity: \"critical\" target_match: severity: \"warning\" equal: [\"alertname\", \"namespace\"]"
          - paragraph [ref=e85]: If a critical fires and then the condition clears but the alert fails to resolve, it can suppress warnings indefinitely.
          - separator [ref=e86]
          - heading "Check Metric Ingestion" [level=2] [ref=e87]
          - paragraph [ref=e88]: If the metric itself stopped being scraped, the alert rule will never evaluate to true. A missing metric does not trigger an alert by default - it silently disappears.
          - paragraph [ref=e89]:
            - strong [ref=e90]: "Check Prometheus targets:"
          - code [ref=e93]: "# Look for targets in DOWN or UNKNOWN state curl -s http://prometheus:9090/api/v1/targets | jq '.data.activeTargets[] | select(.health != \"up\") | {job: .labels.job, instance: .labels.instance, error: .lastError}'"
          - paragraph [ref=e94]:
            - strong [ref=e95]: "Check if the metric has recent data:"
          - code [ref=e98]: "# Returns nothing if the metric has stopped arriving absent(http_requests_total{job=\"api-server\"})"
          - paragraph [ref=e99]:
            - text: Using
            - code [ref=e100]: absent()
            - text: in a separate alert rule is a useful diagnostic. In Kubernetes, a pod restart or a failed ServiceMonitor can drop scrape targets without any visible error.
          - paragraph [ref=e101]:
            - strong [ref=e102]: "Check Prometheus scrape logs:"
          - code [ref=e105]: kubectl logs -n monitoring prometheus-0 | grep "scrape failed"
          - separator [ref=e106]
          - heading "Check Rule Evaluation" [level=2] [ref=e107]
          - paragraph [ref=e108]: Even if the metric exists, the rule evaluation itself can fail. Prometheus logs evaluation errors but does not surface them prominently.
          - code [ref=e111]: "# Check for rule evaluation failures curl -s http://prometheus:9090/api/v1/rules | jq '.data.groups[].rules[] | select(.lastError != \"\") | {name: .name, error: .lastError}'"
          - paragraph [ref=e112]: "Also verify the alert is actually in a firing state before blaming the downstream pipeline:"
          - code [ref=e115]: curl -s http://prometheus:9090/api/v1/alerts | jq '.data.alerts[] | select(.labels.alertname == "HighErrorRate")'
          - paragraph [ref=e116]:
            - text: If the alert is firing in Prometheus but not reaching Alertmanager, check the
            - code [ref=e117]: "--alertmanager.url"
            - text: flag on the Prometheus process and network connectivity between them.
          - separator [ref=e118]
          - heading "Check Alertmanager Routing and Delivery" [level=2] [ref=e119]
          - paragraph [ref=e120]: If the alert reaches Alertmanager but no notification is sent, the issue is in routing config or the receiver itself.
          - code [ref=e123]: "# Check what Alertmanager currently has in its alert queue amtool alert query --alertmanager.url=http://alertmanager:9093 # Test a route match against your config amtool config routes test --config.file=alertmanager.yml alertname=HighErrorRate severity=critical team=platform"
          - paragraph [ref=e124]: "For delivery failures (Slack webhook 4xx, PagerDuty token expired, SMTP auth failure), check Alertmanager logs:"
          - code [ref=e127]: kubectl logs -n monitoring alertmanager-0 | grep -i "error\|failed\|notify"
          - separator [ref=e128]
          - 'heading "End-to-End Validation: Dead Man''s Switch" [level=2] [ref=e129]'
          - paragraph [ref=e130]: The only reliable way to confirm the full pipeline is working is a dead man's switch - an alert that always fires, and you alert on its absence.
          - code [ref=e133]: "# Prometheus rule: always firing - alert: DeadMansSwitch expr: vector(1) labels: severity: none annotations: summary: \"Alerting pipeline heartbeat\""
          - code [ref=e136]: "# Alertmanager route: send to a dedicated receiver every 5 minutes - match: alertname: DeadMansSwitch receiver: deadmans-receiver repeat_interval: 5m"
          - paragraph [ref=e137]: In PagerDuty or Opsgenie, configure an incoming heartbeat that expects a ping every 5 minutes. If the ping stops, the monitoring provider fires an alert through its own channel - bypassing your entire pipeline. This catches Prometheus downtime, Alertmanager crashes, network partitions between components, and expired API tokens all at once.
          - paragraph [ref=e138]: Without a dead man's switch, you will only discover a broken alerting pipeline when it fails during an incident - exactly the worst time to find out.
