        - generic [ref=e53]:
          - heading "A deployment succeeded in CI/CD but the application is behaving incorrectly in production. What are the most common causes?" [level=1] [ref=e54]
          - button "0" [ref=e56]:
            - img [ref=e57]
            - generic [ref=e59]: "0"
        - generic [ref=e60]:
          - generic [ref=e61]:
            - generic [ref=e62]: 🔄
            - text: CI/CD
          - generic [ref=e63]: Hard
      - generic [ref=e64]:
        - heading "Answer" [level=2] [ref=e65]
        - generic [ref=e66]:
          - heading "What to Check When a Deployment Succeeds But Production Misbehaves" [level=2] [ref=e67]
          - paragraph [ref=e68]: A green CI/CD pipeline with a broken production app is one of the most disorienting failure modes. The deployment machinery worked - the problem is almost always in the gap between what CI tested and what production actually runs.
          - separator [ref=e69]
          - 'heading "Immediate Investigation: Compare Environments Side by Side" [level=2] [ref=e70]'
          - paragraph [ref=e71]: Start with the environment itself before looking at code or logs.
          - paragraph [ref=e72]:
            - strong [ref=e73]: Environment variables and secrets
          - paragraph [ref=e74]: The most common single cause. CI/CD often injects secrets from a secrets manager or pipeline variables, while production pulls from AWS Secrets Manager, SSM Parameter Store, or a Kubernetes secret. A missing or stale value typically surfaces as a silent misconfiguration rather than an obvious crash.
          - code [ref=e77]: "# On a production instance or pod, dump non-secret env vars printenv | sort > prod-env.txt # Compare with what CI injected (from a recent pipeline artifact or log) diff ci-env.txt prod-env.txt"
          - paragraph [ref=e78]: "For ECS or Lambda, check the task definition or function configuration directly:"
          - code [ref=e81]: aws ecs describe-task-definition --task-definition my-service --query 'taskDefinition.containerDefinitions[0].environment'
          - paragraph [ref=e82]:
            - strong [ref=e83]: Infrastructure differences
          - list [ref=e84]:
            - listitem [ref=e85]: Database connection string pointing to the wrong RDS instance or a replica instead of the primary
            - listitem [ref=e86]: IAM role in production missing a permission that was granted ad hoc in staging
            - listitem [ref=e87]: Security group blocking an internal service call that worked fine in a VPC with different rules
            - listitem [ref=e88]: CPU/memory limits set lower in production causing throttling that looks like app errors
          - code [ref=e91]: "# Confirm which DB endpoint the app resolved at startup aws rds describe-db-instances --query 'DBInstances[*].[DBInstanceIdentifier,Endpoint.Address]' --output table"
          - separator [ref=e92]
          - 'heading "Environment Drift: The Root Cause to Eliminate" [level=2] [ref=e93]'
          - paragraph [ref=e94]: Drift accumulates slowly. A database schema migration runs in staging and then fails silently in production because the migration runner is not wired into the deploy pipeline. A feature flag is toggled on in staging and forgotten. A third-party API key expires in production but was recently rotated in staging.
          - paragraph [ref=e95]:
            - strong [ref=e96]: "Common drift scenarios:"
          - list [ref=e97]:
            - listitem [ref=e98]: Production database is running schema version N-1 because the migration job timed out and the deploy continued anyway
            - listitem [ref=e99]: A config file baked into the container image references a staging URL that slipped through a find-replace
            - listitem [ref=e100]: Production has a caching layer (ElastiCache, CloudFront) that staging does not - stale cached responses look like app bugs
          - paragraph [ref=e101]:
            - strong [ref=e102]: "Check schema version immediately:"
          - code [ref=e105]: "# Alembic cd database && alembic current # Rails bundle exec rails db:version # Flyway flyway info"
          - paragraph [ref=e106]: If the production schema version does not match what the deployed code expects, rollback the deployment first, then fix the migration pipeline.
          - separator [ref=e107]
          - 'heading "Pipeline Improvements: Enforce Parity as a Gate" [level=2] [ref=e108]'
          - paragraph [ref=e109]: Smoke tests should run against the real production endpoint after deploy, not just in a staging environment.
          - code [ref=e112]: "# GitHub Actions post-deploy smoke test - name: Smoke test production run: | STATUS=$(curl -s -o /dev/null -w \"%{http_code}\" https://api.acecloudinterviews.com/api/v1/health) if [ \"$STATUS\" != \"200\" ]; then echo \"Smoke test failed: HTTP $STATUS\" exit 1 fi - name: Check critical user flows run: | curl -sf https://api.acecloudinterviews.com/api/v1/questions?limit=1 | jq '.items | length > 0'"
          - paragraph [ref=e113]: "Add an environment parity check as a required CI step. Diff the required env var keys (not values) between environments using a manifest:"
          - code [ref=e116]: "# required-env-keys.txt checked into the repo # CI verifies all keys exist in the target environment's secrets store while IFS= read -r key; do aws secretsmanager describe-secret --secret-id \"/prd/aceci/$key\" > /dev/null 2>&1 || (echo \"Missing secret: $key\" && exit 1) done < required-env-keys.txt"
          - separator [ref=e117]
          - 'heading "Observability-Driven Detection: Catch It Before Users Do" [level=2] [ref=e118]'
          - paragraph [ref=e119]: If users report broken behavior before your alerts fire, the alerting sensitivity is wrong.
          - paragraph [ref=e120]:
            - strong [ref=e121]: Error rate alerts should trigger within 2-5 minutes of a bad deploy.
            - text: "Set an alarm on HTTP 5xx rate from the ALB:"
          - code [ref=e124]: aws cloudwatch put-metric-alarm --alarm-name "aci-prd-5xx-rate" --metric-name HTTPCode_Target_5XX_Count --namespace AWS/ApplicationELB --statistic Sum --period 60 --evaluation-periods 3 --threshold 10 --comparison-operator GreaterThanThreshold --alarm-actions arn:aws:sns:ap-south-1:ACCOUNT_ID:prd-alerts
          - paragraph [ref=e125]: "Beyond HTTP status codes, watch application-level signals: login success rate, p99 latency on key endpoints, and background job queue depth. A deploy that breaks OAuth silently will not show 5xx errors but will show a login success rate of zero."
          - paragraph [ref=e126]:
            - text: Correlate deploy timestamps with metric graphs. In CloudWatch, deploy events can be logged as annotations using
            - code [ref=e127]: put-metric-data
            - text: with a custom namespace, making it immediately obvious on a latency graph when a bad deploy landed.
