        - heading "More LLM Tools" [level=2] [ref=e361]
        - paragraph [ref=e362]: The playground also has a few general-purpose LLM tools in it.
        - heading "Ollama" [level=3] [ref=e363]
        - paragraph [ref=e364]:
          - link "Ollama" [ref=e365] [cursor=pointer]:
            - /url: https://ollama.ai/
            - text: Ollama
            - img [ref=e366]
          - text: allows you to run large language models locally. It's great for experimenting with different models without sending your code to external services.
        - paragraph [ref=e368]: "To get started with Ollama:"
        - generic [ref=e369]:
          - generic [ref=e370]: Terminal 1
          - code [ref=e372]:
            - generic [ref=e373]: "# Start the Ollama server"
            - generic [ref=e374]: ollama serve
          - button "Copy to clipboard" [ref=e375] [cursor=pointer]:
            - generic [ref=e376]: Copy to clipboard
            - img [ref=e378]
        - generic [ref=e380]:
          - generic [ref=e381]: Terminal 2
          - code [ref=e383]:
            - generic [ref=e384]: "# Pull a model and start using it"
            - generic [ref=e385]: ollama pull llama3.2:latest
            - generic [ref=e386]: ollama run llama3.2:latest
          - button "Copy to clipboard" [ref=e387] [cursor=pointer]:
            - generic [ref=e388]: Copy to clipboard
            - img [ref=e390]
        - heading "LLM (simonw/llm)" [level=3] [ref=e392]
        - paragraph [ref=e393]:
          - link "llm" [ref=e394] [cursor=pointer]:
            - /url: https://github.com/simonw/llm
            - text: llm
            - img [ref=e395]
          - text: is a command-line tool and Python library for interacting with Large Language Models, both via remote APIs and models that can be installed and run on your own machine.
        - paragraph [ref=e397]: "To use it with Ollama:"
        - generic [ref=e398]:
          - code [ref=e400]:
            - generic [ref=e401]: "# Use it with local models (assuming you ollama pull'ed llama3.2:latest)"
            - generic [ref=e402]: llm -m llama3.2:latest 'What is the capital of France?'
            - generic [ref=e404]: "# Or with remote APIs (requires API key configuration)"
            - generic [ref=e405]: llm keys set openai
            - generic [ref=e406]: llm -m gpt-4 'Explain how async/await works in JavaScript'
          - button "Copy to clipboard" [ref=e407] [cursor=pointer]:
            - generic [ref=e408]: Copy to clipboard
            - img [ref=e410]
        - paragraph [ref=e412]:
          - text: You can also use
          - code [ref=e413] [cursor=pointer]: llm
          - text: to manage different model configurations and maintain conversation history across multiple interactions.
        - heading "MCP Tools (f/mcptools)" [level=3] [ref=e414]
        - paragraph [ref=e415]:
          - link "mcptools" [ref=e416] [cursor=pointer]:
            - /url: https://github.com/f/mcptools
            - text: mcptools
            - img [ref=e417]
          - text: is a command-line tool for interacting with MCP (Model Context Protocol) servers using both stdio and HTTP transport.
        - paragraph [ref=e419]: "Example:"
        - generic [ref=e420]:
          - code [ref=e422]:
            - generic [ref=e423]: "# List all available tools from a filesystem server"
            - generic [ref=e424]: mcptools tools \
            - generic [ref=e425]: npx -y @modelcontextprotocol/server-filesystem ~
            - generic [ref=e427]: "# Call a specific tool"
            - generic [ref=e428]: mcptools call read_file \
            - generic [ref=e429]: "--params '{\"path\":\"README.md\"}' \\"
            - generic [ref=e430]: npx -y @modelcontextprotocol/server-filesystem ~
            - generic [ref=e432]: "# Open an interactive shell"
            - generic [ref=e433]: mcptools shell \
            - generic [ref=e434]: npx -y @modelcontextprotocol/server-filesystem ~
          - button "Copy to clipboard" [ref=e435] [cursor=pointer]:
            - generic [ref=e436]: Copy to clipboard
            - img [ref=e438]
