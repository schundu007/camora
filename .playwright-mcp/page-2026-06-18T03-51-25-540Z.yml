        - generic [ref=e48]:
          - heading "You are seeing a latency spike in production. Walk me through how you would use logs, metrics, and traces together to find the root cause in under 15 minutes." [level=1] [ref=e49]
          - button "0" [ref=e51]:
            - img [ref=e52]
            - generic [ref=e54]: "0"
        - generic [ref=e55]:
          - generic [ref=e56]:
            - generic [ref=e57]: 📡
            - text: Observability
          - generic [ref=e58]: Hard
      - generic [ref=e59]:
        - heading "Answer" [level=2] [ref=e60]
        - generic [ref=e61]:
          - heading "Diagnosing a Latency Spike in Under 15 Minutes Using Metrics, Traces, and Logs" [level=2] [ref=e62]
          - paragraph [ref=e63]: "A structured observability workflow separates engineers who find root causes quickly from those who spend hours guessing. The key is using each signal for what it does best: metrics for scope, traces for bottleneck isolation, logs for detail, infrastructure metrics for confirmation."
          - separator [ref=e64]
          - 'heading "Step 1 - Metrics First: Scope the Problem (0-2 min)" [level=2] [ref=e65]'
          - paragraph [ref=e66]: "Start with your metrics dashboard (CloudWatch, Datadog, Grafana) to answer three questions: which service, which endpoint, and since when."
          - paragraph [ref=e67]: "Check p99 and p95 latency across services. A spike in one service with stable neighbors narrows the blast radius immediately. If you use CloudWatch, query the Application Load Balancer:"
          - code [ref=e70]: aws cloudwatch get-metric-statistics --namespace AWS/ApplicationELB --metric-name TargetResponseTime --dimensions Name=LoadBalancer,Value=app/aci-alb/abc123 --start-time 2024-01-15T10:00:00Z --end-time 2024-01-15T10:30:00Z --period 60 --statistics p99
          - paragraph [ref=e71]: "Look for: did error rate increase alongside latency? A latency spike without errors often points to a slow dependency (DB, external API). Errors plus latency usually means saturation or a crash-looping pod."
          - paragraph [ref=e72]: Check request volume. A traffic surge with no code change points to capacity, not a bug.
          - paragraph [ref=e73]:
            - strong [ref=e74]: "Goal by 2 min:"
            - text: You know it is the
            - code [ref=e75]: orders
            - text: service, the
            - code [ref=e76]: /checkout
            - text: endpoint, p99 jumped from 200ms to 4.2s, started at 10:07 UTC.
          - separator [ref=e77]
          - heading "Step 2 - Traces to the Bottleneck (2-7 min)" [level=2] [ref=e78]
          - paragraph [ref=e79]: "Pull distributed traces for slow requests in the spike window. In AWS X-Ray:"
          - code [ref=e82]: aws xray get-service-graph --start-time 1705312020 --end-time 1705312620 aws xray batch-get-traces --trace-ids $(aws xray get-trace-summaries --start-time 1705312020 --end-time 1705312620 --filter-expression 'responsetime > 3' --query 'TraceSummaries[*].Id' --output text)
          - paragraph [ref=e83]:
            - text: In Jaeger or Tempo, filter by service=
            - code [ref=e84]: orders
            - text: ", min duration=3s, time window=10:05-10:15 UTC."
          - paragraph [ref=e85]: "Open a representative slow trace and read the waterfall. You are looking for the span with the long gap - typically one of three culprits:"
          - list [ref=e86]:
            - listitem [ref=e87]:
              - text: A database query span that ballooned (e.g.,
              - code [ref=e88]: postgres:query
              - text: went from 15ms to 3.8s)
            - listitem [ref=e89]: A downstream HTTP call to another service
            - listitem [ref=e90]: A queue publish or cache operation
          - paragraph [ref=e91]: "If the postgres span is 3.8s and the rest of the trace is normal, you now have a precise suspect: the database query in the orders service during checkout."
          - paragraph [ref=e92]:
            - strong [ref=e93]: "Goal by 7 min:"
            - text: The trace waterfall shows
            - code [ref=e94]: orders-db:SELECT
            - text: averaging 3.9s. The query fingerprint is visible in the span attributes.
          - separator [ref=e95]
          - heading "Step 3 - Logs at the Bottleneck (7-12 min)" [level=2] [ref=e96]
          - paragraph [ref=e97]: Narrow logs to the orders service, the 10:07-10:15 UTC window, and filter by the slow query or request IDs from your traces.
          - paragraph [ref=e98]: "In CloudWatch Logs Insights:"
          - code [ref=e100]: fields @timestamp, @message, request_id, duration_ms, query | filter service = "orders" and duration_ms > 2000 | filter @timestamp between 1705312020000 and 1705312620000 | sort @timestamp asc | limit 50
          - paragraph [ref=e101]:
            - text: If your traces carry a
            - code [ref=e102]: trace_id
            - text: or
            - code [ref=e103]: request_id
            - text: ", cross-reference it in logs:"
          - code [ref=e105]: fields @timestamp, @message | filter trace_id = "1-abc-def1234" | sort @timestamp asc
          - paragraph [ref=e106]:
            - text: "Look for: lock wait messages, connection pool exhaustion ("
            - code [ref=e107]: max connections reached
            - text: ), slow query logs, or a repeated pattern (same query, same table). In PostgreSQL slow query logs, a sudden spike in
            - code [ref=e108]: lock_wait
            - text: or
            - code [ref=e109]: Rows Removed
            - text: hints at a table-level problem.
          - paragraph [ref=e110]:
            - strong [ref=e111]: "Goal by 12 min:"
            - text: Logs show
            - code [ref=e112]: lock wait timeout exceeded
            - text: at 10:07:34, coinciding with a long-running migration that started at 10:07:28. That migration held a lock on the
            - code [ref=e113]: orders
            - text: table.
          - separator [ref=e114]
          - heading "Step 4 - Infrastructure Metrics to Confirm (12-15 min)" [level=2] [ref=e115]
          - paragraph [ref=e116]: Now validate whether the bottleneck is resource-constrained or purely logical.
          - code [ref=e119]: "# RDS CPU and connections during the window aws cloudwatch get-metric-statistics --namespace AWS/RDS --metric-name DatabaseConnections --dimensions Name=DBInstanceIdentifier,Value=aci-orders-db --start-time 2024-01-15T10:05:00Z --end-time 2024-01-15T10:20:00Z --period 60 --statistics Maximum"
          - paragraph [ref=e120]:
            - text: "Check: CPU ("
            - code [ref=e121]: CPUUtilization
            - text: ), IOPS (
            - code [ref=e122]: ReadIOPS
            - text: ","
            - code [ref=e123]: WriteIOPS
            - text: ),
            - code [ref=e124]: FreeableMemory
            - text: ", and"
            - code [ref=e125]: DatabaseConnections
            - text: . In this scenario, connections would be normal, IOPS flat, CPU low - confirming the issue is a lock contention problem, not resource saturation. You would not need to scale; you need to kill the blocking session or wait for the migration to complete.
          - paragraph [ref=e126]: For a CPU-bound result, check EC2 or container metrics. For an I/O-bound result, look at EBS throughput or RDS IOPS limits.
          - separator [ref=e127]
          - heading "Summary" [level=2] [ref=e128]
          - table [ref=e130]:
            - rowgroup [ref=e131]:
              - row "Minute Tool Question Answered" [ref=e132]:
                - columnheader "Minute" [ref=e133]
                - columnheader "Tool" [ref=e134]
                - columnheader "Question Answered" [ref=e135]
            - rowgroup [ref=e136]:
              - row "0-2 CloudWatch / Grafana Which service, endpoint, time window" [ref=e137]:
                - cell "0-2" [ref=e138]
                - cell "CloudWatch / Grafana" [ref=e139]
                - cell "Which service, endpoint, time window" [ref=e140]
              - row "2-7 X-Ray / Jaeger Which span is slow" [ref=e141]:
                - cell "2-7" [ref=e142]
                - cell "X-Ray / Jaeger" [ref=e143]
                - cell "Which span is slow" [ref=e144]
              - row "7-12 CloudWatch Logs Insights What is happening inside that span" [ref=e145]:
                - cell "7-12" [ref=e146]
                - cell "CloudWatch Logs Insights" [ref=e147]
                - cell "What is happening inside that span" [ref=e148]
              - row "12-15 CloudWatch RDS/EC2 metrics Is it resource saturation or logical" [ref=e149]:
                - cell "12-15" [ref=e150]
                - cell "CloudWatch RDS/EC2 metrics" [ref=e151]
                - cell "Is it resource saturation or logical" [ref=e152]
          - paragraph [ref=e153]: The discipline here is resisting the urge to jump to logs first. Logs are high-volume and expensive to scan without a target. Metrics give you the target, traces give you the span, logs give you the detail, and infrastructure metrics tell you whether to scale or fix code.
