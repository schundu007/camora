        - generic [ref=e51]:
          - heading "A multi-region deployment is causing latency spikes for users in one region but not others. How do you isolate and resolve it?" [level=1] [ref=e152]
          - generic [ref=e55]:
            - button "0" [ref=e153] [cursor=pointer]:
              - img [ref=e154]
              - generic [ref=e156]: "0"
            - button "Bookmark this" [ref=e157] [cursor=pointer]:
              - img [ref=e158]
        - generic [ref=e58]:
          - generic [ref=e160]:
            - generic [ref=e161]: 🔧
            - text: Troubleshooting
          - generic [ref=e162]: Hard
      - generic [ref=e61]:
        - heading "Answer" [level=2] [ref=e163]
        - generic [ref=e63]:
          - heading "Isolating and Resolving Multi-Region Latency Spikes" [level=2] [ref=e164]
          - paragraph [ref=e165]: "When latency spikes are isolated to one region, the failure is almost never global infrastructure. The investigation follows a structured funnel: confirm scope, check region-specific infrastructure, inspect data replication, then verify DNS routing."
          - separator [ref=e166]
          - 'heading "Step 1: Confirm Which Region Is Affected and When It Started" [level=3] [ref=e167]'
          - paragraph [ref=e168]: Start with CloudFront access logs or Route 53 query logs to confirm the blast radius.
          - paragraph [ref=e169]: "Query CloudFront logs in S3 using Athena to find the affected edge location:"
          - code [ref=e172]: SELECT x_edge_location, AVG(time_taken) AS avg_latency, COUNT(*) AS requests FROM cloudfront_logs WHERE date BETWEEN '2024-01-15' AND '2024-01-16' GROUP BY x_edge_location ORDER BY avg_latency DESC;
          - paragraph [ref=e173]: "If you use an APM like Datadog or AWS X-Ray, filter traces by region tag. In X-Ray:"
          - code [ref=e176]: aws xray get-service-graph --start-time 2024-01-15T10:00:00 --end-time 2024-01-15T11:00:00 --region ap-south-1
          - paragraph [ref=e177]: Correlate the spike start time against recent deployments, ASG scaling events, or RDS failover events using CloudTrail.
          - separator [ref=e178]
          - 'heading "Step 2: Inspect Region-Specific Infrastructure Metrics" [level=3] [ref=e179]'
          - paragraph [ref=e180]: Pull CloudWatch metrics for the affected region's ALB, compute layer, and database separately.
          - paragraph [ref=e181]:
            - strong [ref=e182]: "ALB - check for elevated target response times and 5xx rates:"
          - code [ref=e185]: aws cloudwatch get-metric-statistics --region ap-south-1 --namespace AWS/ApplicationELB --metric-name TargetResponseTime --dimensions Name=LoadBalancer,Value=app/aci-alb/abc123 --start-time 2024-01-15T10:00:00Z --end-time 2024-01-15T11:00:00Z --period 60 --statistics Average P99
          - paragraph [ref=e186]: If P99 is spiking but Average is flat, a subset of instances is degraded. Cross-reference with ASG instance health - check if a recent scale-out brought in cold instances with unwarmed connection pools, or if a node failed its health check mid-flight.
          - paragraph [ref=e187]:
            - strong [ref=e188]: "EC2/ASG - look for CPU saturation or memory pressure:"
          - code [ref=e191]: aws cloudwatch get-metric-statistics --region ap-south-1 --namespace AWS/EC2 --metric-name CPUUtilization --dimensions Name=AutoScalingGroupName,Value=aci-backend-asg --start-time 2024-01-15T10:00:00Z --end-time 2024-01-15T11:00:00Z --period 60 --statistics Average Maximum
          - paragraph [ref=e192]:
            - strong [ref=e193]: "RDS read replica - check for query latency and replica lag:"
          - code [ref=e196]: aws cloudwatch get-metric-statistics --region ap-south-1 --namespace AWS/RDS --metric-name ReplicaLag --dimensions Name=DBInstanceIdentifier,Value=aci-rds-replica-ap --start-time 2024-01-15T10:00:00Z --end-time 2024-01-15T11:00:00Z --period 60 --statistics Maximum
          - paragraph [ref=e197]: Replica lag above a few seconds means reads routed to the replica are returning stale data, causing application-level retries that manifest as latency. A write-heavy workload on the primary without read replica auto-scaling will produce this consistently.
          - separator [ref=e198]
          - 'heading "Step 3: Check Data Replication Lag" [level=3] [ref=e199]'
          - paragraph [ref=e200]:
            - strong [ref=e201]: Aurora Global Database
            - text: exposes
            - code [ref=e202]: AuroraGlobalDBReplicationLag
            - text: in CloudWatch under the
            - code [ref=e203]: AWS/RDS
            - text: namespace. Lag over 1-2 seconds for a read-heavy API means the affected region is serving stale reads and your application is likely retrying or falling back to the primary, adding a cross-region round trip.
          - paragraph [ref=e204]:
            - strong [ref=e205]: DynamoDB Global Tables
            - text: exposes
            - code [ref=e206]: ReplicationLatency
            - text: "per replica table:"
          - code [ref=e209]: aws cloudwatch get-metric-statistics --region ap-south-1 --namespace AWS/DynamoDB --metric-name ReplicationLatency --dimensions Name=TableName,Value=aci-sessions Name=ReceivingRegion,Value=ap-south-1 --start-time 2024-01-15T10:00:00Z --end-time 2024-01-15T11:00:00Z --period 60 --statistics Maximum
          - paragraph [ref=e210]: Replication lag above 1000ms combined with read-your-writes consistency requirements will cause visible latency. The fix is either tolerating eventual consistency explicitly in the application, or temporarily routing writes and reads for affected sessions to the primary region until replication catches up.
          - separator [ref=e211]
          - 'heading "Step 4: Verify DNS and Route 53 Health Check Routing" [level=3] [ref=e212]'
          - paragraph [ref=e213]: "Latency spikes can appear regional when Route 53 health checks are failing and traffic is being routed to a suboptimal region. Check health check status:"
          - code [ref=e216]: "aws route53 list-health-checks | jq '.HealthChecks[] | {Id, Config: .HealthCheckConfig.FullyQualifiedDomainName, Status: .HealthCheckConfig}' aws route53 get-health-check-status --health-check-id <id>"
          - paragraph [ref=e217]: "A common failure mode: the health check endpoint in ap-south-1 starts responding slowly (due to the same underlying issue), Route 53 marks it unhealthy, and traffic fails over to us-east-1. Users in Asia-Pacific are now hitting a region 200ms away, which looks like a regional latency spike but is actually a routing failure."
          - paragraph [ref=e218]: "Fix the health check threshold to distinguish between \"slow\" and \"down\" to avoid premature failover:"
          - code [ref=e221]: "{ \"FailureThreshold\": 3, \"RequestInterval\": 30, \"Type\": \"HTTPS\", \"ResourcePath\": \"/api/v1/health\", \"MeasureLatency\": true }"
          - paragraph [ref=e222]:
            - text: Setting
            - code [ref=e223]: "MeasureLatency: true"
            - text: exposes health check response time in CloudWatch, letting you distinguish routing failures from infrastructure failures.
          - separator [ref=e224]
          - heading "Resolution Workflow Summary" [level=3] [ref=e225]
          - list [ref=e226]:
            - listitem [ref=e227]: Confirm affected region and spike start time via CloudFront/X-Ray logs
            - listitem [ref=e228]: Check ALB P99, ASG CPU, and RDS replica lag in the affected region
            - listitem [ref=e229]: If replica lag is elevated, temporarily redirect reads to the primary or reduce retry aggression
            - listitem [ref=e230]: Check Route 53 health check status - if failover is happening incorrectly, fix the health endpoint or threshold
            - listitem [ref=e231]:
              - text: After resolution, add CloudWatch alarms on
              - code [ref=e232]: ReplicaLag > 5s
              - text: and
              - code [ref=e233]: TargetResponseTime P99 > threshold
              - text: per region to catch this class of failure earlier
