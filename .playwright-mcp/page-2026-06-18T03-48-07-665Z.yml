            - text: Troubleshooting
          - generic [ref=e58]: Hard
      - generic [ref=e59]:
        - heading "Answer" [level=2] [ref=e60]
        - generic [ref=e61]:
          - heading "Diagnosing Monthly RDS CPU Spikes" [level=2] [ref=e62]
          - paragraph [ref=e63]: "A once-a-month CPU spike has a signature: it is almost always triggered by a scheduled event, not random load. Your investigation should start by pinning down the exact trigger before touching the database."
          - 'heading "Step 1: Establish the Timeline" [level=3] [ref=e64]'
          - paragraph [ref=e65]: "Pull CloudWatch metrics to get the precise start time, duration, and shape of the spike:"
          - code [ref=e68]: aws cloudwatch get-metric-statistics --namespace AWS/RDS --metric-name CPUUtilization --dimensions Name=DBInstanceIdentifier,Value=your-db-instance --start-time 2024-01-01T00:00:00Z --end-time 2024-02-01T00:00:00Z --period 300 --statistics Maximum --output table
          - paragraph [ref=e69]: "Note the exact timestamp. Cross-reference against:"
          - list [ref=e70]:
            - listitem [ref=e71]:
              - text: Cron jobs on application servers (
              - code [ref=e72]: crontab -l
              - text: ", systemd timers)"
            - listitem [ref=e73]: Lambda functions with scheduled EventBridge rules
            - listitem [ref=e74]:
              - text: RDS automated maintenance windows (
              - code [ref=e75]: aws rds describe-db-instances | jq '.DBInstances[].PreferredMaintenanceWindow'
              - text: )
            - listitem [ref=e76]: Batch jobs or report generation pipelines
            - listitem [ref=e77]: Database-level scheduled tasks (pg_cron, SQL Server Agent jobs)
          - paragraph [ref=e78]: A sudden vertical spike that resolves in minutes points to a fast but expensive query. A gradual climb over 30-60 minutes suggests a batch process doing large sequential reads.
          - 'heading "Step 2: Identify the Offending Query" [level=3] [ref=e79]'
          - paragraph [ref=e80]:
            - strong [ref=e81]: Performance Insights
            - text: is your primary tool. Enable it if not already on - it adds negligible overhead and retains 7 days free.
          - paragraph [ref=e82]: "In the console, navigate to Performance Insights for the instance and set the time window to the spike period. Look at:"
          - list [ref=e83]:
            - listitem [ref=e84]:
              - strong [ref=e85]: Top SQL by CPU
              - text: "- the query consuming the most DB time during the window"
            - listitem [ref=e86]:
              - strong [ref=e87]: Wait events
              - text: "-"
              - code [ref=e88]: io/file/sql/binlog
              - text: or
              - code [ref=e89]: io/aurora_redo_log_flush
              - text: suggests I/O bound;
              - code [ref=e90]: CPU
              - text: wait type confirms compute-bound work
            - listitem [ref=e91]:
              - strong [ref=e92]: DB load
              - text: "- measured in AAS (Average Active Sessions), anything above your vCPU count means queueing"
          - paragraph [ref=e93]:
            - text: For PostgreSQL,
            - code [ref=e94]: pg_stat_statements
            - text: "gives cumulative query stats:"
          - code [ref=e97]: SELECT query, calls, total_exec_time / calls AS avg_ms, rows / calls AS avg_rows, 100.0 * total_exec_time / sum(total_exec_time) OVER () AS pct_total_time FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20;
          - paragraph [ref=e98]:
            - text: Run this immediately after a spike before stats roll over. The query with the highest
            - code [ref=e99]: total_exec_time
            - text: and low
            - code [ref=e100]: calls
            - text: count is the monthly batch culprit.
          - 'heading "Step 3: Diagnose the Query" [level=3] [ref=e101]'
          - paragraph [ref=e102]:
            - text: Run
            - code [ref=e103]: EXPLAIN (ANALYZE, BUFFERS)
            - text: "against the suspected query:"
          - code [ref=e106]: EXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT) SELECT * FROM orders o JOIN order_items oi ON o.id = oi.order_id WHERE o.created_at >= '2024-01-01' AND o.status = 'pending';
          - paragraph [ref=e107]: "Look for:"
          - list [ref=e108]:
            - listitem [ref=e109]:
              - code [ref=e110]: Seq Scan
              - text: on a large table - missing index on the filter column
            - listitem [ref=e111]:
              - code [ref=e112]: Nested Loop
              - text: with high
              - code [ref=e113]: rows
              - text: estimates - N+1 pattern from an ORM, often from
              - code [ref=e114]: SELECT *
              - text: followed by per-row queries
            - listitem [ref=e115]:
              - code [ref=e116]: Hash Join
              - text: with large memory spills to disk -
              - code [ref=e117]: work_mem
              - text: too low for the query
            - listitem [ref=e118]:
              - text: Row estimate mismatches (estimated 100, actual 2,000,000) - stale table statistics, run
              - code [ref=e119]: ANALYZE orders
          - paragraph [ref=e120]: "The most common monthly spike pattern: a reporting query or cleanup job doing a full table scan on an orders/events table that has grown large enough to tip from fast to catastrophic."
          - heading "Fix the Query, Not the Instance" [level=3] [ref=e121]
          - paragraph [ref=e122]: Resizing the RDS instance is the wrong first move. It masks the problem and costs money permanently.
          - paragraph [ref=e123]: "Common fixes:"
          - code [ref=e126]: "-- Add a partial index for the batch job's filter CREATE INDEX CONCURRENTLY idx_orders_status_created ON orders (created_at) WHERE status = 'pending'; -- For an ORM N+1, rewrite to a single JOIN query or use eager loading -- Django: Order.objects.select_related('customer').prefetch_related('items') -- SQLAlchemy: session.query(Order).options(joinedload(Order.items))"
          - paragraph [ref=e127]: "If the job is a monthly archive or delete, run it in batches with a sleep between iterations to avoid locking and sustained CPU load:"
          - code [ref=e130]: "while True: deleted = db.execute( \"DELETE FROM events WHERE created_at < NOW() - INTERVAL '1 year' LIMIT 10000\" ) if deleted.rowcount == 0: break time.sleep(0.1)"
          - 'heading "Step 4: Set Up Proactive Monitoring" [level=3] [ref=e131]'
          - paragraph [ref=e132]: "Create a CloudWatch alarm to catch the next spike before users notice:"
          - code [ref=e135]: aws cloudwatch put-metric-alarm --alarm-name rds-cpu-high --metric-name CPUUtilization --namespace AWS/RDS --dimensions Name=DBInstanceIdentifier,Value=your-db-instance --threshold 80 --comparison-operator GreaterThanThreshold --evaluation-periods 3 --period 300 --statistic Average --alarm-actions arn:aws:sns:ap-south-1:123456789:alerts
          - paragraph [ref=e136]: This fires after 15 sustained minutes above 80%, avoiding false alarms from transient spikes. Pair it with a Performance Insights dashboard showing a 30-day baseline so you can visually distinguish normal from anomalous load patterns at a glance.
