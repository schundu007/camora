                - listitem [ref=e190]:
                  - paragraph [ref=e191]:
                    - link "git-pull[1]" [ref=e192] [cursor=pointer]:
                      - /url: /docs/git-pull
                    - text: and
                    - link "git-fetch[1]" [ref=e193] [cursor=pointer]:
                      - /url: /docs/git-fetch
                    - text: from "origin" to keep up-to-date with the upstream.
                - listitem [ref=e194]:
                  - paragraph [ref=e195]:
                    - link "git-push[1]" [ref=e196] [cursor=pointer]:
                      - /url: /docs/git-push
                    - text: to shared repository, if you adopt CVS style shared repository workflow.
                - listitem [ref=e197]:
                  - paragraph [ref=e198]:
                    - link "git-format-patch[1]" [ref=e199] [cursor=pointer]:
                      - /url: /docs/git-format-patch
                    - text: to prepare e-mail submission, if you adopt Linux kernel-style public forum workflow.
                - listitem [ref=e200]:
                  - paragraph [ref=e201]:
                    - link "git-send-email[1]" [ref=e202] [cursor=pointer]:
                      - /url: /docs/git-send-email
                    - text: to send your e-mail submission without corruption by your MUA.
                - listitem [ref=e203]:
                  - paragraph [ref=e204]:
                    - link "git-request-pull[1]" [ref=e205] [cursor=pointer]:
                      - /url: /docs/git-request-pull
                    - text: to create a summary of changes for your upstream to pull.
              - generic [ref=e206]:
                - heading "Examples" [level=3] [ref=e207]
                - generic [ref=e209]:
                  - term [ref=e210]: Clone the upstream and work on it. Feed changes to upstream.
                  - definition [ref=e211]:
                    - generic [ref=e214]: $ git clone git://git.kernel.org/pub/scm/.../torvalds/linux-2.6 my2.6 $ cd my2.6 $ git switch -c mine master (1) $ edit/compile/test; git commit -a -s (2) $ git format-patch master (3) $ git send-email --to="person <email@example.com>" 00*.patch (4) $ git switch master (5) $ git pull (6) $ git log -p ORIG_HEAD.. arch/i386 include/asm-i386 (7) $ git ls-remote --heads http://git.kernel.org/.../jgarzik/libata-dev.git (8) $ git pull git://git.kernel.org/pub/.../jgarzik/libata-dev.git ALL (9) $ git reset --hard ORIG_HEAD (10) $ git gc (11)
                    - list [ref=e216]:
                      - listitem [ref=e217]:
                        - paragraph [ref=e218]:
                          - text: checkout a new branch
                          - code [ref=e220]: mine
                          - text: from master.
                      - listitem [ref=e221]:
                        - paragraph [ref=e222]: repeat as needed.
                      - listitem [ref=e223]:
                        - paragraph [ref=e224]: extract patches from your branch, relative to master,
                      - listitem [ref=e225]:
                        - paragraph [ref=e226]: and email them.
                      - listitem [ref=e227]:
                        - paragraph [ref=e228]:
                          - text: return to
                          - code [ref=e230]: master
                          - text: ", ready to see what’s new"
                      - listitem [ref=e231]:
                        - paragraph [ref=e232]:
                          - generic [ref=e233]:
                            - code [ref=e234]: git
                            - code [ref=e235]: pull
                          - text: fetches from
                          - code [ref=e237]: origin
                          - text: by default and merges into the current branch.
                      - listitem [ref=e238]:
                        - paragraph [ref=e239]: immediately after pulling, look at the changes done upstream since last time we checked, only in the area we are interested in.
                      - listitem [ref=e240]:
                        - paragraph [ref=e241]: check the branch names in an external repository (if not known).
                      - listitem [ref=e242]:
                        - paragraph [ref=e243]:
                          - text: fetch from a specific branch
                          - code [ref=e245]: ALL
                          - text: from a specific repository and merge it.
                      - listitem [ref=e246]:
                        - paragraph [ref=e247]: revert the pull.
                      - listitem [ref=e248]:
                        - paragraph [ref=e249]: garbage collect leftover objects from reverted pull.
                  - term [ref=e250]: Push into another repository.
                  - definition [ref=e251]:
                    - generic [ref=e254]: satellite$ git clone mothership:frotz frotz (1) satellite$ cd frotz satellite$ git config --get-regexp '^(remote|branch)\.' (2) remote.origin.url mothership:frotz remote.origin.fetch refs/heads/*:refs/remotes/origin/* branch.master.remote origin branch.master.merge refs/heads/master satellite$ git config remote.origin.push \ +refs/heads/*:refs/remotes/satellite/* (3) satellite$ edit/compile/test/commit satellite$ git push origin (4) mothership$ cd frotz mothership$ git switch master mothership$ git merge satellite/master (5)
                    - list [ref=e256]:
                      - listitem [ref=e257]:
                        - paragraph [ref=e258]: mothership machine has a frotz repository under your home directory; clone from it to start a repository on the satellite machine.
                      - listitem [ref=e259]:
                        - paragraph [ref=e260]:
                          - text: clone sets these configuration variables by default. It arranges
                          - generic [ref=e261]:
                            - code [ref=e262]: git
                            - code [ref=e263]: pull
                          - text: to fetch and store the branches of mothership machine to local
                          - code [ref=e265]: remotes/origin/*
                          - text: remote-tracking branches.
                      - listitem [ref=e266]:
                        - paragraph [ref=e267]:
                          - text: arrange
                          - generic [ref=e268]:
                            - code [ref=e269]: git
                            - code [ref=e270]: push
                          - text: to push all local branches to their corresponding branch of the mothership machine.
                      - listitem [ref=e271]:
                        - paragraph [ref=e272]:
                          - text: push will stash all our work away on
                          - code [ref=e274]: remotes/satellite/*
                          - text: remote-tracking branches on the mothership machine. You could use this as a back-up method. Likewise, you can pretend that mothership "fetched" from you (useful when access is one sided).
                      - listitem [ref=e275]:
                        - paragraph [ref=e276]: on mothership machine, merge the work done on the satellite machine into the master branch.
                  - term [ref=e277]: Branch off of a specific tag.
                  - definition [ref=e278]:
                    - generic [ref=e281]: $ git switch -c private2.6.14 v2.6.14 (1) $ edit/compile/test; git commit -a $ git checkout master $ git cherry-pick v2.6.14..private2.6.14 (2)
                    - list [ref=e283]:
                      - listitem [ref=e284]:
                        - paragraph [ref=e285]: create a private branch based on a well known (but somewhat behind) tag.
                      - listitem [ref=e286]:
                        - paragraph [ref=e287]:
                          - text: forward port all changes in
                          - code [ref=e289]: private2.6.14
                          - text: branch to
                          - code [ref=e291]: master
                          - text: branch without a formal "merging". Or longhand
                          - generic [ref=e292]:
                            - code [ref=e293]: git
                            - code [ref=e294]: format-patch
                            - code [ref=e295]: "-k"
                            - code [ref=e296]: "-m"
                            - code [ref=e297]: "--stdout"
                            - code [ref=e298]: v2.6.14..private2.6.14
                            - text: "|"
                            - code [ref=e299]: git
                            - code [ref=e300]: am
                            - code [ref=e301]: "-3"
                            - code [ref=e302]: "-k"
                - paragraph [ref=e304]:
                  - text: An alternate participant submission mechanism is using the
                  - generic [ref=e305]:
                    - code [ref=e306]: git
                    - code [ref=e307]: request-pull
                  - text: or pull-request mechanisms (e.g. as used on GitHub (www.github.com) to notify your upstream of your contribution.
          - generic [ref=e308]:
            - heading "Integrator" [level=2] [ref=e309]: Integrator
            - generic [ref=e310]:
              - paragraph [ref=e312]: A fairly central person acting as the integrator in a group project receives changes made by others, reviews and integrates them and publishes the result for others to use, using these commands in addition to the ones needed by participants.
              - paragraph [ref=e314]:
                - text: This section can also be used by those who respond to
                - generic [ref=e315]:
                  - code [ref=e316]: git
                  - code [ref=e317]: request-pull
                - text: or pull-request on GitHub (www.github.com) to integrate the work of others into their history. A sub-area lieutenant for a repository will act both as a participant and as an integrator.
              - list [ref=e319]:
                - listitem [ref=e320]:
                  - paragraph [ref=e321]:
                    - link "git-am[1]" [ref=e322] [cursor=pointer]:
                      - /url: /docs/git-am
                    - text: to apply patches e-mailed in from your contributors.
                - listitem [ref=e323]:
                  - paragraph [ref=e324]:
                    - link "git-pull[1]" [ref=e325] [cursor=pointer]:
                      - /url: /docs/git-pull
                    - text: to merge from your trusted lieutenants.
                - listitem [ref=e326]:
                  - paragraph [ref=e327]:
                    - link "git-format-patch[1]" [ref=e328] [cursor=pointer]:
                      - /url: /docs/git-format-patch
                    - text: to prepare and send suggested alternative to contributors.
                - listitem [ref=e329]:
                  - paragraph [ref=e330]:
                    - link "git-revert[1]" [ref=e331] [cursor=pointer]:
                      - /url: /docs/git-revert
                    - text: to undo botched commits.
                - listitem [ref=e332]:
                  - paragraph [ref=e333]:
                    - link "git-push[1]" [ref=e334] [cursor=pointer]:
                      - /url: /docs/git-push
                    - text: to publish the bleeding edge.
              - generic [ref=e335]:
                - heading "Examples" [level=3] [ref=e336]
                - generic [ref=e338]:
                  - term [ref=e339]: A typical integrator’s Git day.
                  - definition [ref=e340]:
                    - generic [ref=e343]: $ git status (1) $ git branch --no-merged master (2) $ mailx (3) & s 2 3 4 5 ./+to-apply & s 7 8 ./+hold-linus & q $ git switch -c topic/one master $ git am -3 -i -s ./+to-apply (4) $ compile/test $ git switch -c hold/linus && git am -3 -i -s ./+hold-linus (5) $ git switch topic/one && git rebase master (6) $ git switch -C seen next (7) $ git merge topic/one topic/two && git merge hold/linus (8) $ git switch maint $ git cherry-pick master~4 (9) $ compile/test $ git tag -s -m "GIT 0.99.9x" v0.99.9x (10) $ git fetch ko && for branch in master maint next seen (11) do git show-branch ko/$branch $branch (12) done $ git push --follow-tags ko (13)
                    - list [ref=e345]:
                      - listitem [ref=e346]:
                        - paragraph [ref=e347]: see what you were in the middle of doing, if anything.
                      - listitem [ref=e348]:
                        - paragraph [ref=e349]:
                          - text: see which branches haven’t been merged into
                          - code [ref=e351]: master
                          - text: yet. Likewise for any other integration branches e.g.
                          - code [ref=e353]: maint
                          - text: ","
                          - code [ref=e355]: next
                          - text: and
                          - code [ref=e357]: seen
                          - text: .
                      - listitem [ref=e358]:
                        - paragraph [ref=e359]: read mails, save ones that are applicable, and save others that are not quite ready (other mail readers are available).
                      - listitem [ref=e360]:
                        - paragraph [ref=e361]: apply them, interactively, with your sign-offs.
                      - listitem [ref=e362]:
                        - paragraph [ref=e363]: create topic branch as needed and apply, again with sign-offs.
                      - listitem [ref=e364]:
                        - paragraph [ref=e365]: rebase internal topic branch that has not been merged to the master or exposed as a part of a stable branch.
                      - listitem [ref=e366]:
                        - paragraph [ref=e367]:
                          - text: restart
                          - code [ref=e369]: seen
                          - text: every time from the next.
                      - listitem [ref=e370]:
                        - paragraph [ref=e371]: and bundle topic branches still cooking.
                      - listitem [ref=e372]:
                        - paragraph [ref=e373]: backport a critical fix.
                      - listitem [ref=e374]:
                        - paragraph [ref=e375]: create a signed tag.
                      - listitem [ref=e376]:
                        - paragraph [ref=e377]: make sure master was not accidentally rewound beyond that already pushed out.
                      - listitem [ref=e378]:
                        - paragraph [ref=e379]:
                          - text: In the output from
                          - generic [ref=e380]:
                            - code [ref=e381]: git
                            - code [ref=e382]: show-branch
                          - text: ","
                          - code [ref=e384]: master
                          - text: should have everything
                          - code [ref=e386]: ko/master
                          - text: has, and
                          - code [ref=e388]: next
                          - text: should have everything
                          - code [ref=e390]: ko/next
                          - text: has, etc.
                      - listitem [ref=e391]:
                        - paragraph [ref=e392]: push out the bleeding edge, together with new tags that point into the pushed history.
                - paragraph [ref=e394]:
                  - text: In this example, the
                  - code [ref=e396]: ko
                  - text: "shorthand points at the Git maintainer’s repository at kernel.org, and looks like this:"
                - generic [ref=e399]: (in .git/config) [remote "ko"] url = kernel.org:/pub/scm/git/git.git fetch = refs/heads/*:refs/remotes/ko/* push = refs/heads/master push = refs/heads/next push = +refs/heads/seen push = refs/heads/maint
          - generic [ref=e400]:
            - heading "Repository Administration" [level=2] [ref=e401]: Repository Administration
            - generic [ref=e402]:
              - paragraph [ref=e404]: A repository administrator uses the following tools to set up and maintain access to the repository by developers.
              - list [ref=e406]:
                - listitem [ref=e407]:
                  - paragraph [ref=e408]:
                    - link "git-daemon[1]" [ref=e409] [cursor=pointer]:
                      - /url: /docs/git-daemon
                    - text: to allow anonymous download from repository.
                - listitem [ref=e410]:
                  - paragraph [ref=e411]:
                    - link "git-shell[1]" [ref=e412] [cursor=pointer]:
                      - /url: /docs/git-shell
                    - text: can be used as a
                    - emphasis [ref=e413]: restricted login shell
                    - text: for shared central repository users.
                - listitem [ref=e414]:
                  - paragraph [ref=e415]:
                    - link "git-http-backend[1]" [ref=e416] [cursor=pointer]:
