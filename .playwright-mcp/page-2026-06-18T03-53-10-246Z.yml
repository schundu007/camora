            - paragraph [ref=e63]: Everyday Git With 20 Commands Or So
          - generic [ref=e64]:
            - heading "DESCRIPTION" [level=2] [ref=e65]
            - generic [ref=e66]:
              - paragraph [ref=e68]: Git users can broadly be grouped into four categories for the purposes of describing here a small set of useful commands for everyday Git.
              - list [ref=e70]:
                - listitem [ref=e71]:
                  - paragraph [ref=e72]:
                    - link "Individual Developer (Standalone)" [ref=e73] [cursor=pointer]:
                      - /url: "#STANDALONE"
                    - text: commands are essential for anybody who makes a commit, even for somebody who works alone.
                - listitem [ref=e74]:
                  - paragraph [ref=e75]:
                    - text: If you work with other people, you will need commands listed in the
                    - link "Individual Developer (Participant)" [ref=e76] [cursor=pointer]:
                      - /url: "#PARTICIPANT"
                    - text: section as well.
                - listitem [ref=e77]:
                  - paragraph [ref=e78]:
                    - text: People who play the
                    - link "Integrator" [ref=e79] [cursor=pointer]:
                      - /url: "#INTEGRATOR"
                    - text: role need to learn some more commands in addition to the above.
                - listitem [ref=e80]:
                  - paragraph [ref=e81]:
                    - link "Repository Administration" [ref=e82] [cursor=pointer]:
                      - /url: "#ADMINISTRATION"
                    - text: commands are for system administrators who are responsible for the care and feeding of Git repositories.
          - generic [ref=e83]:
            - heading "Individual Developer (Standalone)" [level=2] [ref=e84]: Individual Developer (Standalone)
            - generic [ref=e85]:
              - paragraph [ref=e87]: A standalone individual developer does not exchange patches with other people, and works alone in a single repository, using the following commands.
              - list [ref=e89]:
                - listitem [ref=e90]:
                  - paragraph [ref=e91]:
                    - link "git-init[1]" [ref=e92] [cursor=pointer]:
                      - /url: /docs/git-init
                    - text: to create a new repository.
                - listitem [ref=e93]:
                  - paragraph [ref=e94]:
                    - link "git-log[1]" [ref=e95] [cursor=pointer]:
                      - /url: /docs/git-log
                    - text: to see what happened.
                - listitem [ref=e96]:
                  - paragraph [ref=e97]:
                    - link "git-switch[1]" [ref=e98] [cursor=pointer]:
                      - /url: /docs/git-switch
                    - text: and
                    - link "git-branch[1]" [ref=e99] [cursor=pointer]:
                      - /url: /docs/git-branch
                    - text: to switch branches.
                - listitem [ref=e100]:
                  - paragraph [ref=e101]:
                    - link "git-add[1]" [ref=e102] [cursor=pointer]:
                      - /url: /docs/git-add
                    - text: to manage the index file.
                - listitem [ref=e103]:
                  - paragraph [ref=e104]:
                    - link "git-diff[1]" [ref=e105] [cursor=pointer]:
                      - /url: /docs/git-diff
                    - text: and
                    - link "git-status[1]" [ref=e106] [cursor=pointer]:
                      - /url: /docs/git-status
                    - text: to see what you are in the middle of doing.
                - listitem [ref=e107]:
                  - paragraph [ref=e108]:
                    - link "git-commit[1]" [ref=e109] [cursor=pointer]:
                      - /url: /docs/git-commit
                    - text: to advance the current branch.
                - listitem [ref=e110]:
                  - paragraph [ref=e111]:
                    - link "git-restore[1]" [ref=e112] [cursor=pointer]:
                      - /url: /docs/git-restore
                    - text: to undo changes.
                - listitem [ref=e113]:
                  - paragraph [ref=e114]:
                    - link "git-merge[1]" [ref=e115] [cursor=pointer]:
                      - /url: /docs/git-merge
                    - text: to merge between local branches.
                - listitem [ref=e116]:
                  - paragraph [ref=e117]:
                    - link "git-rebase[1]" [ref=e118] [cursor=pointer]:
                      - /url: /docs/git-rebase
                    - text: to maintain topic branches.
                - listitem [ref=e119]:
                  - paragraph [ref=e120]:
                    - link "git-tag[1]" [ref=e121] [cursor=pointer]:
                      - /url: /docs/git-tag
                    - text: to mark a known point.
              - generic [ref=e122]:
                - heading "Examples" [level=3] [ref=e123]
                - generic [ref=e125]:
                  - term [ref=e126]: Use a tarball as a starting point for a new repository.
                  - definition [ref=e127]:
                    - generic [ref=e130]: $ tar zxf frotz.tar.gz $ cd frotz $ git init $ git add . (1) $ git commit -m "import of frotz source tree." $ git tag v2.43 (2)
                    - list [ref=e132]:
                      - listitem [ref=e133]:
                        - paragraph [ref=e134]: add everything under the current directory.
                      - listitem [ref=e135]:
                        - paragraph [ref=e136]: make a lightweight, unannotated tag.
                  - term [ref=e137]: Create a topic branch and develop.
                  - definition [ref=e138]:
                    - generic [ref=e141]: $ git switch -c alsa-audio (1) $ edit/compile/test $ git restore curses/ux_audio_oss.c (2) $ git add curses/ux_audio_alsa.c (3) $ edit/compile/test $ git diff HEAD (4) $ git commit -a -s (5) $ edit/compile/test $ git diff HEAD^ (6) $ git commit -a --amend (7) $ git switch master (8) $ git merge alsa-audio (9) $ git log --since='3 days ago' (10) $ git log v2.43.. curses/ (11)
                    - list [ref=e143]:
                      - listitem [ref=e144]:
                        - paragraph [ref=e145]: create a new topic branch.
                      - listitem [ref=e146]:
                        - paragraph [ref=e147]:
                          - text: revert your botched changes in
                          - code [ref=e149]: curses/ux_audio_oss.c
                          - text: .
                      - listitem [ref=e150]:
                        - paragraph [ref=e151]:
                          - text: you need to tell Git if you added a new file; removal and modification will be caught if you do
                          - generic [ref=e152]:
                            - code [ref=e153]: git
                            - code [ref=e154]: commit
                            - code [ref=e155]: "-a"
                          - text: later.
                      - listitem [ref=e156]:
                        - paragraph [ref=e157]: to see what changes you are committing.
                      - listitem [ref=e158]:
                        - paragraph [ref=e159]: commit everything, as you have tested, with your sign-off.
                      - listitem [ref=e160]:
                        - paragraph [ref=e161]: look at all your changes including the previous commit.
                      - listitem [ref=e162]:
                        - paragraph [ref=e163]: amend the previous commit, adding all your new changes, using your original message.
                      - listitem [ref=e164]:
                        - paragraph [ref=e165]: switch to the master branch.
                      - listitem [ref=e166]:
                        - paragraph [ref=e167]: merge a topic branch into your master branch.
                      - listitem [ref=e168]:
                        - paragraph [ref=e169]:
                          - text: review commit logs; other forms to limit output can be combined and include
                          - code [ref=e171]: "-10"
                          - text: (to show up to 10 commits),
                          - code [ref=e173]: "--until=2005-12-10"
                          - text: ", etc."
                      - listitem [ref=e174]:
                        - paragraph [ref=e175]:
                          - text: view only the changes that touch what’s in
                          - code [ref=e177]: curses/
                          - text: directory, since
                          - code [ref=e179]: v2.43
                          - text: tag.
          - generic [ref=e180]:
            - heading "Individual Developer (Participant)" [level=2] [ref=e181]: Individual Developer (Participant)
            - generic [ref=e182]:
              - paragraph [ref=e184]: A developer working as a participant in a group project needs to learn how to communicate with others, and uses these commands in addition to the ones needed by a standalone developer.
              - list [ref=e186]:
                - listitem [ref=e187]:
                  - paragraph [ref=e188]:
                    - link "git-clone[1]" [ref=e189] [cursor=pointer]:
                      - /url: /docs/git-clone
