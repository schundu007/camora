<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510">
<defs>
  <marker id="ya" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#d29922"/></marker>
  <marker id="yb" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#8b949e"/></marker>
</defs>

<!-- Background -->
<rect width="920" height="510" fill="#0d1117"/>

<!-- Title -->
<text x="460" y="26" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#e6edf3" font-weight="bold">Microservices Architecture – Decomposition, Service Discovery, and Database-per-Service</text>

<!-- ── MONOLITH ── -->
<text x="128" y="52" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#8b949e" letter-spacing="1.5">MONOLITH</text>
<rect x="22" y="58" width="212" height="295" rx="3" fill="none" stroke="#d29922" stroke-width="1.5"/>
<text x="128" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#d29922" font-weight="bold">Single Deployable Unit</text>

<rect x="36" y="86"  width="185" height="27" rx="2" fill="none" stroke="#30363d" stroke-width="1"/>
<text x="128" y="104" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">User Module</text>
<rect x="36" y="120" width="185" height="27" rx="2" fill="none" stroke="#30363d" stroke-width="1"/>
<text x="128" y="138" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">Order Module</text>
<rect x="36" y="154" width="185" height="27" rx="2" fill="none" stroke="#30363d" stroke-width="1"/>
<text x="128" y="172" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">Payment Module</text>
<rect x="36" y="188" width="185" height="27" rx="2" fill="none" stroke="#30363d" stroke-width="1"/>
<text x="128" y="206" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">Notification Module</text>

<ellipse cx="128" cy="256" rx="62" ry="22" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="128" y="261" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">Single DB</text>

<text x="128" y="303" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#f85149">One bug crashes everything</text>
<text x="128" y="318" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#f85149">Scale all-or-nothing</text>

<!-- Decompose arrow -->
<line x1="234" y1="217" x2="298" y2="217" stroke="#d29922" stroke-width="1.5" marker-end="url(#ya)"/>
<text x="266" y="210" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#d29922">Decompose</text>

<!-- Client box -->
<rect x="300" y="197" width="88" height="40" rx="3" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="344" y="213" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">Client</text>
<text x="344" y="227" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#8b949e">(Web / Mobile)</text>

<!-- HTTPS arrow -->
<line x1="388" y1="217" x2="416" y2="217" stroke="#8b949e" stroke-width="1.5" marker-end="url(#yb)"/>
<text x="402" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#8b949e">HTTPS</text>

<!-- API Gateway box -->
<rect x="418" y="175" width="110" height="84" rx="3" fill="none" stroke="#d29922" stroke-width="1.5"/>
<text x="473" y="195" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#d29922" font-weight="bold">API Gateway</text>
<text x="473" y="211" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#8b949e">Rate Limiting</text>
<text x="473" y="224" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#8b949e">Auth / JWT Verify</text>
<text x="473" y="237" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#8b949e">Load Balancing</text>
<text x="473" y="250" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#8b949e">Routing</text>

<!-- Discover arrow to Service Registry -->
<line x1="473" y1="259" x2="473" y2="296" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#yb)"/>
<text x="484" y="282" font-family="sans-serif" font-size="9" fill="#8b949e">Discover</text>
<rect x="413" y="298" width="120" height="42" rx="3" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="473" y="316" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3" font-weight="bold">Service Registry</text>
<text x="473" y="330" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#8b949e">Consul / Eureka</text>

<!-- ── MICROSERVICES ── -->
<text x="720" y="52" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#8b949e" letter-spacing="1.5">MICROSERVICES</text>

<!-- API GW → service arrows -->
<line x1="528" y1="195" x2="582" y2="99"  stroke="#d29922" stroke-width="1.5" marker-end="url(#ya)"/>
<line x1="528" y1="210" x2="582" y2="189" stroke="#d29922" stroke-width="1.5" marker-end="url(#ya)"/>
<line x1="528" y1="230" x2="582" y2="279" stroke="#d29922" stroke-width="1.5" marker-end="url(#ya)"/>
<line x1="528" y1="248" x2="582" y2="369" stroke="#d29922" stroke-width="1.5" marker-end="url(#ya)"/>

<!-- User Service -->
<rect x="584" y="65"  width="148" height="68" rx="3" fill="none" stroke="#d29922" stroke-width="1.5"/>
<text x="658" y="85"  text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#d29922" font-weight="bold">User Service</text>
<text x="658" y="100" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"  fill="#8b949e">Node.js · REST / gRPC</text>
<text x="658" y="113" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"  fill="#8b949e">Authn, Profile, Prefs</text>
<line x1="732" y1="99" x2="766" y2="99" stroke="#8b949e" stroke-width="1" marker-end="url(#yb)"/>
<ellipse cx="820" cy="99" rx="50" ry="18" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="820" y="104" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">PostgreSQL</text>

<!-- Order Service -->
<rect x="584" y="155" width="148" height="68" rx="3" fill="none" stroke="#d29922" stroke-width="1.5"/>
<text x="658" y="175" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#d29922" font-weight="bold">Order Service</text>
<text x="658" y="191" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"  fill="#8b949e">Go · REST</text>
<text x="658" y="204" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"  fill="#8b949e">Cart, Checkout, History</text>
<line x1="732" y1="189" x2="766" y2="189" stroke="#8b949e" stroke-width="1" marker-end="url(#yb)"/>
<ellipse cx="810" cy="189" rx="40" ry="18" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="810" y="194" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">MySQL</text>

<!-- Payment Service -->
<rect x="584" y="245" width="148" height="68" rx="3" fill="none" stroke="#d29922" stroke-width="1.5"/>
<text x="658" y="265" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#d29922" font-weight="bold">Payment Service</text>
<text x="658" y="281" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"  fill="#8b949e">Java · gRPC</text>
<text x="658" y="294" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"  fill="#8b949e">Stripe, Fraud Check...</text>
<line x1="732" y1="279" x2="766" y2="279" stroke="#8b949e" stroke-width="1" marker-end="url(#yb)"/>
<ellipse cx="820" cy="279" rx="50" ry="18" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="820" y="284" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">PostgreSQL</text>

<!-- Notification Service -->
<rect x="584" y="335" width="148" height="68" rx="3" fill="none" stroke="#d29922" stroke-width="1.5"/>
<text x="658" y="355" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#d29922" font-weight="bold">Notification Service</text>
<text x="658" y="371" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"  fill="#8b949e">Python · Async (Kafka)</text>
<text x="658" y="384" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"  fill="#8b949e">Email, SMS, Push</text>
<line x1="732" y1="369" x2="766" y2="369" stroke="#8b949e" stroke-width="1" marker-end="url(#yb)"/>
<ellipse cx="810" cy="369" rx="40" ry="18" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="810" y="374" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">Redis</text>

<!-- Database-per-service label -->
<text x="810" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#d29922">Database-per-service</text>

<!-- Notification → Message Queue dashed arrow -->
<line x1="658" y1="403" x2="658" y2="423" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#yb)"/>

<!-- Message Queue box -->
<rect x="555" y="425" width="206" height="38" rx="3" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="658" y="449" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3" font-weight="bold">Message Queue (Kafka)</text>

<!-- Inter-service legend — on its own line with clear separation -->
<text x="30" y="492" font-family="ui-monospace,monospace" font-size="10" fill="#8b949e">Inter-service:  REST (sync)  |  gRPC (low-latency)  |  Kafka events (async, pub/sub)</text>
</svg>
