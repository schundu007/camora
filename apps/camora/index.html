<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var t = localStorage.getItem('camora-theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      })();
    </script>

    <meta name="theme-color" content="#0047AB" />
    <link rel="icon" type="image/png" sizes="64x64" href="/camora_favicon_64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <title>Camora – Apply, Prepare, Practice & Attend | Your AI Interview Companion</title>
    <meta name="description" content="Ace every technical interview with AI-powered prep. Practice system design, coding, and behavioral questions. Get real-time interview assistance with Lumora. Used by engineers at Google, Amazon, Meta." />

    <meta name="author" content="Camora by Cariara" />
    <link rel="icon" type="image/png" href="/camora_favicon.png" />
    <!-- Note: canonical URL is rendered per-page by the SEO component (Helmet).
         A static canonical here would conflict with deeper pages. -->

    <!-- Open Graph -->
    <meta property="og:title" content="Camora – Apply, Prepare, Practice & Attend | Your AI Interview Companion" />
    <meta property="og:description" content="Ace every technical interview with AI-powered prep. System design, coding, behavioral — all formats. Real-time interview assistance with Lumora." />
    <meta property="og:url" content="https://camora.cariara.com" />
    <meta property="og:site_name" content="Camora" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://camora.cariara.com/images/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Camora – Apply, Prepare, Practice & Attend | Your AI Interview Companion" />
    <meta name="twitter:description" content="Ace every technical interview with AI-powered prep. System design, coding, behavioral — all formats." />
    <meta name="twitter:image" content="https://camora.cariara.com/images/og-cover.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Camora",
      "alternateName": "Camora – Apply, Prepare, Practice & Attend",
      "url": "https://camora.cariara.com",
      "description": "AI-powered interview preparation platform for software engineers. Practice system design, coding, and behavioral interviews with real-time AI assistance.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free tier with limited access"
      },
      "creator": {
        "@type": "Organization",
        "name": "Cariara",
        "url": "https://cariara.com"
      },
      "featureList": [
        "AI-powered interview practice",
        "System design with architecture diagrams",
        "Coding problems with multi-approach solutions",

        "Real-time live interview assistant",

    <!-- Fonts — AWS Cloudscape parity.
         Open Sans is the UI face for the whole app. AWS's own design system
         ships Open Sans as the public stand-in for Amazon Ember (Ember is
         Amazon-proprietary and not redistributable), so this is both the
         faithful choice and the licensable one.
         Fraunces + Newsreader stay: they are the deliberate book-reading pair
         on the Lumora answer column, not UI chrome.
         Removed here: Inter, Plus Jakarta Sans, IBM Plex Mono, Source Code Pro,
         Source Serif 4, Nunito Sans, Satoshi — ten families down to four. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased text-sm">
