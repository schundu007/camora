# Android Deployment Pipeline — 5-stage with human approval gates
#
# Stage 1  [Agent]  Preflight + EAS build (waits for completion)
# Stage 2  [Human]  Approve → upload to Play Internal Testing
# Stage 3  [Agent]  eas submit → Play Internal Testing
# Stage 4  [Human]  Test on device → approve Play Store production
# Stage 5  [Agent]  Submit to Play Store production (20% rollout)
#
# Required GitHub secrets:
#   EXPO_TOKEN                       — Expo account token (EAS builds)
#   GOOGLE_SERVICE_ACCOUNT_KEY_JSON  — Contents of play-service-account.json
#
# Required GitHub environments (Settings → Environments):
#   android-play-internal-gate   — add yourself as required reviewer
#   android-play-store-gate      — add yourself as required reviewer
#
# If GOOGLE_SERVICE_ACCOUNT_KEY_JSON is absent, stages 3 and 5 post
# a direct Play Console link and skip the submission — nothing breaks,
# you upload manually.

name: Deploy Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: production
        type: choice
        options: [production, preview]
      rollout:
        description: 'Production rollout % (1–100)'
        required: false
        default: '20'
      notes:
        description: 'Release notes (shown in job summary)'
        required: false
        default: ''

concurrency:
  group: deploy-android
  cancel-in-progress: false

jobs:

  # ──────────────────────────────────────────────────────────────────
  # STAGE 1  [Agent]  Preflight + EAS build
  # ──────────────────────────────────────────────────────────────────
  build:
    name: '[Agent] Preflight + EAS build'
    runs-on: ubuntu-latest
    outputs:
      build-id: ${{ steps.eas-build.outputs.build_id }}
      build-url: ${{ steps.eas-build.outputs.build_url }}
      app-version: ${{ steps.eas-build.outputs.app_version }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Preflight — EXPO_TOKEN is set
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi

      - name: Preflight — service account secret present
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}" ]; then
            echo "::warning::GOOGLE_SERVICE_ACCOUNT_KEY_JSON is not set. Stages 3 and 5 will post manual links instead of submitting automatically."
          fi

      - name: Preflight — rollout input is valid
        run: |
          ROLLOUT="${{ inputs.rollout }}"
          if ! [[ "$ROLLOUT" =~ ^[0-9]+$ ]] || [ "$ROLLOUT" -lt 1 ] || [ "$ROLLOUT" -gt 100 ]; then
            echo "::error::rollout must be an integer between 1 and 100. Got: $ROLLOUT"
            exit 1
          fi

      - name: Build Android (waits for completion)
        id: eas-build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_JSON=$(eas build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait \
            --json 2>/dev/null)

          BUILD_ID=$(echo "$BUILD_JSON"    | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log(d.id||d[0]?.id||'')")
          BUILD_URL=$(echo "$BUILD_JSON"   | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); const b=d.id?d:d[0]; console.log(b?.artifacts?.buildUrl||b?.buildUrl||'')")
          APP_VERSION=$(echo "$BUILD_JSON" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); const b=d.id?d:d[0]; console.log(b?.appVersion||b?.runtimeVersion||'unknown')")

          echo "build_id=$BUILD_ID"       >> "$GITHUB_OUTPUT"
          echo "build_url=$BUILD_URL"     >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

          echo "### Stage 1 complete — Android build finished" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build ID      | \`$BUILD_ID\` |"      >> "$GITHUB_STEP_SUMMARY"
          echo "| App version   | \`$APP_VERSION\` |"   >> "$GITHUB_STEP_SUMMARY"
          echo "| Build profile | \`${{ inputs.profile }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact      | [Download]($BUILD_URL) |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.notes }}" ]; then
            echo "| Release notes | ${{ inputs.notes }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────────────────────────
  # STAGE 2  [Human]  Approve upload to Play Internal Testing
  #
  # Gate: Settings → Environments → android-play-internal-gate,
  #       add yourself as a required reviewer.
  # GitHub emails you when the build is ready. Click "Review pending
  # deployments" → "Approve" to continue.
  # ──────────────────────────────────────────────────────────────────
  gate-play-internal:
    name: '[Human] Approve Play Internal upload'
    needs: build
    runs-on: ubuntu-latest
    environment: android-play-internal-gate

    steps:
      - name: Gate summary
        run: |
          echo "### Stage 2 — Play Internal gate passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Build \`${{ needs.build.outputs.build-id }}\` approved for Play Internal Testing." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Before approving, verify:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build artifact downloads cleanly" >> "$GITHUB_STEP_SUMMARY"
          echo "- App version matches expected semver" >> "$GITHUB_STEP_SUMMARY"
          echo "- No debug flags or test endpoints in production build" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────
  # STAGE 3  [Agent]  Submit to Play Internal Testing
  # ──────────────────────────────────────────────────────────────────
  upload-play-internal:
    name: '[Agent] Submit to Play Internal Testing'
    needs: [build, gate-play-internal]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write service account key
        env:
          SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          if [ -n "$SA_KEY" ]; then
            mkdir -p apps/mobile/store
            echo "$SA_KEY" > apps/mobile/store/play-service-account.json
          fi

      - name: Submit to Play Internal Testing
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -f store/play-service-account.json ]; then
            eas submit \
              --platform android \
              --id ${{ needs.build.outputs.build-id }} \
              --track internal \
              --non-interactive
          else
            PLAY_URL="https://play.google.com/console/developers"
            echo "::warning::GOOGLE_SERVICE_ACCOUNT_KEY_JSON not set — skipping automated submission."
            echo "Upload the AAB manually: $PLAY_URL"
            echo "### Stage 3 — manual action required" >> "$GITHUB_STEP_SUMMARY"
            echo "GOOGLE_SERVICE_ACCOUNT_KEY_JSON not set. [Upload to Play Internal manually]($PLAY_URL)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove service account key
        if: always()
        run: rm -f apps/mobile/store/play-service-account.json

      - name: Stage 3 summary
        run: |
          echo "### Stage 3 complete — uploaded to Play Internal Testing" >> "$GITHUB_STEP_SUMMARY"
          echo "**Next:** Install via the opt-in link in Play Console, run the device checklist, then approve the Play Store gate." >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────
  # STAGE 4  [Human]  Device testing → approve Play Store production
  #
  # Gate: Settings → Environments → android-play-store-gate.
  # Install via the opt-in link in Play Console Internal Testing.
  # Run the checklist:
  #   [ ] Login flow
  #   [ ] Prep tab — topic navigation works
  #   [ ] Live tab — mic consent → record → transcript appears
  #   [ ] Sona answers render library context
  #   [ ] Account → Delete account flow works
  # Click Approve only after all checks pass.
  # ──────────────────────────────────────────────────────────────────
  gate-play-store:
    name: '[Human] Device test + approve Play Store'
    needs: upload-play-internal
    runs-on: ubuntu-latest
    environment: android-play-store-gate

    steps:
      - name: Gate summary
        run: |
          echo "### Stage 4 — Play Store gate passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Device testing approved. Rolling out to Play Store production at ${{ inputs.rollout }}%." >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────
  # STAGE 5  [Agent]  Submit to Play Store production
  #
  # Submits to the production track at the rollout % specified above
  # (default 20%). Monitor Play Console for crashes for 24 hrs before
  # increasing to 100% manually.
  #
  # If GOOGLE_SERVICE_ACCOUNT_KEY_JSON is absent, posts a direct Play
  # Console link and exits cleanly.
  # ──────────────────────────────────────────────────────────────────
  submit-play-store:
    name: '[Agent] Submit to Play Store production'
    needs: [build, gate-play-store]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write service account key
        env:
          SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          if [ -n "$SA_KEY" ]; then
            mkdir -p apps/mobile/store
            echo "$SA_KEY" > apps/mobile/store/play-service-account.json
          fi

      - name: Submit to Play Store production
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ROLLOUT_PCT: ${{ inputs.rollout }}
        run: |
          if [ -f store/play-service-account.json ]; then
            ROLLOUT_FRAC=$(node -e "console.log(Number(process.env.ROLLOUT_PCT) / 100)")
            eas submit \
              --platform android \
              --id ${{ needs.build.outputs.build-id }} \
              --track production \
              --rollout "$ROLLOUT_FRAC" \
              --non-interactive
          else
            PLAY_URL="https://play.google.com/console/developers"
            echo "::warning::GOOGLE_SERVICE_ACCOUNT_KEY_JSON not set — skipping automated submission."
            echo "Promote to Production manually: $PLAY_URL"
            echo "### Stage 5 — manual action required" >> "$GITHUB_STEP_SUMMARY"
            echo "GOOGLE_SERVICE_ACCOUNT_KEY_JSON not set. [Promote to Production manually]($PLAY_URL)." >> "$GITHUB_STEP_SUMMARY"
            echo "Set rollout to **${{ inputs.rollout }}%** in Play Console." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove service account key
        if: always()
        run: rm -f apps/mobile/store/play-service-account.json

      - name: Final pipeline summary
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pipeline complete" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Role | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 1 Build                 | Agent | ✓ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 2 Play Internal gate    | Human | ✓ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 3 Upload                | Agent | ✓ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 4 Device test gate      | Human | ✓ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 5 Play Store production | Agent | ✓ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Rollout:** ${{ inputs.rollout }}% — monitor Play Console for crashes before ramping to 100%." >> "$GITHUB_STEP_SUMMARY"
