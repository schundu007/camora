name: Deploy Frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'apps/camora/**'
      - 'packages/shared-types/**'

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://camora.cariara.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/camora
        run: pnpm build
        env:
          VITE_LUMORA_API_URL: ${{ secrets.VITE_LUMORA_API_URL }}
          VITE_CAPRA_API_URL: ${{ secrets.VITE_CAPRA_API_URL }}
          VITE_OAUTH_URL: ${{ secrets.VITE_OAUTH_URL }}
          VITE_ASCEND_URL: ${{ secrets.VITE_ASCEND_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy to Vercel (production)
        if: github.event.inputs.environment != 'preview'
        run: |
          npx vercel --prod \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --cwd apps/camora
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (preview)
        if: github.event.inputs.environment == 'preview'
        id: preview
        run: |
          URL=$(npx vercel \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --cwd apps/camora)
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summarise deploy
        run: |
          echo "### Frontend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://camora.cariara.com" >> $GITHUB_STEP_SUMMARY
