          }

          T=()
          add "ghcr.io/${{ env.OWNER }}/camora/${SVC}"
          [[ "$PUSH_ECR" == "true" && "$DO_PUSH" == "true" && -n "$AWS_ACCOUNT_ID" ]] && \
            add "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${SVC}"
          [[ "$PUSH_ACR" == "true" && "$DO_PUSH" == "true" && -n "$ACR_SERVER" ]] && \
            add "${ACR_SERVER}/${SVC}"
          [[ "$PUSH_GAR" == "true" && "$DO_PUSH" == "true" && -n "$GCP_PROJECT" ]] && \
            add "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPO}/${SVC}"
          [[ "$PUSH_HUB" == "true" && "$DO_PUSH" == "true" && -n "$HUB_USER" ]] && \
            add "${HUB_USER}/${SVC}"

          JOINED=$(IFS=,; echo "${T[*]}")
          echo "tags=${JOINED}" >> $GITHUB_OUTPUT
          echo "Tags:"; printf '  %s\n' "${T[@]}"

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: apps/ai-services
          platforms: ${{ needs.preflight.outputs.platforms }}
          push: ${{ needs.preflight.outputs.do_push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=ai-services
          cache-to: type=gha,mode=max,scope=ai-services
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.title=Camora AI Services
            org.opencontainers.image.description=Speaker verification + diagram generation (FastAPI Python 3.11)
            org.opencontainers.image.vendor=Camora
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ai-services"
            echo "**Status:** $([[ "${{ steps.build.outcome }}" == "success" ]] && echo "✅ Success" || echo "❌ Failed")"
            [[ -n "${{ steps.build.outputs.digest }}" ]] && echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""; echo "**Tags:**"
            echo '${{ steps.tags.outputs.tags }}' | tr ',' '\n' | sed 's/^/- `/' | sed 's/$/`/'
          } >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────────────────────
# SCAN — Trivy vulnerability scan on all pushed images
# ─────────────────────────────────────────────────────────────────────────────
  scan-images:
    name: Trivy scan — ${{ matrix.service }}
    needs: [preflight, build-lumora-backend, build-ascend-backend, build-ai-services]
    if: always() && needs.preflight.outputs.do_push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [lumora-backend, ascend-backend, ai-services]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/camora/${{ matrix.service }}:latest
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
