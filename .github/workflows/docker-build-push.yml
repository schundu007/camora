name: Docker Build & Push

# Builds all backend service images and pushes to every configured registry.
#
# Registry configuration lives in .github/registries.json — add new registries
# there; this workflow needs no changes.
#
# To enable a registry, add the required secrets in:
#   GitHub → Settings → Secrets and variables → Actions
# The preflight job will report which are active before each build.

on:
  push:
    branches: [main]
    paths:
      - 'apps/lumora-backend/**'
      - 'apps/ascend-backend/**'
      - 'apps/ai-services/**'
      - 'packages/shared-db/**'
      - 'packages/shared-auth/**'
      - 'packages/shared-types/**'
      - '.github/registries.json'
      - '.github/scripts/**'
      - '.github/workflows/docker-build-push.yml'

  pull_request:
    branches: [main]
    paths:
      - 'apps/lumora-backend/**'
      - 'apps/ascend-backend/**'
      - 'apps/ai-services/**'

  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (all | lumora-backend | ascend-backend | ai-services)'
        required: true
        default: all
        type: choice
        options: [all, lumora-backend, ascend-backend, ai-services]
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64'
        type: choice
        options: ['linux/amd64', 'linux/amd64,linux/arm64']

concurrency:
  group: docker-build-${{ github.sha }}
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# PREFLIGHT — reads .github/registries.json, reports which are active
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    outputs:
      do_push: ${{ steps.check.outputs.do_push }}
      platforms: ${{ steps.check.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Check active registries
        id: check
        # Pass every possible registry secret as an env var so the script can
        # inspect presence without ever printing values (GitHub masks them).
        env:
          # AWS ECR
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # Azure ACR
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          # Google Artifact Registry
          GAR_JSON_KEY: ${{ secrets.GAR_JSON_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
          # Docker Hub
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # Harbor
          HARBOR_URL: ${{ secrets.HARBOR_URL }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          # Quay.io
          QUAY_REGISTRY: ${{ secrets.QUAY_REGISTRY }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          # JFrog Artifactory
          JFROG_REGISTRY: ${{ secrets.JFROG_REGISTRY }}
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
        run: |
          bash .github/scripts/registry-preflight.sh

          DO_PUSH=$([[ "${{ github.event_name }}" == "pull_request" ]] && echo "false" || echo "true")
          PLATFORMS="${{ inputs.platforms || 'linux/amd64' }}"

          echo "do_push=${DO_PUSH}" >> $GITHUB_OUTPUT
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
          echo ""
          echo "Push mode : $([[ "$DO_PUSH" == "false" ]] && echo "DRY RUN (PR)" || echo "LIVE")"
          echo "Platforms : ${PLATFORMS}"

# ─────────────────────────────────────────────────────────────────────────────
# BUILD — matrix over services; registry logic is entirely in the scripts
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.service }}
    needs: preflight
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.service == 'all' ||
      inputs.service == matrix.service
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # OIDC for future keyless signing

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: lumora-backend
            context: apps/lumora-backend
          - service: ascend-backend
            context: apps/ascend-backend
          - service: ai-services
            context: apps/ai-services

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: needs.preflight.outputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # One step — the script handles login for every configured registry
      - name: Login to registries + generate tags
        id: tags
        env:
          SERVICE: ${{ matrix.service }}
          DO_PUSH: ${{ needs.preflight.outputs.do_push }}
          # GITHUB_TOKEN + GITHUB_ACTOR are built-in
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AWS ECR
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # Azure ACR
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          # Google Artifact Registry
          GAR_JSON_KEY: ${{ secrets.GAR_JSON_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
          # Docker Hub
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # Harbor
          HARBOR_URL: ${{ secrets.HARBOR_URL }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          # Quay.io
          QUAY_REGISTRY: ${{ secrets.QUAY_REGISTRY }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          # JFrog Artifactory
          JFROG_REGISTRY: ${{ secrets.JFROG_REGISTRY }}
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          IS_MAIN=$([[ "$GITHUB_REF_NAME" == "main" ]] && echo "true" || echo "false")

          bash .github/scripts/registry-build.sh \
            "$SERVICE" "$SHORT_SHA" "$BRANCH" "$IS_MAIN" "$DO_PUSH"

      - name: Build and push ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ needs.preflight.outputs.platforms }}
          push: ${{ needs.preflight.outputs.do_push == 'true' }}
          tags: ${{ steps.tags.outputs.DOCKER_TAGS }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.title=Camora ${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Camora

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.service }}"
            echo "**Status:** $([[ "${{ steps.build.outcome }}" == "success" ]] && echo "✅ Success" || echo "❌ Failed")"
            [[ -n "${{ steps.build.outputs.digest }}" ]] && \
              echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "**Tags:**"
            echo '${{ steps.tags.outputs.DOCKER_TAGS }}' | \
              tr ',' '\n' | sed 's/^/- `/' | sed 's/$/`/'
          } >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────────────────────
# SCAN — Trivy vulnerability scan (runs after successful push to main)
# ─────────────────────────────────────────────────────────────────────────────
  scan-images:
    name: Trivy — ${{ matrix.service }}
    needs: [preflight, build]
    if: always() && needs.preflight.outputs.do_push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [lumora-backend, ascend-backend, ai-services]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/camora/${{ matrix.service }}:latest
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
