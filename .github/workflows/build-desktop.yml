name: Build Desktop

on:
  push:
    branches: [main]
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload artifacts to (e.g. desktop-v2.1.0)'
        required: true

jobs:
  # ── Windows build matrix (x64 + arm64) ─────────────────────────────────
  # CI builds Windows ONLY — macOS DMGs are produced locally on a Mac and
  # uploaded separately, so we don't spend macOS runner minutes here. Both
  # arches build in parallel on windows-latest (electron-builder cross-compiles
  # the arm64 NSIS target). The publish job leaves existing macOS release assets
  # untouched — it only replaces the Windows installers it uploads.
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            os: windows-latest
            script: build:win
            artifact: apps/desktop/build/Camora-*-Setup.exe
          - name: win-arm64
            os: windows-latest
            script: build:win-arm64
            artifact: apps/desktop/build/Camora-*-Setup-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm install

      # Stamp a UNIQUE build number every run. Marketing version stays 1.0.0
      # (CFBundleShortVersionString); this becomes CFBundleVersion, which macOS
      # uses to tell builds apart. Without it, every build was byte-identical
      # "1.0.0" and LaunchServices kept launching the stale cached app.
      #
      # The +2000 offset exists because hand-built local DMGs have stamped
      # numbers as high as 1.0.1404, while the CI run counter was still at 995.
      # A CI build numbered BELOW an installed local build reintroduces the same
      # stale-app bug from the other direction, so CI is offset to always win.
      # Never lower this offset — CFBundleVersion must only ever increase.
      #
      # The arithmetic MUST happen in the shell. GitHub Actions expressions have
      # no arithmetic operators at all (only !, comparisons, && and ||), so
      # `${{ 2000 + github.run_number }}` is not a valid expression — it fails
      # the whole workflow file at parse time, before any job starts. That is
      # why every push from 2026-08-06 to 2026-08-12 showed a 0s "workflow file
      # issue" failure and shipped no Windows installer.
      #
      # `shell: bash` is explicit because these runners are windows-latest and
      # would otherwise default to pwsh, where $(( )) is not arithmetic. Git Bash
      # ships on the Windows runner image, so this is portable as written.
      - name: Stamp unique build version
        working-directory: apps/desktop
        shell: bash
        run: npm pkg set build.buildVersion="1.0.$(( 2000 + ${{ github.run_number }} ))"

      - name: Build ${{ matrix.name }}
        working-directory: apps/desktop
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.artifact }}

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Determine release target
        id: rel
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            # Branch push → single canonical rolling release, always marked
            # Latest so GitHub's "Latest" download is ALWAYS the newest build
            # (never a frozen old tag). The DMG name is stable; assets are
            # replaced in place each push.
            echo "tag=desktop-v1.0.0" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "name=Camora Desktop v1.0.0 (build 1.0.${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          make_latest: 'true'
          files: dist/**
          fail_on_unmatched_files: true
