name: Build Desktop

on:
  push:
    branches: [main]
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload artifacts to (e.g. desktop-v2.1.0)'
        required: true

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm install

      # Stamp a UNIQUE build number every run. Marketing version stays 1.0.0
      # (CFBundleShortVersionString); this becomes CFBundleVersion, which macOS
      # uses to tell builds apart. Without it, every build was byte-identical
      # "1.0.0" and LaunchServices kept launching the stale cached app.
      - name: Stamp unique build version
        working-directory: apps/desktop
        run: npm pkg set build.buildVersion="1.0.${{ github.run_number }}"

      - name: Build arm64 DMG
        working-directory: apps/desktop
        run: npm run build:dmg

      - name: Build x64 (Intel) DMG
        working-directory: apps/desktop
        run: npm run build:dmg-x64

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmgs
          path: apps/desktop/build/Camora-*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Stamp unique build version
        working-directory: apps/desktop
        run: npm pkg set build.buildVersion="1.0.${{ github.run_number }}"

      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: apps/desktop/build/Camora-*-Setup.exe

  publish:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Determine release target
        id: rel
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            # Branch push → single canonical rolling release, always marked
            # Latest so GitHub's "Latest" download is ALWAYS the newest build
            # (never a frozen old tag). The DMG name is stable; assets are
            # replaced in place each push.
            echo "tag=desktop-v1.0.0" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "name=Camora Desktop v1.0.0 (build 1.0.${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          make_latest: 'true'
          files: dist/**
          fail_on_unmatched_files: true
