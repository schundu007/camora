name: Build Desktop

on:
  push:
    branches: [main]
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload artifacts to (e.g. desktop-v2.1.0)'
        required: true

jobs:
  # ── Windows build (ONE dual-arch installer) ────────────────────────────
  # CI builds Windows ONLY — macOS DMGs are produced locally on a Mac and
  # uploaded separately, so we don't spend macOS runner minutes here. The
  # publish job leaves existing macOS release assets untouched; it only replaces
  # the Windows installer it uploads.
  #
  # This was a two-job x64/arm64 matrix until 2026-08-12. It never built two
  # things. package.json sets build.win.target[0].arch = ["x64","arm64"], which
  # overrides the --x64 / --arm64 CLI flags, so BOTH jobs packaged both arches
  # and emitted a complete dual-arch NSIS — verified in run 31633200388:
  #     job win-x64:   building target=nsis file=Camora-1.0.0-Setup.exe        archs=x64, arm64
  #     job win-arm64: building target=nsis file=Camora-1.0.0-Setup-arm64.exe  archs=arm64, x64
  # Identical content (202,194,722 bytes each), shipped under two names. The
  # "-arm64" one was the misleading half: an x64 user who picked it got a
  # working installer, which is exactly why nobody noticed.
  #
  # One job, one installer, one download link that works on both architectures.
  # The cost is a ~200 MB download carrying both arches; the alternative is
  # per-arch installers via -c.win.target.0.arch, which is smaller but puts a
  # "which one am I?" question in front of every user. Not worth it for a
  # desktop app people install once.
  build:
    name: build win
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm install

      # Stamp a UNIQUE build number every run. Marketing version stays 1.0.0
      # (CFBundleShortVersionString); this becomes CFBundleVersion, which macOS
      # uses to tell builds apart. Without it, every build was byte-identical
      # "1.0.0" and LaunchServices kept launching the stale cached app.
      #
      # The +2000 offset exists because hand-built local DMGs have stamped
      # numbers as high as 1.0.1404, while the CI run counter was still at 995.
      # A CI build numbered BELOW an installed local build reintroduces the same
      # stale-app bug from the other direction, so CI is offset to always win.
      # Never lower this offset — CFBundleVersion must only ever increase.
      #
      # The arithmetic MUST happen in the shell. GitHub Actions expressions have
      # no arithmetic operators at all (only !, comparisons, && and ||), so
      # `${{ 2000 + github.run_number }}` is not a valid expression — it fails
      # the whole workflow file at parse time, before any job starts. That is
      # why every push from 2026-08-06 to 2026-08-12 showed a 0s "workflow file
      # issue" failure and shipped no Windows installer.
      #
      # `shell: bash` is explicit because these runners are windows-latest and
      # would otherwise default to pwsh, where $(( )) is not arithmetic. Git Bash
      # ships on the Windows runner image, so this is portable as written.
      - name: Stamp unique build version
        working-directory: apps/desktop
        shell: bash
        run: npm pkg set build.buildVersion="1.0.$(( 2000 + ${{ github.run_number }} ))"

      # Retried because electron-builder downloads its toolchain (winCodeSign,
      # nsis) from GitHub releases DURING the build, and a 503 there fails the
      # whole run and publishes nothing — which is what happened on 22e5a5f7,
      # twenty minutes after the identical desktop code built clean.
      #
      # Nothing here is idempotency-sensitive: electron-builder rebuilds into
      # build/ from scratch and caches whatever it did manage to fetch, so a
      # second attempt resumes rather than repeating the whole download.
      - name: Build Windows installer
        working-directory: apps/desktop
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run build:win; then exit 0; fi
            echo "::warning::build:win failed (attempt ${attempt}/3) — retrying in 30s"
            sleep 30
          done
          echo "::error::build:win failed 3 times — not a transient download failure"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: apps/desktop/build/Camora-*-Setup.exe

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Determine release target
        id: rel
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            # Branch push → single canonical rolling release, always marked
            # Latest so GitHub's "Latest" download is ALWAYS the newest build
            # (never a frozen old tag). The DMG name is stable; assets are
            # replaced in place each push.
            echo "tag=desktop-v1.0.0" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            # Must carry the SAME +2000 offset the build step stamps as
            # CFBundleVersion, or the release title names a build number that
            # exists nowhere: run 1007 published "build 1.0.1007" while the app
            # inside reported 1.0.3007. The offset exists precisely so "which
            # build is this?" has one answer — a title that disagrees with the
            # binary defeats it. Keep these two lines in sync.
            echo "name=Camora Desktop v1.0.0 (build 1.0.$(( 2000 + ${{ github.run_number }} )))" >> $GITHUB_OUTPUT
          fi

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          make_latest: 'true'
          files: dist/**
          fail_on_unmatched_files: true
