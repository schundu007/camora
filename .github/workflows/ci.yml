name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # ── Change detection ──────────────────────────────────────────────────────
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      camora:          ${{ steps.filter.outputs.camora }}
      lumora-backend:  ${{ steps.filter.outputs.lumora-backend }}
      ascend-backend:  ${{ steps.filter.outputs.ascend-backend }}
      ai-services:     ${{ steps.filter.outputs.ai-services }}
      mobile:          ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            camora:
              - 'apps/camora/**'
              - 'packages/shared-types/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
            lumora-backend:
              - 'apps/lumora-backend/**'
              - 'packages/shared-db/**'
              - 'packages/shared-auth/**'
              - 'packages/shared-llm/**'
              - 'packages/shared-types/**'
            ascend-backend:
              - 'apps/ascend-backend/**'
              - 'packages/shared-db/**'
              - 'packages/shared-auth/**'
              - 'packages/shared-llm/**'
              - 'packages/shared-types/**'
            ai-services:
              - 'apps/ai-services/**'
            mobile:
              - 'apps/mobile/**'
              - 'packages/**'

  # ── Frontend ──────────────────────────────────────────────────────────────
  ci-camora:
    name: "Frontend (camora) — typecheck, lint, build"
    needs: detect-changes
    if: needs.detect-changes.outputs.camora == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/camora
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: apps/camora
        run: pnpm lint

      - name: Build
        working-directory: apps/camora
        run: pnpm build
        env:
          VITE_LUMORA_API_URL: https://lumora.up.railway.app
          VITE_CAPRA_API_URL: https://ascend.up.railway.app
          VITE_OAUTH_URL: https://ascend.up.railway.app/api/auth/google/login
          VITE_ASCEND_URL: https://ascend.up.railway.app
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: camora-dist-${{ github.sha }}
          path: apps/camora/dist/
          retention-days: 3

  # ── Lumora backend ────────────────────────────────────────────────────────
  ci-lumora-backend:
    name: "Lumora backend — test"
    needs: detect-changes
    if: needs.detect-changes.outputs.lumora-backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: apps/lumora-backend
        run: pnpm test -- --run
        env:
          NODE_ENV: test

  # ── Ascend backend ────────────────────────────────────────────────────────
  ci-ascend-backend:
    name: "Ascend backend — test"
    needs: detect-changes
    if: needs.detect-changes.outputs.ascend-backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: apps/ascend-backend
        run: pnpm test -- --run
        env:
          NODE_ENV: test

  # ── AI services ───────────────────────────────────────────────────────────
  ci-ai-services:
    name: "AI services — lint, validate"
    needs: detect-changes
    if: needs.detect-changes.outputs.ai-services == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ai-services/requirements.txt

      - name: Install dependencies
        working-directory: apps/ai-services
        run: python3 -m pip install -r requirements.txt ruff

      - name: Lint with ruff
        working-directory: apps/ai-services
        run: ruff check .

      - name: Validate app loads
        working-directory: apps/ai-services
        run: python -c "import importlib.util; spec=importlib.util.spec_from_file_location('main','main.py'); print('FastAPI app syntax OK')"
        env:
          AI_SERVICES_API_KEY: ci-placeholder

  # ── CI gate ───────────────────────────────────────────────────────────────
  ci-complete:
    name: CI complete
    needs:
      - detect-changes
      - ci-camora
      - ci-lumora-backend
      - ci-ascend-backend
      - ci-ai-services
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          RESULTS='${{ toJSON(needs) }}'
          FAILED=$(echo "$RESULTS" | python3 -c "import json,sys; needs=json.load(sys.stdin); print(' '.join(k for k,v in needs.items() if v.get('result')=='failure'))")
          if [ -n "$FAILED" ]; then
            echo "Failed jobs: $FAILED"
            exit 1
          fi
          echo "All CI checks passed (skipped jobs mean no changes detected)"
