name: Refresh Trending Infra

# Rebuilds docs/trending-infra.md + data/trending.json from the GitHub Search API.
# GitHub has no official trending API, so the list is computed (see the script).

on:
  schedule:
    - cron: '0 9 * * 1'   # every Monday 09:00 UTC
  workflow_dispatch: {}    # allow manual runs from the Actions tab

concurrency:
  group: trending-infra
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch & commit trending list
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch trending projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/trending-infra/fetch-trending.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/trending-infra.md docs/trending-infra.html data/trending.json; then
            echo "No changes to trending list."
            exit 0
          fi
          git add docs/trending-infra.md docs/trending-infra.html data/trending.json
          git commit -m "chore(trending): weekly refresh of trending infra projects"
          git push
