name: Deploy Backends to Railway

# Triggered after Docker images are built and pushed
on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types: [completed]
    branches: [main]

  # Also allow manual deploys
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - lumora-backend
          - ascend-backend
          - ai-services

concurrency:
  group: deploy-railway-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # ── Lumora backend ────────────────────────────────────────────────────────
  deploy-lumora:
    name: Deploy lumora-backend
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.service == 'all' || github.event.inputs.service == 'lumora-backend'))
    environment:
      name: production
      url: ${{ secrets.LUMORA_API_URL }}
    steps:
      - name: Trigger Railway deploy
        run: |
          echo "Deploying lumora-backend..."
          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_LUMORA }}")
          cat /tmp/response.txt
          echo "HTTP $STATUS"
          [[ "$STATUS" =~ ^2 ]] || (echo "Railway deploy hook failed" && exit 1)

  # ── Ascend backend ────────────────────────────────────────────────────────
  deploy-ascend:
    name: Deploy ascend-backend
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.service == 'all' || github.event.inputs.service == 'ascend-backend'))
    environment:
      name: production
      url: ${{ secrets.ASCEND_API_URL }}
    steps:
      - name: Trigger Railway deploy
        run: |
          echo "Deploying ascend-backend..."
          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_ASCEND }}")
          cat /tmp/response.txt
          echo "HTTP $STATUS"
          [[ "$STATUS" =~ ^2 ]] || (echo "Railway deploy hook failed" && exit 1)

  # ── AI services ───────────────────────────────────────────────────────────
  deploy-ai-services:
    name: Deploy ai-services
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.service == 'all' || github.event.inputs.service == 'ai-services'))
    environment:
      name: production
      url: ${{ secrets.AI_SERVICES_URL }}
    steps:
      - name: Trigger Railway deploy
        run: |
          echo "Deploying ai-services..."
          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_AI_SERVICES }}")
          cat /tmp/response.txt
          echo "HTTP $STATUS"
          [[ "$STATUS" =~ ^2 ]] || (echo "Railway deploy hook failed" && exit 1)

  # ── Post-deploy health checks ─────────────────────────────────────────────
  health-checks:
    name: Post-deploy health checks
    needs: [deploy-lumora, deploy-ascend, deploy-ai-services]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway rollout (45s)
        run: sleep 45

      - name: Health check — lumora-backend
        run: |
          URL="${{ secrets.LUMORA_API_URL }}/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          echo "lumora-backend /health: HTTP $STATUS"
          [[ "$STATUS" == "200" ]] || echo "::warning::lumora-backend health returned $STATUS"

      - name: Health check — ascend-backend
        run: |
          URL="${{ secrets.ASCEND_API_URL }}/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          echo "ascend-backend /health: HTTP $STATUS"
          [[ "$STATUS" == "200" ]] || echo "::warning::ascend-backend health returned $STATUS"

      - name: Health check — ai-services
        run: |
          URL="${{ secrets.AI_SERVICES_URL }}/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          echo "ai-services /health: HTTP $STATUS"
          [[ "$STATUS" == "200" ]] || echo "::warning::ai-services health returned $STATUS"

      - name: Deploy summary
        run: |
          echo "### Railway Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| lumora-backend | ${{ secrets.LUMORA_API_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ascend-backend | ${{ secrets.ASCEND_API_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ai-services | ${{ secrets.AI_SERVICES_URL }} |" >> $GITHUB_STEP_SUMMARY
